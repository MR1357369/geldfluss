<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3d2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Geldfluss">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f3d2e'/%3E%3Ctext x='50' y='70' font-size='60' text-anchor='middle'%3E%F0%9F%92%B6%3C/text%3E%3C/svg%3E">
<title>Geldfluss – Raus aus dem Hamsterrad</title>
<style>
:root{
  --bg:#f4f1ea; --panel:#fffdf8; --ink:#1d2a24; --muted:#6b756f; --line:#e3ddd0;
  --green:#0f3d2e; --accent:#d9a62e; --good:#2e7d32; --bad:#c62828;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
header{background:var(--green);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:20px;margin:0;letter-spacing:.5px}
header h1 span{color:var(--accent)}
header .sp{flex:1}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:8px 14px;background:var(--green);color:#fff;font-weight:600}
button:hover{filter:brightness(1.15)}
button:disabled{opacity:.4;cursor:not-allowed;filter:none}
button.sec{background:#e9e4d8;color:var(--ink)}
button.gold{background:var(--accent);color:#1d2a24}
button.red{background:var(--bad)}
button.sm{padding:4px 9px;font-size:13px;border-radius:6px}
input,select{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:#fff}
main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;padding:16px;max-width:1300px;margin:0 auto}
@media(max-width:980px){main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
/* Board */
.board{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(7,1fr);gap:5px;aspect-ratio:1;max-width:720px;margin:0 auto}
.cell{border-radius:9px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:600;text-align:center;position:relative;padding:2px;min-height:0;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.cell .ic{font-size:22px;line-height:1.1}
@media(max-width:600px){.cell .ic{font-size:16px}.cell .lb{display:none}}
.cell.hl{outline:3px solid var(--accent);outline-offset:1px}
.tokens{position:absolute;bottom:2px;left:2px;right:2px;display:flex;gap:2px;justify-content:center;flex-wrap:wrap}
.tok{width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.center{grid-row:2/7;grid-column:2/7;background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px;text-align:center}
.center h2{margin:0;font-size:20px}
.dice{display:flex;gap:10px}
.die{width:54px;height:54px;border-radius:10px;background:#fff;border:2px solid var(--ink);font-size:30px;font-weight:800;display:flex;align-items:center;justify-content:center}
.die.roll{animation:sh .4s}
@keyframes sh{0%{transform:rotate(0)}25%{transform:rotate(-20deg)}50%{transform:rotate(15deg)}100%{transform:rotate(0)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
/* Sheet */
.ptabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.ptab{padding:5px 10px;border-radius:20px;background:#eee8da;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.ptab.act{background:var(--green);color:#fff}
.ptab .tok{width:11px;height:11px;border-width:1px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:14px 0 6px}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:3px 2px;border-bottom:1px dashed var(--line);vertical-align:middle}
td.r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:700;border-bottom:2px solid var(--ink)}
.big{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:#f0ebdf;border-radius:10px;padding:8px 10px}
.kpi b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted);font-size:12px}
.pos{color:var(--good)} .neg{color:var(--bad)}
.bar{height:12px;background:#e6e0d2;border-radius:6px;overflow:hidden;margin-top:6px}
.bar div{height:100%;background:linear-gradient(90deg,var(--accent),var(--good));transition:width .4s}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.log{max-height:220px;overflow:auto;font-size:13px;color:#39443e}
.log div{padding:3px 0;border-bottom:1px solid #f0ebe0}
/* Modal */
.ov{position:fixed;inset:0;background:rgba(15,25,20,.55);display:flex;align-items:center;justify-content:center;padding:14px;z-index:10}
.modal{background:var(--panel);border-radius:14px;max-width:520px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.mh{padding:14px 18px;color:#fff;border-radius:14px 14px 0 0;font-weight:700;font-size:18px;display:flex;gap:10px;align-items:center}
.mb{padding:16px 18px}
.mb p{margin:0 0 10px}
.mf{padding:0 18px 16px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.facts{display:grid;grid-template-columns:1fr auto;gap:4px 14px;background:#f3eee2;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14px}
.facts span:nth-child(even){text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.sellrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
/* Setup */
.setup{max-width:640px;margin:30px auto;padding:0 16px}
.setup .panel{padding:22px}
.prow{display:grid;grid-template-columns:22px 1fr 1fr;gap:8px;align-items:center;margin-bottom:8px}
.hint{color:var(--muted);font-size:13px}
.hidden{display:none!important}
.pcard input[type=text],.pcard input:not([type]){min-width:0;width:100%}
.setup,.setup .panel{min-width:0;overflow:hidden}
.pcard{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:6px 8px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff}
.pcard .psel{grid-column:2/4;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px;min-width:0}
.pcard select{min-width:0;width:100%}
.aichk{font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:4px;cursor:pointer}
.aichk input{width:18px;height:18px;min-height:0}
.owners{position:absolute;top:2px;right:2px;display:flex;gap:1px}
.tok.own{width:9px;height:9px;border-width:1px}
.board.fastboard{background:linear-gradient(135deg,#f6e7b8,#e9c96b);padding:6px;border-radius:14px}
.board.fastboard .center{background:#fffaf0}
table.results td{padding:7px 4px;vertical-align:top}
.cmini{width:80%;max-width:220px}
.cmini .bar{height:8px;margin-top:3px}
/* Touch & Mobil */
html{-webkit-text-size-adjust:100%}
body{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
header{padding-top:calc(10px + env(safe-area-inset-top));padding-left:calc(16px + env(safe-area-inset-left));padding-right:calc(16px + env(safe-area-inset-right))}
@media (pointer:coarse){
  button{min-height:44px}
  button.sm{min-height:38px;padding:6px 12px}
  input,select{font-size:16px;min-height:44px}
}
#mnav{display:none}
@media(max-width:760px){
  header .hint{display:none}
  header{padding-bottom:8px}
  header h1{font-size:18px}
  main{padding:10px 8px calc(78px + env(safe-area-inset-bottom));gap:10px}
  .board{gap:3px}
  .cell{border-radius:6px}
  .center{gap:6px;padding:6px;border-radius:10px}
  .center h2{font-size:16px}
  .center .hint{font-size:12px}
  .die{width:42px;height:42px;font-size:24px}
  .legend{font-size:11px;gap:4px 10px}
  .sellrow{flex-wrap:wrap}
  .setup{margin:14px auto}
  .setup .panel{padding:16px}
  .pcard .psel{grid-template-columns:minmax(0,1fr)}
  .aichk .lbl{display:none}
  .cell .lb{display:none}
}
@media(max-width:980px){
  main{padding-bottom:calc(78px + env(safe-area-inset-bottom))}
  #game[data-mv="board"] #colSide{display:none}
  #game[data-mv="sheet"] #colBoard, #game[data-mv="sheet"] #logPanel{display:none}
  #game[data-mv="log"] #colBoard, #game[data-mv="log"] #sheet{display:none}
  #game[data-mv="log"] #logPanel{margin-top:0!important}
  #game[data-mv="log"] .log{max-height:none}
  #mnav:not(.hidden){display:flex;position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--green);padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:6px;box-shadow:0 -4px 14px rgba(0,0,0,.2)}
  #mnav button{flex:1;background:transparent;color:#cfe0d6;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 4px}
  #mnav button span{font-size:20px}
  #mnav button.act{background:rgba(255,255,255,.14);color:#fff}
  /* Dialoge als Bottom-Sheet */
  .ov{align-items:flex-end;padding:0}
  .modal{border-radius:18px 18px 0 0;max-height:88vh;padding-bottom:env(safe-area-inset-bottom)}
  .mh{border-radius:18px 18px 0 0}
  .mf button{flex:1}
  #colSide{max-width:720px;margin:0 auto;width:100%}
}
</style>
</head>
<body>
<header>
  <h1>Geld<span>fluss</span></h1>
  <div class="hint" style="color:#cfe0d6">Raus aus dem Hamsterrad – baue passives Einkommen auf</div>
  <div class="sp"></div>
  <button class="sec sm" id="btnRules">Regeln</button>
  <button class="sec sm" id="btnNew">Neues Spiel</button>
</header>

<div id="setup" class="setup"></div>
<main id="game" class="hidden" data-mv="board">
  <div id="colBoard">
    <div class="board" id="board"></div>
    <div class="legend" id="legend"></div>
  </div>
  <div id="colSide">
    <div class="panel" id="sheet"></div>
    <div class="panel" id="logPanel" style="margin-top:16px">
      <h3 style="margin-top:0">Verlauf</h3>
      <div class="log" id="log"></div>
    </div>
  </div>
</main>
<nav id="mnav" class="hidden">
  <button data-v="board" class="act"><span>🎲</span>Spiel</button>
  <button data-v="sheet"><span>📊</span>Finanzen</button>
  <button data-v="log"><span>📜</span>Verlauf</button>
</nav>
<div id="modalRoot"></div>

<script>
"use strict";
// ---------- Hilfen ----------
const $ = s => document.querySelector(s);
const eur = n => (n<0?"−":"") + Math.abs(Math.round(n)).toLocaleString("de-DE") + " €";
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const step = (a,b,s) => a + s*rnd(0, Math.floor((b-a)/s));
const uid = () => Math.random().toString(36).slice(2,9);
const COLORS = ["#e53935","#1e88e5","#fdd835","#8e24aa","#43a047","#fb8c00"];
const SAVE_KEY = "geldfluss-v1";

// ---------- Berufe (eigene Werte, monatlich) ----------
const PROFS = [
  {n:"Verkäufer:in",      salary:2800, tax:480,  wohnen:[750,0],      auto:[180,6000],  karte:[80,2500],  studium:[0,0],     sonst:700,  kind:120, savings:600},
  {n:"Pflegefachkraft",   salary:3400, tax:650,  wohnen:[850,0],      auto:[220,8000],  karte:[90,3000],  studium:[0,0],     sonst:900,  kind:140, savings:800},
  {n:"Elektriker:in",     salary:3600, tax:720,  wohnen:[880,0],      auto:[300,12000], karte:[110,3500], studium:[0,0],     sonst:900,  kind:140, savings:900},
  {n:"Polizist:in",       salary:3900, tax:800,  wohnen:[900,0],      auto:[260,10000], karte:[90,3000],  studium:[0,0],     sonst:1000, kind:160, savings:1000},
  {n:"Lehrkraft",         salary:4100, tax:900,  wohnen:[950,0],      auto:[250,9000],  karte:[100,3000], studium:[150,9000], sonst:950,  kind:170, savings:1200},
  {n:"Bauleiter:in",      salary:5200, tax:1300, wohnen:[1100,190000],auto:[350,14000], karte:[120,4000], studium:[0,0],     sonst:1200, kind:220, savings:1500},
  {n:"Ingenieur:in",      salary:6200, tax:1700, wohnen:[1300,230000],auto:[450,18000], karte:[150,5000], studium:[150,12000],sonst:1400, kind:220, savings:2000},
  {n:"Ärzt:in",           salary:11000,tax:3600, wohnen:[2200,420000],auto:[700,30000], karte:[300,10000],studium:[600,60000],sonst:2200, kind:300, savings:3500},
];

// ---------- Träume ----------
const DREAMS = [
  {n:"Weltreise mit der Familie", i:"🌍", cost:150000},
  {n:"Segelyacht",                i:"⛵", cost:220000},
  {n:"Haus am See",               i:"🏡", cost:300000},
  {n:"Eigene Stiftung",           i:"🎗️", cost:250000},
  {n:"Bildungsfonds für Kinder",  i:"🎓", cost:120000},
  {n:"Eigenes Restaurant",        i:"🍽️", cost:200000},
  {n:"Oldtimer-Sammlung",         i:"🚘", cost:180000},
  {n:"Weingut in der Toskana",    i:"🍇", cost:350000},
  {n:"Sabbatjahr auf Hawaii",     i:"🌺", cost:100000},
  {n:"Tierheim gründen",          i:"🐾", cost:160000},
];

// ---------- Spielfeld Hamsterrad ----------
const FT = {
  zahltag:   {l:"Zahltag",     i:"💶", c:"#2e7d32"},
  chance:    {l:"Gelegenheit", i:"💡", c:"#1565c0"},
  markt:     {l:"Markt",       i:"📈", c:"#6a1b9a"},
  konsum:    {l:"Konsum",      i:"🛍️", c:"#c62828"},
  kind:      {l:"Nachwuchs",   i:"👶", c:"#ef6c00"},
  spende:    {l:"Spende",      i:"🤝", c:"#00838f"},
  kuendigung:{l:"Kündigung",   i:"📦", c:"#455a64"},
};
const BOARD = ["zahltag","chance","konsum","chance","markt","chance",
               "zahltag","chance","kind","chance","konsum","chance",
               "zahltag","chance","markt","chance","spende","chance",
               "zahltag","chance","konsum","chance","markt","kuendigung"];

// ---------- Spielfeld Freiheitsbahn ----------
const FTF = {
  fzahltag:{l:"Geldfluss-Tag", i:"💰", c:"#2e7d32"},
  invest:  {l:"Investition",   i:"🏗️", c:"#1565c0"},
  traum:   {l:"Traum",         i:"🌟", c:"#a87800"},
  risiko:  {l:"Risiko",        i:"⚡", c:"#c62828"},
  wagnis:  {l:"Wagnis",        i:"🎯", c:"#6a1b9a"},
  stiftung:{l:"Stiftung",      i:"🤝", c:"#00838f"},
};
const FAST = ["fzahltag","invest","traum","invest","risiko","traum",              "fzahltag","invest","wagnis","traum","invest","invest",              "fzahltag","invest","traum","invest","stiftung","risiko",              "fzahltag","invest","traum","invest","wagnis","traum"];
const FAST_GOAL = 50000;   // Ziel B: Freiheits-Cashflow um diesen Betrag steigern
const FAST_MULT = 10;      // Startwert Freiheits-Cashflow = passives Einkommen × 10
const WAGNIS_COST = 25000, WAGNIS_WIN = 250000;

function ringPos(i){ // 7x7 Rand
  if(i<=6) return [1, i+1];
  if(i<=12) return [i-5, 7];
  if(i<=18) return [7, 7-(i-12)];
  return [7-(i-18), 1];
}

// ---------- Karten Hamsterrad ----------
const TICKERS = [
  {t:"NOVX", n:"Novix Software"}, {t:"GRNW", n:"Grünwerk Energie"},
  {t:"MDQ",  n:"Mediq Pharma"},   {t:"BSTF", n:"Baustoff Union"},
];
const STOCK_PRICES = [1,5,5,10,10,10,15,20,20,25,30,40];

function smallDeal(){
  const r = Math.random();
  if(r<0.38){
    const s = pick(TICKERS), price = pick(STOCK_PRICES);
    const txt = price<=5 ? "Kurs im Keller nach schwachen Quartalszahlen." :
                price>=30 ? "Kurs auf Rekordhoch – Analysten sind euphorisch." :
                "Kurs schwankt üblicherweise zwischen 5 € und 30 €.";
    return {kind:"aktie", title:`Aktie: ${s.n} (${s.t})`, ticker:s.t, price, text:txt};
  }
  if(r<0.62){
    const price = step(45000,85000,5000), down = Math.round(price*0.1/500)*500, cf = step(-50,400,50);
    return {kind:"asset", cat:"wohnung", title:"Eigentumswohnung zu verkaufen",
      text: cf<0 ? "Günstig, aber die Miete deckt die Kosten nicht – eher eine Wette auf den Wiederverkauf." : "Vermietete 2-Zimmer-Wohnung in solider Lage.",
      name:"Eigentumswohnung", price, down, cf};
  }
  if(r<0.72){
    const price = step(12000,22000,1000);
    return {kind:"asset", cat:"garage", title:"Garagenhof-Stellplätze", text:"Zwei vermietete Garagen am Stadtrand.",
      name:"Garagen", price, down:2000, cf:step(80,180,20)};
  }
  if(r<0.82){
    const price = step(2000,6000,1000);
    return {kind:"asset", cat:"anleihe", title:"Anleihe-Fonds", text:"Sicher, aber wenig Ertrag. Kann nicht weiterverkauft werden.",
      name:"Anleihe-Fonds", price, down:price, cf:Math.round(price*0.009/5)*5};
  }
  const b = pick([["Snackautomaten-Route","Fünf Automaten in Bürogebäuden."],["Online-Shop für Ersatzteile","Läuft nebenbei, kaum Aufwand."],["Fahrradverleih am See","Saisongeschäft mit treuer Kundschaft."],["Waschstraßen-Gutscheinvertrieb","Provision pro verkauftem Gutschein."]]);
  const price = step(2000,7000,500);
  return {kind:"asset", cat:"klein", title:"Kleinunternehmen: "+b[0], text:b[1], name:b[0], price, down:price, cf:step(150,450,25)};
}
function bigDeal(){
  const r = Math.random();
  if(r<0.55){
    const units = pick([3,4,4,6,8,10,12]), per = step(60000,90000,5000), price = units*per;
    const down = Math.round(price*pick([0.12,0.15,0.18,0.2])/1000)*1000, cf = units*step(80,220,10);
    return {kind:"asset", cat:"haus", title:`Mehrfamilienhaus mit ${units} Einheiten`, text:"Voll vermietet, Hausverwaltung vorhanden.",
      name:`MFH ${units} WE`, units, price, down, cf};
  }
  const g = pick([["Waschsalon",80000],["Autowaschanlage",180000],["Bäckerei-Filiale",120000],["Lagerhalle (vermietet)",250000],["Self-Storage-Anlage",220000],["Ladesäulen-Park",150000]]);
  const price = Math.round(g[1]*pick([0.85,1,1.15])/5000)*5000, down = Math.round(price*pick([0.2,0.25,0.3])/1000)*1000;
  const cf = Math.round(price*pick([0.01,0.012,0.014,0.016])/50)*50;
  return {kind:"asset", cat:"gewerbe", title:g[0]+" zu verkaufen", text:"Etabliertes Geschäft mit Bilanzen der letzten drei Jahre.", name:g[0], price, down, cf};
}
function marketCard(){
  const r = Math.random();
  if(r<0.25) { const o = step(70000,130000,5000); return {kind:"offer", cat:"wohnung", title:"Käufer sucht Eigentumswohnung", text:`Eine Familie bietet ${eur(o)} für eine Eigentumswohnung. Jede Person mit einer Wohnung darf verkaufen.`, offer:()=>o}; }
  if(r<0.45) { const per = step(80000,125000,5000); return {kind:"offer", cat:"haus", title:"Investor kauft Mehrfamilienhäuser", text:`Zahlt ${eur(per)} pro Wohneinheit.`, offer:a=>per*a.units, per}; }
  if(r<0.57) { const f = pick([2,3,4]); return {kind:"offer", cat:"klein", title:"Übernahmeangebot für Kleinunternehmen", text:`Ein Konkurrent zahlt das ${f}-fache des Kaufpreises.`, offer:a=>a.price*f, f}; }
  if(r<0.67) { const f = pick([1.3,1.5,2]); return {kind:"offer", cat:"gewerbe", title:"Fonds kauft Gewerbeobjekte", text:`Angebot: ${String(f).replace(".",",")}-facher Kaufpreis für ein Gewerbe.`, offer:a=>Math.round(a.price*f), f}; }
  if(r<0.74) { const o = step(20000,35000,1000); return {kind:"offer", cat:"garage", title:"Nachbar will Garagen kaufen", text:`Angebot: ${eur(o)}.`, offer:()=>o}; }
  if(r<0.84) return {kind:"event", title:"Mietspiegel steigt", text:"Alle Eigentumswohnungen bringen dauerhaft +50 € Cashflow (alle Spieler).", ev:"miete"};
  if(r<0.92) return {kind:"event", title:"Heizungsschaden", text:"Wer gerade am Zug ist und ein Mehrfamilienhaus besitzt, zahlt 2.500 € Reparatur.", ev:"heizung"};
  const t = pick(TICKERS).t;

function expenses(p){

  return pr.tax + p.debts.wohnen.pay + p.debts.auto.pay + p.debts.karte.pay + p.debts.studium.pay + pr.sonst + p.children*pr.kind + loanPay(p);

// Bezahlen – reicht das Geld nicht, wird automatisch ein Bankkredit aufgenommen
function pay(p, amount, why){
  if(amount<=0) return;
  if(p.cash < amount){
    const need = Math.ceil((amount-p.cash)/1000)*1000;
    p.loan += need; p.cash += need;
    log(`🏦 ${nm(p)} muss ${eur(need)} Kredit aufnehmen (${why}).`);
  }
  p.cash -= amount;
}

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function buildDreamFields(players){
  const fields = FAST.map((t,i)=>t==="traum"?i:-1).filter(i=>i>=0);
  const want = [...new Set(players.map(p=>p.dream))];
  const rest = shuffle(DREAMS.map((d,i)=>i).filter(i=>!want.includes(i)));
  const list = shuffle(want.concat(rest).slice(0, fields.length));
  const map = {}; fields.forEach((f,k)=>map[f]=list[k]); return map;
}

// ---------- Computer-Spieler ----------
function scheduleAI(){
  clearTimeout(aiTimer);
  if(!S || S.over) return;
  const p = P(); if(!p.ai) return;
  aiTimer = setTimeout(()=>{
    if(!S || S.over || P()!==p) return;
    if($("#modalRoot").innerHTML || S.phase==="resolve"){ scheduleAI(); return; }
    if(S.phase==="roll"){ aiManage(p); roll(p.charity>0?2:1); }
    else if(S.phase==="end") endTurn();
  }, 1000);
}
function aiManage(p){
  if(p.fast) return;
  for(const k of ["karte","auto","studium","wohnen"]){
    const d = p.debts[k]; if(d.debt>0 && p.cash >= d.debt + 2000) doPayDebt(p,k);
  }
  while(p.loan>=1000 && p.cash >= 9000){ p.loan-=1000; p.cash-=1000; }
}
function aiWantsAsset(p,c){
  if(c.cf<=0 || c.cf*12/c.down < 0.12) return false;
  if(p.cash>=c.down) return true;
  const need = Math.ceil((c.down-p.cash)/1000)*1000;   // Rest per Kredit – wie bei Menschen
  return c.cf - need/100 >= 50 && cashflow(p) + c.cf - need/100 >= 0 && p.loan + need <= loanCap(p);
}

// ---------- Zugablauf ----------
function roll(n){
  const p = P(); if(S.phase!=="roll") return;
  if(p.charity>0) p.charity--;
  S.dice = Array.from({length:n},()=>rnd(1,6));
  const total = S.dice.reduce((a,b)=>a+b,0);
  log(`🎲 ${nm(p)} würfelt ${S.dice.join(" + ")} = ${total}.`);
  if(p.fast){
    const old = p.fast.pos; p.fast.pos = (old+total) % FAST.length;
    for(let k=1;k<total;k++) if(FAST[(old+k)%FAST.length]==="fzahltag") fastPayday(p);
  } else {
    const old = p.pos; p.pos = (old+total) % BOARD.length;
    for(let k=1;k<total;k++) if(BOARD[(old+k)%BOARD.length]==="zahltag") payday(p);
  }
  S.phase="resolve"; render();
  document.querySelectorAll(".die").forEach(x=>x.classList.add("roll"));
  setTimeout(()=> p.fast ? resolveFast(p) : resolveField(p), 380);
}
function payday(p){
  const cf = cashflow(p);
  if(cf>=0){ p.cash += cf; log(`💶 Zahltag für ${nm(p)}: +${eur(cf)}.`); return; }
  if(p.cash >= -cf){ p.cash += cf; log(`⚠️ Zahltag für ${nm(p)}: ${eur(cf)} (negativer Cashflow).`); return; }
  liquidate(p, -cf);
}
function fastPayday(p){ p.cash += p.fast.fc; log(`💰 Geldfluss-Tag für ${nm(p)}: +${eur(p.fast.fc)}.`); }
function liquidate(p, need){
  log(`🚨 ${nm(p)} kann den negativen Cashflow nicht decken – Notverkauf zum halben Wert.`);
  for(const a of [...p.assets]){
    if(p.cash>=need) break;
    p.cash += Math.max(0, Math.round(a.price*0.5) - a.mortgage);
    p.assets = p.assets.filter(x=>x!==a);
  }
  for(const t of Object.keys(p.stocks)){
    if(p.cash>=need) break;
    p.cash += Math.round(p.stocks[t].cost*0.5); delete p.stocks[t];
  }
  if(p.cash>=need){ p.cash -= need; return; }
  p.bankrupt = true; log(`✖ ${nm(p)} ist insolvent und scheidet aus.`);
}
// Zeigt Menschen einen Info-Dialog; Computer machen sofort weiter
function info(p, f, title, body, btn="Weiter"){
  if(p.ai) return done();
  modal({title, icon:f.i, color:f.c, body, buttons:[{t:btn, fn:done}]});
}
function resolveField(p){
  const t = BOARD[p.pos], f = FT[t];
  if(t==="zahltag"){ payday(p); return info(p, f, "Zahltag", `<p>Dein monatlicher Cashflow von <b>${eur(cashflow(p))}</b> wird verbucht.</p>`); }
  if(t==="chance"){
    if(p.ai) return showDeal(p.cash>=40000 ? bigDeal() : smallDeal());
    return modal({title:"Gelegenheit", icon:f.i, color:f.c,
      body:`<p>Welche Art von Geschäft suchst du?</p><div class="facts"><span>Kleines Geschäft</span><span>bis ca. 7.000 €</span><span>Großes Geschäft</span><span>ab ca. 7.000 € Eigenkapital</span></div><p class="hint">Bargeld: ${eur(p.cash)}</p>`,
      buttons:[{t:"Kleines Geschäft", fn:()=>showDeal(smallDeal())},{t:"Großes Geschäft", cls:"gold", fn:()=>showDeal(bigDeal())}]});

  if(t==="markt") return showMarket(marketCard());
  if(t==="konsum"){

      return info(p, f, "Konsum: Neuwagen!", `<p>Du konntest nicht widerstehen und hast einen Neuwagen finanziert.</p><div class="facts"><span>Neue Rate</span><span>+250 €/Monat</span><span>Neue Schulden</span><span>15.000 €</span></div>`, "Autsch");
    }
    pay(p, k[1], k[0]); log(`🛍️ ${nm(p)}: ${k[0]} kostet ${eur(k[1])}.`);
    return info(p, f, "Konsum", `<p><b>${k[0]}</b></p><div class="facts"><span>Kosten</span><span>${eur(k[1])}</span></div>`, "Bezahlen");
  }
  if(t==="kind"){
    if(p.children<3){ p.children++; log(`👶 ${nm(p)} bekommt Nachwuchs (${p.children}).`);
      return info(p, f, "Nachwuchs!", `<p>Herzlichen Glückwunsch! Deine monatlichen Ausgaben steigen um <b>${eur(PROFS[p.prof].kind)}</b>.</p>`, "Wie schön"); }
    return info(p, f, "Nachwuchs?", `<p>Drei Kinder sind genug – nichts passiert.</p>`);
  }
  if(t==="spende"){
    const amt = Math.round(income(p)*0.1);
    const give = ()=>{ p.cash-=amt; p.charity=3; log(`🤝 ${nm(p)} spendet ${eur(amt)}.`); };
    if(p.ai){ if(p.cash>=amt+3000) give(); return done(); }
    return modal({title:"Spende", icon:f.i, color:f.c, body:`<p>Spende 10 % deines Einkommens (<b>${eur(amt)}</b>) für einen guten Zweck. Dafür darfst du die nächsten <b>3 Züge</b> wahlweise mit 2 Würfeln würfeln.</p>`,
      buttons:[{t:"Nein danke", cls:"sec", fn:done},{t:`Spenden (${eur(amt)})`, cls:"gold", dis:p.cash<amt, fn:()=>{ give(); done(); }}]});
  }
  if(t==="kuendigung"){
    const e = expenses(p); pay(p, e, "Kündigung"); p.skip = 2;
    log(`📦 ${nm(p)} verliert den Job: zahlt ${eur(e)} und setzt 2 Runden aus.`);
    return info(p, f, "Kündigung", `<p>Dein Arbeitgeber baut Stellen ab. Du zahlst eine Monatsausgabe von <b>${eur(e)}</b> und setzt <b>2 Runden</b> aus.</p>`, "Mist");
  }
}

// ---------- Freiheitsbahn ----------
function resolveFast(p){
  const t = FAST[p.fast.pos], f = FTF[t];
  if(t==="fzahltag"){ fastPayday(p); return info(p, f, "Geldfluss-Tag", `<p>Dein Freiheits-Cashflow von <b>${eur(p.fast.fc)}</b> wird verbucht.</p>`); }
  if(t==="invest"){
    const c = fastInvest();
    const buy = ()=>{ p.cash -= c.cost; p.fast.invests.push(c); p.fast.fc += c.fc; log(`🏗️ ${nm(p)} investiert ${eur(c.cost)} in ${c.name}: +${eur(c.fc)} Freiheits-Cashflow.`); };
    if(p.ai){ if(p.cash>=c.cost) buy(); else log(`🤖 ${nm(p)} kann sich ${c.name} (${eur(c.cost)}) nicht leisten.`); return done(); }
    return modal({title:"Großinvestition: "+c.name, icon:c.icon, color:f.c,
      body:`<div class="facts"><span>Kaufpreis (nur bar)</span><span>${eur(c.cost)}</span><span>Zusätzlicher Freiheits-Cashflow</span><span class="pos">+${eur(c.fc)}</span><span>Rendite</span><span>${(c.fc/c.cost*100).toFixed(0)} % pro Geldfluss-Tag</span></div><p class="hint">Dein Bargeld: ${eur(p.cash)}</p>`,
      buttons:[{t:"Ablehnen", cls:"sec", fn:done},{t:"Investieren", cls:"gold", dis:p.cash<c.cost, fn:()=>{ buy(); done(); }}]});
  }
  if(t==="traum"){
    const di = S.dreamFields[p.fast.pos], d = DREAMS[di], own = di===p.dream;
    if(!own){
      const who = S.players.filter(q=>q.dream===di).map(q=>q.name).join(", ");
      return info(p, f, `${d.i} ${d.n}`, `<p>Ein schöner Traum – aber nicht deiner${who?` (sondern von ${who})`:""}. Nichts passiert.</p>`);
    }
    const buy = ()=>{ p.cash -= d.cost; p.fast.dreamBought = true; log(`🌟 ${nm(p)} erfüllt sich den Traum: ${d.i} ${d.n}!`); };
    if(p.ai){ if(p.cash>=d.cost) buy(); else log(`🤖 ${nm(p)} steht vor dem Traum, hat aber erst ${eur(p.cash)}.`); return done(); }
    return modal({title:`Dein Traum: ${d.n}`, icon:d.i, color:f.c,
      body:`<p>Du stehst vor deinem Lebenstraum! Wenn du ihn jetzt bezahlst, hast du das Spiel gewonnen.</p><div class="facts"><span>Preis</span><span>${eur(d.cost)}</span><span>Dein Bargeld</span><span>${eur(p.cash)}</span></div>`,
      buttons:[{t:p.cash<d.cost?"Noch zu teuer":"Später", cls:"sec", fn:done},{t:"Traum kaufen 🌟", cls:"gold", dis:p.cash<d.cost, fn:()=>{ buy(); done(); }}]});
  }
  if(t==="risiko"){
    const r = pick(RISKS), before = p.cash, extra = r.fn(p) || "";
    log(`⚡ ${nm(p)}: ${r.t}${before!==p.cash?` (−${eur(before-p.cash)})`:""}.${extra}`);
    return info(p, f, r.t, `<p>${r.text}${extra}</p>${before!==p.cash?`<div class="facts"><span>Verlust</span><span class="neg">${eur(before-p.cash)}</span></div>`:""}`, "Mist");
  }
  if(t==="wagnis"){
    const go = ()=>{
      p.cash -= WAGNIS_COST; const w = rnd(1,6);
      if(w>=5){ p.cash += WAGNIS_WIN; log(`🎯 ${nm(p)} wagt ein Start-up-Investment – Würfel ${w}: Volltreffer, +${eur(WAGNIS_WIN)}!`); return `<p>🎲 Du würfelst eine <b>${w}</b> – <b>Volltreffer!</b> Das Start-up wird übernommen: +${eur(WAGNIS_WIN)}.</p>`; }
      log(`🎯 ${nm(p)} wagt ein Start-up-Investment – Würfel ${w}: leider verloren.`); return `<p>🎲 Du würfelst eine <b>${w}</b> – das Start-up ist gescheitert. ${eur(WAGNIS_COST)} sind weg.</p>`;
    };
    if(p.ai){ if(p.cash >= WAGNIS_COST*4) go(); return done(); }
    return modal({title:"Wagnis: Start-up-Beteiligung", icon:f.i, color:f.c,
      body:`<p>Investiere <b>${eur(WAGNIS_COST)}</b> in ein junges Start-up. Würfelst du eine <b>5 oder 6</b>, bekommst du <b>${eur(WAGNIS_WIN)}</b>. Sonst ist das Geld weg.</p><p class="hint">Dein Bargeld: ${eur(p.cash)}</p>`,
      buttons:[{t:"Lieber nicht", cls:"sec", fn:done},{t:"Wagen 🎲", cls:"gold", dis:p.cash<WAGNIS_COST, fn:()=>{ const res = go(); modal({title:"Ergebnis", icon:f.i, color:f.c, body:res, buttons:[{t:"Weiter", fn:done}]}); }}]});
  }
  if(t==="stiftung"){
    const amt = p.fast.fc;
    const give = ()=>{ p.cash -= amt; p.charity = 3; log(`🤝 ${nm(p)} gibt ${eur(amt)} an die eigene Stiftung.`); };
    if(p.ai){ if(p.cash >= amt*3) give(); return done(); }
    return modal({title:"Stiftung", icon:f.i, color:f.c, body:`<p>Spende einen Freiheits-Cashflow (<b>${eur(amt)}</b>) an deine Stiftung. Dafür darfst du 3 Züge lang wahlweise mit 2 Würfeln würfeln.</p>`,
      buttons:[{t:"Nein danke", cls:"sec", fn:done},{t:`Spenden (${eur(amt)})`, cls:"gold", dis:p.cash<amt, fn:()=>{ give(); done(); }}]});
  }
}
function enterFast(p){
  const fc = passive(p)*FAST_MULT;
  p.fast = {fc, fcStart:fc, pos:0, invests:[], dreamBought:false};
  p.cash += fc; p.charity = 0; p.skip = 0;
  log(`🚀 ${nm(p)} ist aus dem Hamsterrad ausgebrochen und wechselt auf die Freiheitsbahn (Freiheits-Cashflow ${eur(fc)}).`);
  const d = dreamOf(p);
  if(!p.ai || S.players.every(q=>q.ai)) queueModal({title:"Raus aus dem Hamsterrad!", icon:"🚀", color:"#a87800",
    body:`<p><b>${p.name}</b> ist finanziell frei und wechselt auf die <b>Freiheitsbahn</b>.</p>
      <div class="facts"><span>Freiheits-Cashflow (passiv × ${FAST_MULT})</span><span class="pos">${eur(fc)}</span><span>Startbonus (bar)</span><span>${eur(fc)}</span></div>
      <p><b>Gewinnen</b> kannst du jetzt auf zwei Wegen:<br>🅰 Deinen Traum <b>${d.i} ${d.n}</b> für ${eur(d.cost)} kaufen (auf seinem Feld landen) – oder<br>🅱 deinen Freiheits-Cashflow um <b>${eur(FAST_GOAL)}</b> steigern.</p>`,
    buttons:[{t:"Los geht's", cls:"gold"}]});
  else queueModal({title:"Ausbruch!", icon:"🚀", color:"#a87800", body:`<p>🤖 <b>${p.name}</b> ist aus dem Hamsterrad ausgebrochen und spielt jetzt auf der Freiheitsbahn.</p>`, buttons:[{t:"Weiter"}]});
}

// ---------- Geschäfte ----------
function buyAsset(p,c){
  const mortgage = c.price - c.down;
  pay(p, c.down, c.name);
  p.assets.push({id:uid(), cat:c.cat, name:c.name, price:c.price, down:c.down, mortgage, cf:c.cf, units:c.units||0});
  log(`✅ ${nm(p)} kauft ${c.name} für ${eur(c.price)} (EK ${eur(c.down)}, Cashflow ${eur(c.cf)}).`);
}
function doBuyStock(p,t,price,q){
  p.cash -= q*price;
  const s = p.stocks[t] || (p.stocks[t]={qty:0,cost:0}); s.qty+=q; s.cost+=q*price;
  log(`📊 ${nm(p)} kauft ${q.toLocaleString("de-DE")} × ${t} zu ${eur(price)}.`);
}
function doSellStock(q,t,price){
  const s = q.stocks[t]; if(!s) return;
  const g = s.qty*price - s.cost;
  q.cash += s.qty*price; delete q.stocks[t];
  log(`📊 ${nm(q)} verkauft ${s.qty.toLocaleString("de-DE")} × ${t} zu ${eur(price)} (${g>=0?"Gewinn":"Verlust"} ${eur(Math.abs(g))}).`);
}
function showDeal(c){
  const p = P(); curCard = c;
  if(c.kind==="aktie") return stockCard(c, true);
  if(p.ai){
    if(aiWantsAsset(p,c)) buyAsset(p,c); else log(`🤖 ${nm(p)} lehnt ab: ${c.name} (${eur(c.price)}, Cashflow ${eur(c.cf)}).`);
    return done();
  }
  const mortgage = c.price - c.down, can = p.cash >= c.down;
  const needLoan = can ? 0 : Math.ceil((c.down-p.cash)/1000)*1000;
  const loanOk = can || (cashflow(p) + c.cf - needLoan/100 >= 0 && p.loan + needLoan <= loanCap(p));
  modal({title:c.title, icon:c.cat==="haus"||c.cat==="wohnung"?"🏠":c.cat==="anleihe"?"📜":c.cat==="garage"?"🚗":"🏪", color:"#1565c0",
    body:`<p>${c.text}</p><div class="facts"><span>Kaufpreis</span><span>${eur(c.price)}</span><span>Eigenkapital</span><span>${eur(c.down)}</span>${mortgage?`<span>Darlehen</span><span>${eur(mortgage)}</span>`:""}<span>Cashflow (nach Zins & Tilgung)</span><span class="${c.cf>=0?"pos":"neg"}">${eur(c.cf)}/Monat</span><span>Rendite aufs Eigenkapital</span><span>${(c.cf*12/c.down*100).toFixed(1).replace(".",",")} % p.a.</span></div>
    <p class="hint">Dein Bargeld: ${eur(p.cash)}${!can ? (loanOk ? ` – fehlende ${eur(needLoan)} per Bankkredit (${eur(needLoan/100)}/Monat) finanzierbar.` : ` – die Bank finanziert die fehlenden ${eur(needLoan)} nicht (Cashflow würde negativ oder Kreditrahmen ${eur(loanCap(p))} überschritten).`) : ""}</p>`,
    buttons:[{t:"Ablehnen", cls:"sec", fn:done},
      {t: can?"Kaufen":"Mit Kredit kaufen", cls:"gold", dis:!loanOk, fn:()=>{ buyAsset(p,c); done(); }}]});
}
// Aktienkarte: Computer entscheiden sofort, Menschen bekommen einen Dialog
function stockCard(c, first){
  const p = P();
  if(first){
    S.players.forEach(q=>{ const s=q.stocks[c.ticker];
      if(q.ai && !q.bankrupt && s && (c.price>=30 || (c.price>=15 && c.price >= 2*s.cost/s.qty))) doSellStock(q,c.ticker,c.price); });
    if(p.ai && c.price<=10 && p.cash>=2000){ const q = Math.floor(p.cash*0.4/c.price/100)*100; if(q>0) doBuyStock(p,c.ticker,c.price,q); }
  }
  const holders = S.players.filter(q=>!q.ai && !q.bankrupt && q.stocks[c.ticker]);
  if(p.ai && !holders.length) return done();
  const sellHtml = holders.map(q=>{ const s=q.stocks[c.ticker]; return `<div class="sellrow"><span>${q.name}: ${s.qty.toLocaleString("de-DE")} Stück (Ø ${eur(s.cost/s.qty)})</span><button class="sm red" onclick="sellStock(${S.players.indexOf(q)})">Alle verkaufen: ${eur(s.qty*c.price)}</button></div>`; }).join("");
  const maxQ = Math.floor(p.cash/c.price);
  modal({title:c.title, icon:"📊", color:"#1565c0",
    body:`<p>${c.text}</p><div class="facts"><span>Aktueller Kurs</span><span>${eur(c.price)}</span>${p.ai?"":`<span>Dein Bargeld</span><span>${eur(p.cash)}</span><span>Maximal kaufbar</span><span>${maxQ.toLocaleString("de-DE")} Stück</span>`}</div>
    ${p.ai?`<p class="hint">🤖 ${p.name} hat diese Karte gezogen – du darfst zu diesem Kurs verkaufen.</p>`:`<div class="row"><input type="number" id="qty" min="1" step="100" value="${Math.min(maxQ, 100)}" style="width:130px"> Stück <button class="sm" onclick="buyStock()">Kaufen</button></div>`}
    ${sellHtml?`<h3>Zum aktuellen Kurs verkaufen</h3>${sellHtml}`:""}<p class="hint" id="stockMsg" style="margin-top:8px"></p>`,
    buttons:[{t:"Fertig", fn:done}]});
}
function buyStock(){
  const p = P(), c = curCard, q = Math.floor(+$("#qty").value||0);
  if(q<=0) return;
  if(q*c.price > p.cash){ $("#stockMsg").textContent = "Nicht genug Bargeld."; return; }
  doBuyStock(p,c.ticker,c.price,q); closeModal(); done();
}
function sellStock(pi){
  doSellStock(S.players[pi], curCard.ticker, curCard.price);
  renderSheet(); save(); stockCard(curCard, false);
}

// ---------- Markt ----------
function applyEvent(c,p){
  if(c.ev==="miete"){ S.players.forEach(q=>q.assets.forEach(a=>{ if(a.cat==="wohnung") a.cf+=50; })); log("📈 Mietspiegel steigt: Eigentumswohnungen +50 €/Monat."); }
  if(c.ev==="heizung"){ if(p.assets.some(a=>a.cat==="haus")){ pay(p,2500,"Heizungsschaden"); log(`🔧 ${nm(p)} zahlt 2.500 € für die Heizung.`); } else c.text += " – Du besitzt keins, Glück gehabt!"; }
  if(c.ev==="split"){ S.players.forEach(q=>{ if(q.stocks[c.ticker]){ q.stocks[c.ticker].qty*=2; } }); log(`📈 Aktiensplit ${c.ticker} 2:1.`); }
}
function doSellAsset(q,a,o){
  const net = o - a.mortgage;
  q.cash += net; q.assets = q.assets.filter(x=>x!==a);
  log(`💰 ${nm(q)} verkauft ${a.name} für ${eur(o)} (netto ${eur(net)}).`);
}
function showMarket(c, again){
  const p = P(), f = FT.markt; curCard = c;
  if(c.kind==="event"){
    applyEvent(c,p);
    return info(p, f, c.title, `<p>${c.text}</p>`);
  }
  if(!again){ // Computer entscheiden selbst
    S.players.forEach(q=>{ if(!q.ai || q.bankrupt) return;
      q.assets.filter(a=>a.cat===c.cat).forEach(a=>{ const o=c.offer(a), base=Math.max(1000, a.down||(a.price-a.mortgage)); if(o-a.mortgage >= base*2.5) doSellAsset(q,a,o); }); });
  }
  const rows = [];
  S.players.forEach((q,qi)=>{ if(q.ai || q.bankrupt) return; q.assets.forEach(a=>{ if(a.cat===c.cat){
    const o = c.offer(a), net = o - a.mortgage;
    rows.push(`<div class="sellrow"><span><b>${q.name}</b>: ${a.name}<br><span class="hint">Kauf ${eur(a.price)} · Darlehen ${eur(a.mortgage)} · CF ${eur(a.cf)}</span></span><button class="sm red" onclick="sellAsset(${qi},'${a.id}')">Verkaufen<br>netto ${eur(net)}</button></div>`);
  }}); });
  if(p.ai && !rows.length) return done();
  modal({title:c.title, icon:f.i, color:f.c, body:`<p>${c.text}</p>${p.ai?`<p class="hint">🤖 ${p.name} hat diese Karte gezogen.</p>`:""}${rows.length?rows.join(""):'<p class="hint">Niemand besitzt einen passenden Vermögenswert.</p>'}`, buttons:[{t:"Fertig", fn:done}]});
}
function sellAsset(qi, id){
  const q = S.players[qi], a = q.assets.find(x=>x.id===id), c = curCard; if(!a||!c) return;
  doSellAsset(q,a,c.offer(a));
  renderSheet(); save(); showMarket(c, true);
}

// ---------- Finanzen ----------
function borrow(){
  const p = P();
  if(cashflow(p) - 10 < 0 || p.loan + 1000 > loanCap(p)){ modal({title:"Kein Kredit", body:`<p>Die Bank verleiht nur, wenn dein Cashflow danach positiv bleibt und dein Kreditrahmen (10 × Monatsgehalt = ${eur(loanCap(p))}) nicht überschritten wird.</p>`, buttons:[{t:"OK"}]}); return; }
  p.loan += 1000; p.cash += 1000; log(`🏦 ${nm(p)} nimmt 1.000 € Kredit auf.`); render();
}
function repay(){ const p = P(); if(p.cash<1000||p.loan<1000) return; p.loan-=1000; p.cash-=1000; log(`🏦 ${nm(p)} tilgt 1.000 € Kredit.`); checkAll(); render(); }
function doPayDebt(p,k){
  const d = p.debts[k]; if(p.cash<d.debt) return;
  p.cash -= d.debt; log(`✂️ ${nm(p)} tilgt ${k==="wohnen"?"die Hypothek":k==="auto"?"den Autokredit":k==="karte"?"die Kreditkarte":"den Studienkredit"} (${eur(d.debt)}) – ${eur(d.pay)} weniger Ausgaben.`);
  d.debt=0; d.pay=0;
}
function payDebt(k){ doPayDebt(P(),k); checkAll(); render(); }

// ---------- Sieg / Ende ----------
function finish(p, how){
  p.free = true; p.how = how; p.wonRound = S.round; S.winners = S.winners||[]; S.winners.push(p.name);
  log(`🏆 ${nm(p)} gewinnt (${how}) – Platz ${S.winners.length} in Runde ${S.round}!`);
  queueModal({title:S.winners.length===1?"Sieg!":"Ziel erreicht!", icon:"🏆", color:"#d9a62e",
    body:`<p><b>${nm(p)}</b> hat es geschafft: <b>${how}</b>.</p><p>Platz <b>${S.winners.length}</b> in Runde ${S.round}.</p>`,
    buttons:[{t:"Weiter", cls:"gold"}]});
}
function checkAll(){
  S.players.forEach(p=>{
    if(p.free||p.bankrupt) return;
    if(!p.fast){
      const pas = passive(p);
      if(pas>0 && pas >= expenses(p)*S.goal){
        if(S.mode===2) enterFast(p);
        else finish(p, "raus aus dem Hamsterrad");
      }
    } else if(p.fast.dreamBought) finish(p, `Traum erfüllt: ${dreamOf(p).i} ${dreamOf(p).n}`);
    else if(p.fast.fc - p.fast.fcStart >= FAST_GOAL) finish(p, `Freiheits-Cashflow +${eur(FAST_GOAL)}`);
  });
  const active = S.players.filter(p=>!p.free&&!p.bankrupt);
  const humans = S.players.filter(p=>!p.ai);
  if(!S.over && (!active.length || (humans.length && !active.some(p=>!p.ai)))){
    S.over = true; clearTimeout(aiTimer);
    log("🏁 Spiel beendet.");
    queueModal(resultsModal());
  }
}
function score(p){
  if(p.bankrupt) return -1;
  if(p.fast) return 1000 + (p.fast.fc - p.fast.fcStart)/FAST_GOAL + p.cash/dreamOf(p).cost;
  return passive(p)/Math.max(1,expenses(p)*S.goal);
}
function resultsModal(){
  const done_ = (S.winners||[]).map(n=>S.players.find(p=>p.name===n));
  const rest = S.players.filter(p=>!done_.includes(p)).sort((a,b)=>score(b)-score(a));
  const rows = done_.concat(rest).map((p,i)=>{
    let res;
    if(p.free) res = `🏆 ${p.how} (Runde ${p.wonRound})`;
    else if(p.bankrupt) res = "✖ insolvent";
    else if(p.fast) res = `🌟 Freiheitsbahn: ${eur(p.cash)} bar, Cashflow ${eur(p.fast.fc)}`;
    else res = `Hamsterrad: ${Math.round(score(p)*100)} % des Ausbruch-Ziels`;
    return `<tr><td><b>${i+1}.</b></td><td><span class="tok" style="display:inline-block;background:${p.color};vertical-align:-2px"></span> ${nm(p)}</td><td>${res}</td></tr>`;
  }).join("");
  return {title:"Endergebnis", icon:"🏁", color:"#0f3d2e",
    body:`<table class="results">${rows}</table><p class="hint" style="margin-top:10px">Gespielt: ${S.round} Runden.</p>`,
    buttons:[{t:"Schließen", cls:"sec"},{t:"Neues Spiel", cls:"gold", fn:resetGame}]};
}
function showResults(){ modal(resultsModal()); }
function endTurn(){
  if(S.over){ render(); return; }
  const n = S.players.length;
  let i = S.cur;
  for(let guard=0; guard<n*4; guard++){
    i = (i+1)%n; if(i===0) S.round++;
    const q = S.players[i];
    if(q.free||q.bankrupt) continue;
    if(q.skip>0){ q.skip--; log(`⏸️ ${nm(q)} setzt aus (noch ${q.skip}).`); continue; }
    break;
  }
  S.cur = i; S.phase="roll"; view = i; S.dice=[0];
  if(!S.players[i].ai) setView("board");
  render();
}

// ---------- Regeln ----------
function rules(){
  modal({title:"Spielregeln", icon:"📖", body:`
  <p><b>Ziel:</b> Baue passives Einkommen auf (Immobilien, Unternehmen, Anleihen), bis es deine monatlichen Ausgaben deckt – dann bist du raus aus dem Hamsterrad. Im Modus <b>Komplett</b> geht es danach auf der <b>Freiheitsbahn</b> weiter.</p>
  <h3>Phase 1 – Hamsterrad</h3>
  <p><b>Zug:</b> Würfeln, Feld abhandeln, Zug beenden. Über ein 💶 <b>Zahltag</b>-Feld zu ziehen oder darauf zu landen bringt deinen monatlichen Cashflow.</p>
  <p>💡 <b>Gelegenheit:</b> Kleines oder großes Geschäft. Immobilien werden mit Eigenkapital + Darlehen gekauft; der angezeigte Cashflow ist bereits nach Darlehensrate. Aktien bringen keinen Cashflow – Gewinn nur durch Verkauf, wenn eine Karte einen besseren Kurs zeigt (alle dürfen dann verkaufen).</p>
  <p>📈 <b>Markt:</b> Käufer machen Angebote, jede Person mit passendem Objekt darf verkaufen – das Darlehen wird vom Erlös abgezogen. Außerdem Ereignisse wie Mietsteigerungen oder Aktiensplits.</p>
  <p>🛍️ <b>Konsum</b> kostet Geld, 👶 <b>Nachwuchs</b> erhöht die Ausgaben, 🤝 <b>Spende</b> erlaubt 3 Züge lang 2 Würfel, 📦 <b>Kündigung</b> kostet eine Monatsausgabe und 2 Runden Aussetzen.</p>
  <p>🏦 <b>Kredit:</b> 1.000-€-Schritte, 1 % Zinsen pro Monat. Freiwillig nur bei positivem Cashflow und bis max. 10 × Monatsgehalt. Konsumschulden lassen sich jederzeit komplett tilgen.</p>
  <p>✖ <b>Insolvenz:</b> Kannst du einen negativen Zahltag nicht bezahlen, wird dein Vermögen zum halben Wert verkauft. Reicht das nicht, scheidest du aus.</p>
  <h3>Phase 2 – Freiheitsbahn</h3>
  <p>Du startest mit einem <b>Freiheits-Cashflow</b> von passivem Einkommen × ${FAST_MULT} und bekommst ihn einmal sofort als Startbonus. Kein Gehalt, keine Ausgaben mehr.</p>
  <p>🏗️ <b>Investition:</b> Großprojekte gegen Bargeld, die deinen Freiheits-Cashflow erhöhen. 💰 <b>Geldfluss-Tag:</b> Freiheits-Cashflow kassieren. ⚡ <b>Risiko:</b> Klagen, Steuernachzahlungen oder Crashs kosten Geld oder Investitionen. 🎯 <b>Wagnis:</b> ${eur(WAGNIS_COST)} einsetzen, bei 5–6 gibt es ${eur(WAGNIS_WIN)}. 🤝 <b>Stiftung:</b> spenden für 3 Züge mit 2 Würfeln.</p>
  <p>🏆 <b>Sieg:</b> Lande auf deinem 🌟 <b>Traumfeld</b> und kaufe deinen Traum – oder steigere deinen Freiheits-Cashflow um ${eur(FAST_GOAL)}.</p>
  <h3>Computer-Gegner</h3>
  <p>🤖 Computer spielen automatisch: Sie kaufen Geschäfte mit guter Rendite, verkaufen bei guten Angeboten und tilgen teure Schulden. Ist kein Mensch mehr im Rennen, endet das Spiel.</p>
  <p class="hint">Der Spielstand wird automatisch im Browser gespeichert.</p>`, buttons:[{t:"Los geht's", cls:"gold"}]});
}

$("#btnRules").onclick = rules;
function resetGame(){ clearTimeout(aiTimer); mq.length=0; closeModal(); store.del(SAVE_KEY); S=null; renderSetup(); }
$("#btnNew").onclick = ()=>{
  if(!S || S.over) return resetGame();
  modal({title:"Neues Spiel?", body:"<p>Das aktuelle Spiel wird verworfen.</p>", buttons:[{t:"Abbrechen", cls:"sec"},{t:"Neu beginnen", cls:"red", fn:resetGame}]});
};
renderSetup();
</script>
