<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3d2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Geldfluss">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f3d2e'/%3E%3Ctext x='50' y='70' font-size='60' text-anchor='middle'%3E%F0%9F%92%B6%3C/text%3E%3C/svg%3E">
<title>Geldfluss – Raus aus dem Hamsterrad</title>
<style>
:root{
  --bg:#f4f1ea; --panel:#fffdf8; --ink:#1d2a24; --muted:#6b756f; --line:#e3ddd0;
  --green:#0f3d2e; --accent:#d9a62e; --good:#2e7d32; --bad:#c62828;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
header{background:var(--green);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:20px;margin:0;letter-spacing:.5px}
header h1 span{color:var(--accent)}
header .sp{flex:1}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:8px 14px;background:var(--green);color:#fff;font-weight:600}
button:hover{filter:brightness(1.15)}
button:disabled{opacity:.4;cursor:not-allowed;filter:none}
button.sec{background:#e9e4d8;color:var(--ink)}
button.gold{background:var(--accent);color:#1d2a24}
button.red{background:var(--bad)}
button.sm{padding:4px 9px;font-size:13px;border-radius:6px}
input,select{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:#fff}
main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;padding:16px;max-width:1300px;margin:0 auto}
@media(max-width:980px){main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
/* Board */
.board{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(7,1fr);gap:5px;aspect-ratio:1;max-width:720px;margin:0 auto}
.cell{border-radius:9px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:600;text-align:center;position:relative;padding:2px;min-height:0;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.cell .ic{font-size:22px;line-height:1.1}
@media(max-width:600px){.cell .ic{font-size:16px}.cell .lb{display:none}}
.cell.hl{outline:3px solid var(--accent);outline-offset:1px}
.tokens{position:absolute;bottom:2px;left:2px;right:2px;display:flex;gap:2px;justify-content:center;flex-wrap:wrap}
.tok{width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.center{grid-row:2/7;grid-column:2/7;background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px;text-align:center}
.center h2{margin:0;font-size:20px}
.dice{display:flex;gap:10px}
.die{width:54px;height:54px;border-radius:10px;background:#fff;border:2px solid var(--ink);font-size:30px;font-weight:800;display:flex;align-items:center;justify-content:center}
.die.roll{animation:sh .4s}
@keyframes sh{0%{transform:rotate(0)}25%{transform:rotate(-20deg)}50%{transform:rotate(15deg)}100%{transform:rotate(0)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
/* Sheet */
.ptabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.ptab{padding:5px 10px;border-radius:20px;background:#eee8da;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.ptab.act{background:var(--green);color:#fff}
.ptab .tok{width:11px;height:11px;border-width:1px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:14px 0 6px}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:3px 2px;border-bottom:1px dashed var(--line);vertical-align:middle}
td.r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:700;border-bottom:2px solid var(--ink)}
.big{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:#f0ebdf;border-radius:10px;padding:8px 10px}
.kpi b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted);font-size:12px}
.pos{color:var(--good)} .neg{color:var(--bad)}
.bar{height:12px;background:#e6e0d2;border-radius:6px;overflow:hidden;margin-top:6px}
.bar div{height:100%;background:linear-gradient(90deg,var(--accent),var(--good));transition:width .4s}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.log{max-height:220px;overflow:auto;font-size:13px;color:#39443e}
.log div{padding:3px 0;border-bottom:1px solid #f0ebe0}
/* Modal */
.ov{position:fixed;inset:0;background:rgba(15,25,20,.55);display:flex;align-items:center;justify-content:center;padding:14px;z-index:10}
.modal{background:var(--panel);border-radius:14px;max-width:520px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.mh{padding:14px 18px;color:#fff;border-radius:14px 14px 0 0;font-weight:700;font-size:18px;display:flex;gap:10px;align-items:center}
.mb{padding:16px 18px}
.mb p{margin:0 0 10px}
.mf{padding:0 18px 16px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.facts{display:grid;grid-template-columns:1fr auto;gap:4px 14px;background:#f3eee2;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14px}
.facts span:nth-child(even){text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.sellrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
/* Setup */
.setup{max-width:640px;margin:30px auto;padding:0 16px}
.setup .panel{padding:22px}
.prow{display:grid;grid-template-columns:22px 1fr 1fr;gap:8px;align-items:center;margin-bottom:8px}
.hint{color:var(--muted);font-size:13px}
.hidden{display:none!important}
.cmini{width:80%;max-width:220px}
.cmini .bar{height:8px;margin-top:3px}
/* Touch & Mobil */
html{-webkit-text-size-adjust:100%}
body{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
header{padding-top:calc(10px + env(safe-area-inset-top));padding-left:calc(16px + env(safe-area-inset-left));padding-right:calc(16px + env(safe-area-inset-right))}
@media (pointer:coarse){
  button{min-height:44px}
  button.sm{min-height:38px;padding:6px 12px}
  input,select{font-size:16px;min-height:44px}
}
#mnav{display:none}
@media(max-width:760px){
  header .hint{display:none}
  header{padding-bottom:8px}
  header h1{font-size:18px}
  main{padding:10px 8px calc(78px + env(safe-area-inset-bottom));gap:10px}
  .board{gap:3px}
  .cell{border-radius:6px}
  .center{gap:6px;padding:6px;border-radius:10px}
  .center h2{font-size:16px}
  .center .hint{font-size:12px}
  .die{width:42px;height:42px;font-size:24px}
  .legend{font-size:11px;gap:4px 10px}
  .sellrow{flex-wrap:wrap}
  .setup{margin:14px auto}
  .setup .panel{padding:16px}
  .prow{grid-template-columns:18px 1fr;}
  .prow select{grid-column:2}
}
@media(max-width:980px){
  main{padding-bottom:calc(78px + env(safe-area-inset-bottom))}
  #game[data-mv="board"] #colSide{display:none}
  #game[data-mv="sheet"] #colBoard, #game[data-mv="sheet"] #logPanel{display:none}
  #game[data-mv="log"] #colBoard, #game[data-mv="log"] #sheet{display:none}
  #game[data-mv="log"] #logPanel{margin-top:0!important}
  #game[data-mv="log"] .log{max-height:none}
  #mnav:not(.hidden){display:flex;position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--green);padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:6px;box-shadow:0 -4px 14px rgba(0,0,0,.2)}
  #mnav button{flex:1;background:transparent;color:#cfe0d6;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 4px}
  #mnav button span{font-size:20px}
  #mnav button.act{background:rgba(255,255,255,.14);color:#fff}
  /* Dialoge als Bottom-Sheet */
  .ov{align-items:flex-end;padding:0}
  .modal{border-radius:18px 18px 0 0;max-height:88vh;padding-bottom:env(safe-area-inset-bottom)}
  .mh{border-radius:18px 18px 0 0}
  .mf button{flex:1}
  #colSide{max-width:720px;margin:0 auto;width:100%}
}
</style>
</head>
<body>
<header>
  <h1>Geld<span>fluss</span></h1>
  <div class="hint" style="color:#cfe0d6">Raus aus dem Hamsterrad – baue passives Einkommen auf</div>
  <div class="sp"></div>
  <button class="sec sm" id="btnRules">Regeln</button>
  <button class="sec sm" id="btnNew">Neues Spiel</button>
</header>

<div id="setup" class="setup"></div>
<main id="game" class="hidden" data-mv="board">
  <div id="colBoard">
    <div class="board" id="board"></div>
    <div class="legend" id="legend"></div>
  </div>
  <div id="colSide">
    <div class="panel" id="sheet"></div>
    <div class="panel" id="logPanel" style="margin-top:16px">
      <h3 style="margin-top:0">Verlauf</h3>
      <div class="log" id="log"></div>
    </div>
  </div>
</main>
<nav id="mnav" class="hidden">
  <button data-v="board" class="act"><span>🎲</span>Spiel</button>
  <button data-v="sheet"><span>📊</span>Finanzen</button>
  <button data-v="log"><span>📜</span>Verlauf</button>
</nav>
<div id="modalRoot"></div>

<script>
"use strict";
// ---------- Hilfen ----------
const $ = s => document.querySelector(s);
const eur = n => (n<0?"−":"") + Math.abs(Math.round(n)).toLocaleString("de-DE") + " €";
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const step = (a,b,s) => a + s*rnd(0, Math.floor((b-a)/s));
const uid = () => Math.random().toString(36).slice(2,9);
const COLORS = ["#e53935","#1e88e5","#fdd835","#8e24aa","#43a047","#fb8c00"];
const SAVE_KEY = "geldfluss-v1";

// ---------- Berufe (eigene Werte, monatlich) ----------
const PROFS = [
  {n:"Verkäufer:in",      salary:2800, tax:480,  wohnen:[750,0],      auto:[180,6000],  karte:[80,2500],  studium:[0,0],     sonst:700,  kind:220, savings:600},
  {n:"Pflegefachkraft",   salary:3400, tax:650,  wohnen:[850,0],      auto:[220,8000],  karte:[90,3000],  studium:[0,0],     sonst:900,  kind:250, savings:800},
  {n:"Elektriker:in",     salary:3600, tax:720,  wohnen:[880,0],      auto:[300,12000], karte:[110,3500], studium:[0,0],     sonst:900,  kind:260, savings:900},
  {n:"Polizist:in",       salary:3900, tax:800,  wohnen:[900,0],      auto:[260,10000], karte:[90,3000],  studium:[0,0],     sonst:1000, kind:270, savings:1000},
  {n:"Lehrkraft",         salary:4100, tax:900,  wohnen:[950,0],      auto:[250,9000],  karte:[100,3000], studium:[150,9000], sonst:950,  kind:280, savings:1200},
  {n:"Bauleiter:in",      salary:5200, tax:1300, wohnen:[1100,190000],auto:[350,14000], karte:[120,4000], studium:[0,0],     sonst:1200, kind:350, savings:1500},
  {n:"Ingenieur:in",      salary:6200, tax:1700, wohnen:[1300,230000],auto:[450,18000], karte:[150,5000], studium:[150,12000],sonst:1400, kind:400, savings:2000},
  {n:"Ärzt:in",           salary:11000,tax:3600, wohnen:[2200,420000],auto:[700,30000], karte:[300,10000],studium:[600,60000],sonst:2200, kind:650, savings:3500},
];

// ---------- Spielfeld ----------
const FT = {
  zahltag:   {l:"Zahltag",     i:"💶", c:"#2e7d32"},
  chance:    {l:"Gelegenheit", i:"💡", c:"#1565c0"},
  markt:     {l:"Markt",       i:"📈", c:"#6a1b9a"},
  konsum:    {l:"Konsum",      i:"🛍️", c:"#c62828"},
  kind:      {l:"Nachwuchs",   i:"👶", c:"#ef6c00"},
  spende:    {l:"Spende",      i:"🤝", c:"#00838f"},
  kuendigung:{l:"Kündigung",   i:"📦", c:"#455a64"},
};
const BOARD = ["zahltag","chance","konsum","chance","markt","chance","kind","chance",
               "zahltag","chance","konsum","chance","markt","chance","spende","chance",
               "zahltag","chance","konsum","chance","markt","chance","kuendigung","chance"];
function ringPos(i){ // 7x7 Rand
  if(i<=6) return [1, i+1];
  if(i<=12) return [i-5, 7];
  if(i<=18) return [7, 7-(i-12)];
  return [7-(i-18), 1];
}

// ---------- Karten ----------
const TICKERS = [
  {t:"NOVX", n:"Novix Software"}, {t:"GRNW", n:"Grünwerk Energie"},
  {t:"MDQ",  n:"Mediq Pharma"},   {t:"BSTF", n:"Baustoff Union"},
];
const STOCK_PRICES = [1,5,5,10,10,10,15,20,20,25,30,40];

function smallDeal(){
  const r = Math.random();
  if(r<0.38){
    const s = pick(TICKERS), price = pick(STOCK_PRICES);
    const txt = price<=5 ? "Kurs im Keller nach schwachen Quartalszahlen." :
                price>=30 ? "Kurs auf Rekordhoch – Analysten sind euphorisch." :
                "Kurs schwankt üblicherweise zwischen 5 € und 30 €.";
    return {kind:"aktie", title:`Aktie: ${s.n} (${s.t})`, ticker:s.t, price, text:txt};
  }
  if(r<0.62){
    const price = step(45000,85000,5000), down = Math.round(price*0.1/500)*500, cf = step(-50,300,50);
    return {kind:"asset", cat:"wohnung", title:"Eigentumswohnung zu verkaufen",
      text: cf<0 ? "Günstig, aber die Miete deckt die Kosten nicht – eher eine Wette auf den Wiederverkauf." : "Vermietete 2-Zimmer-Wohnung in solider Lage.",
      name:"Eigentumswohnung", price, down, cf};
  }
  if(r<0.72){
    const price = step(12000,22000,1000);
    return {kind:"asset", cat:"garage", title:"Garagenhof-Stellplätze", text:"Zwei vermietete Garagen am Stadtrand.",
      name:"Garagen", price, down:2000, cf:step(60,140,20)};
  }
  if(r<0.82){
    const price = step(2000,6000,1000);
    return {kind:"asset", cat:"anleihe", title:"Anleihe-Fonds", text:"Sicher, aber wenig Ertrag. Kann nicht weiterverkauft werden.",
      name:"Anleihe-Fonds", price, down:price, cf:Math.round(price*0.009/5)*5};
  }
  const b = pick([["Snackautomaten-Route","Fünf Automaten in Bürogebäuden."],["Online-Shop für Ersatzteile","Läuft nebenbei, kaum Aufwand."],["Fahrradverleih am See","Saisongeschäft mit treuer Kundschaft."],["Waschstraßen-Gutscheinvertrieb","Provision pro verkauftem Gutschein."]]);
  const price = step(2000,7000,500);
  return {kind:"asset", cat:"klein", title:"Kleinunternehmen: "+b[0], text:b[1], name:b[0], price, down:price, cf:step(100,400,20)};
}
function bigDeal(){
  const r = Math.random();
  if(r<0.55){
    const units = pick([3,4,4,6,8,10,12]), per = step(60000,90000,5000), price = units*per;
    const down = Math.round(price*pick([0.12,0.15,0.18,0.2])/1000)*1000, cf = units*step(80,220,10);
    return {kind:"asset", cat:"haus", title:`Mehrfamilienhaus mit ${units} Einheiten`, text:"Voll vermietet, Hausverwaltung vorhanden.",
      name:`MFH ${units} WE`, units, price, down, cf};
  }
  const g = pick([["Waschsalon",80000],["Autowaschanlage",180000],["Bäckerei-Filiale",120000],["Lagerhalle (vermietet)",250000],["Self-Storage-Anlage",220000],["Ladesäulen-Park",150000]]);
  const price = Math.round(g[1]*pick([0.85,1,1.15])/5000)*5000, down = Math.round(price*pick([0.2,0.25,0.3])/1000)*1000;
  const cf = Math.round(price*pick([0.01,0.012,0.014,0.016])/50)*50;
  return {kind:"asset", cat:"gewerbe", title:g[0]+" zu verkaufen", text:"Etabliertes Geschäft mit Bilanzen der letzten drei Jahre.", name:g[0], price, down, cf};
}
function marketCard(){
  const r = Math.random();
  if(r<0.25) { const o = step(70000,130000,5000); return {kind:"offer", cat:"wohnung", title:"Käufer sucht Eigentumswohnung", text:`Eine Familie bietet ${eur(o)} für eine Eigentumswohnung. Jede Person mit einer Wohnung darf verkaufen.`, offer:()=>o}; }
  if(r<0.45) { const per = step(80000,125000,5000); return {kind:"offer", cat:"haus", title:"Investor kauft Mehrfamilienhäuser", text:`Zahlt ${eur(per)} pro Wohneinheit.`, offer:a=>per*a.units, per}; }
  if(r<0.57) { const f = pick([2,3,4]); return {kind:"offer", cat:"klein", title:"Übernahmeangebot für Kleinunternehmen", text:`Ein Konkurrent zahlt das ${f}-fache des Kaufpreises.`, offer:a=>a.price*f, f}; }
  if(r<0.67) { const f = pick([1.3,1.5,2]); return {kind:"offer", cat:"gewerbe", title:"Fonds kauft Gewerbeobjekte", text:`Angebot: ${String(f).replace(".",",")}-facher Kaufpreis für ein Gewerbe.`, offer:a=>Math.round(a.price*f), f}; }
  if(r<0.74) { const o = step(20000,35000,1000); return {kind:"offer", cat:"garage", title:"Nachbar will Garagen kaufen", text:`Angebot: ${eur(o)}.`, offer:()=>o}; }
  if(r<0.84) return {kind:"event", title:"Mietspiegel steigt", text:"Alle Eigentumswohnungen bringen dauerhaft +50 € Cashflow (alle Spieler).", ev:"miete"};
  if(r<0.92) return {kind:"event", title:"Heizungsschaden", text:"Wer gerade am Zug ist und ein Mehrfamilienhaus besitzt, zahlt 2.500 € Reparatur.", ev:"heizung"};
  return {kind:"event", title:"Aktiensplit 2:1", text:`Die Aktie ${pick(TICKERS).t} wird gesplittet – alle Besitzer haben doppelt so viele Stücke.`, ev:"split"};
}
const KONSUM = [
  ["Neues Smartphone",950],["Waschmaschine kaputt",650],["Spontanurlaub",2400],["Shopping-Wochenende",450],
  ["Strafzettel",80],["Zahnarzt-Zuzahlung",1200],["Riesiger Fernseher",1500],["Hochzeitsgeschenk",300],
  ["Autoreparatur",1100],["Fitness-Jahresvertrag",600],["Designer-Kaffeemaschine",800],["Konzerttickets",350],
  ["NEUWAGEN",0],
];

// ---------- Zustand ----------
let S = null;     // Spielzustand
let view = 0;     // angezeigter Spieler im Bogen

function newPlayer(name, pi, color){
  const p = PROFS[pi];
  return {name, prof:pi, color, cash:p.savings, children:0, loan:0, pos:0, skip:0, charity:0, free:false, bankrupt:false,
    debts:{wohnen:{pay:p.wohnen[0],debt:p.wohnen[1]}, auto:{pay:p.auto[0],debt:p.auto[1]}, karte:{pay:p.karte[0],debt:p.karte[1]}, studium:{pay:p.studium[0],debt:p.studium[1]}},
    assets:[], stocks:{}};
}
const P = () => S.players[S.cur];
const passive = p => p.assets.reduce((s,a)=>s+a.cf,0);
const loanPay = p => Math.round(p.loan/100); // 1 % pro Monat
const loanCap = p => PROFS[p.prof].salary*10;  // freiwilliger Kreditrahmen
function expenses(p){
  const pr = PROFS[p.prof];
  return pr.tax + p.debts.wohnen.pay + p.debts.auto.pay + p.debts.karte.pay + p.debts.studium.pay + pr.sonst + p.children*pr.kind + loanPay(p);
}
const income = p => PROFS[p.prof].salary + passive(p);
const cashflow = p => income(p) - expenses(p);

function log(msg){ S.log.unshift(msg); if(S.log.length>200) S.log.length=200; }
const store = { get:k=>{try{return localStorage.getItem(k)}catch(e){return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}, del:k=>{try{localStorage.removeItem(k)}catch(e){}} };
function save(){ store.set(SAVE_KEY, JSON.stringify(S)); }

// Bezahlen – reicht das Geld nicht, wird automatisch ein Bankkredit aufgenommen
function pay(p, amount, why){
  if(amount<=0) return;
  if(p.cash < amount){
    const need = Math.ceil((amount-p.cash)/1000)*1000;
    p.loan += need; p.cash += need;
    log(`🏦 ${p.name} muss ${eur(need)} Kredit aufnehmen (${why}).`);
  }
  p.cash -= amount;
}

// ---------- Setup ----------
function renderSetup(){
  $("#game").classList.add("hidden"); $("#mnav").classList.add("hidden");
  const saved = store.get(SAVE_KEY);
  let rows = "";
  for(let i=0;i<4;i++){
    rows += `<div class="prow"><span class="tok" style="background:${COLORS[i]}"></span>
      <input id="pn${i}" placeholder="Name Spieler ${i+1}" value="${i===0?"Spieler 1":""}">
      <select id="pp${i}"><option value="-1">Beruf zufällig</option>${PROFS.map((p,j)=>`<option value="${j}">${p.n} (${eur(p.salary)})</option>`).join("")}</select></div>`;
  }
  $("#setup").classList.remove("hidden");
  $("#setup").innerHTML = `<div class="panel">
    <h2 style="margin-top:0">Neues Spiel</h2>
    <p class="hint">1–4 Personen an einem Gerät. Leere Namen werden nicht mitgespielt.</p>
    ${rows}
    <h3>Spielziel</h3>
    <select id="goal" style="width:100%">
      <option value="1">Klassisch: passives Einkommen ≥ Ausgaben</option>
      <option value="2">Profi: passives Einkommen ≥ 2× Ausgaben</option>
    </select>
    <div class="row" style="margin-top:18px;justify-content:flex-end">
      ${saved?'<button class="sec" id="btnCont">Gespeichertes Spiel fortsetzen</button>':""}
      <button class="gold" id="btnStart">Spiel starten</button>
    </div></div>`;
  $("#btnStart").onclick = startGame;
  if(saved) $("#btnCont").onclick = ()=>{ S = JSON.parse(saved); view = S.cur; showGame(); };
}
function startGame(){
  const players = [];
  for(let i=0;i<4;i++){
    const n = $("#pn"+i).value.trim(); if(!n) continue;
    let pi = +$("#pp"+i).value; if(pi<0) pi = rnd(0,PROFS.length-1);
    players.push(newPlayer(n, pi, COLORS[i]));
  }
  if(!players.length){ modal({title:"Keine Spieler", body:"<p>Bitte mindestens einen Namen eingeben.</p>", buttons:[{t:"OK"}]}); return; }
  S = {players, cur:0, goal:+$("#goal").value, phase:"roll", dice:[0], log:[], round:1, over:false};
  players.forEach(p=>log(`${p.name} startet als ${PROFS[p.prof].n} mit ${eur(p.cash)} Ersparnissen.`));
  view = 0; showGame();
}
function showGame(){ $("#setup").classList.add("hidden"); $("#game").classList.remove("hidden"); $("#mnav").classList.remove("hidden"); setView("board"); render(); }
function setView(v){
  $("#game").dataset.mv = v;
  document.querySelectorAll("#mnav button").forEach(b=>b.classList.toggle("act", b.dataset.v===v));
  window.scrollTo(0,0);
}
document.querySelectorAll("#mnav button").forEach(b=>b.onclick=()=>{ if(b.dataset.v==="sheet" && S) { view=S.cur; renderSheet(); } setView(b.dataset.v); });

// ---------- Rendering ----------
function render(){
  save();
  renderBoard(); renderSheet();
  $("#log").innerHTML = S.log.map(l=>`<div>${l}</div>`).join("");
}
function renderBoard(){
  let h = "";
  BOARD.forEach((t,i)=>{
    const [r,c] = ringPos(i), f = FT[t];
    const toks = S.players.filter(p=>p.pos===i && !p.bankrupt).map(p=>`<span class="tok" title="${p.name}" style="background:${p.color}"></span>`).join("");
    h += `<div class="cell ${P().pos===i?"hl":""}" style="grid-row:${r};grid-column:${c};background:${f.c}"><div class="ic">${f.i}</div><div class="lb">${f.l}</div><div class="tokens">${toks}</div></div>`;
  });
  const p = P();
  let ctrl = "";
  if(S.over){
    ctrl = `<h2>Spiel beendet</h2><button class="gold" onclick="renderSetup()">Neues Spiel</button>`;
  } else if(S.phase==="roll"){
    ctrl = p.charity>0
      ? `<div class="row"><button onclick="roll(1)">1 Würfel</button><button class="gold" onclick="roll(2)">2 Würfel</button></div><div class="hint">Spendenbonus noch ${p.charity} Zug/Züge</div>`
      : `<button class="gold" onclick="roll(1)" style="font-size:18px;padding:12px 26px">🎲 Würfeln</button>`;
  } else {
    ctrl = `<button onclick="endTurn()" style="font-size:17px;padding:11px 24px">Zug beenden ➜</button>`;
  }
  const dice = S.dice.map(d=>`<div class="die" id="die">${d||"·"}</div>`).join("");
  h += `<div class="center">
    <div class="hint">Runde ${S.round}</div>
    <h2><span class="tok" style="display:inline-block;background:${p.color};vertical-align:-1px"></span> ${p.name}</h2>
    <div class="hint">${PROFS[p.prof].n} · Bargeld <b>${eur(p.cash)}</b> · Cashflow <b class="${cashflow(p)>=0?"pos":"neg"}">${eur(cashflow(p))}</b></div>
    <div class="cmini hint">Passiv ${eur(passive(p))} von ${eur(expenses(p)*S.goal)}<div class="bar"><div style="width:${Math.max(0,Math.min(100,passive(p)/(expenses(p)*S.goal)*100))}%"></div></div></div>
    <div class="dice">${dice}</div>
    ${ctrl}
  </div>`;
  $("#board").innerHTML = h;
  $("#legend").innerHTML = Object.values(FT).map(f=>`<span><i style="background:${f.c}"></i>${f.i} ${f.l}</span>`).join("");
}
function renderSheet(){
  const p = S.players[view], pr = PROFS[p.prof], isCur = view===S.cur && !S.over;
  const pas = passive(p), exp = expenses(p), goal = exp*S.goal, pct = Math.max(0,Math.min(100, pas/goal*100));

  const dl = {wohnen:p.debts.wohnen.debt>0?"Hypothek Eigenheim":"Miete", auto:"Autokredit", karte:"Kreditkarte", studium:"Studienkredit"};
  let expRows = `<tr><td>Steuern & Abgaben</td><td class="r">${eur(pr.tax)}</td></tr>`;
  for(const k of ["wohnen","auto","karte","studium"]) if(p.debts[k].pay>0) expRows += `<tr><td>${dl[k]}</td><td class="r">${eur(p.debts[k].pay)}</td></tr>`;
  expRows += `<tr><td>Lebenshaltung</td><td class="r">${eur(pr.sonst)}</td></tr>`;
  if(p.children) expRows += `<tr><td>Kinder (${p.children} × ${eur(pr.kind)})</td><td class="r">${eur(p.children*pr.kind)}</td></tr>`;
  if(p.loan) expRows += `<tr><td>Bankkredit (1 %/Monat)</td><td class="r">${eur(loanPay(p))}</td></tr>`;
  let assetRows = p.assets.map(a=>`<tr><td>${a.name}<br><span class="hint">Kauf ${eur(a.price)}${a.mortgage?` · Darlehen ${eur(a.mortgage)}`:""}</span></td><td class="r ${a.cf>=0?"pos":"neg"}">${eur(a.cf)}/M</td></tr>`).join("");
  for(const [t,s] of Object.entries(p.stocks)) assetRows += `<tr><td>${s.qty.toLocaleString("de-DE")} × ${t}<br><span class="hint">Ø ${eur(s.cost/s.qty)} je Aktie</span></td><td class="r">–</td></tr>`;
  let debtRows = "";
  for(const k of ["wohnen","auto","karte","studium"]) if(p.debts[k].debt>0)
    debtRows += `<tr><td>${dl[k]}</td><td class="r">${eur(p.debts[k].debt)}</td><td class="r">${isCur?`<button class="sm sec" ${p.cash<p.debts[k].debt?"disabled":""} onclick="payDebt('${k}')">Tilgen</button>`:""}</td></tr>`;
  if(p.loan) debtRows += `<tr><td>Bankkredit</td><td class="r">${eur(p.loan)}</td><td class="r">${isCur?`<button class="sm sec" ${p.cash<1000?"disabled":""} onclick="repay()">−1.000</button>`:""}</td></tr>`;
  $("#sheet").innerHTML = `<div class="ptabs">${tabs}</div>
    <div class="row" style="justify-content:space-between"><b style="font-size:17px">${p.name}</b><span class="hint">${pr.n}${p.skip?` · setzt ${p.skip}× aus`:""}</span></div>
    <div class="big" style="margin-top:8px">
      <div class="kpi"><small>Bargeld</small><b>${eur(p.cash)}</b></div>
      <div class="kpi"><small>Monatl. Cashflow</small><b class="${cashflow(p)>=0?"pos":"neg"}">${eur(cashflow(p))}</b></div>
    </div>
    <h3>Ausbruch aus dem Hamsterrad</h3>
    <div class="row" style="justify-content:space-between;font-size:14px"><span>Passiv: <b>${eur(pas)}</b></span><span>Ziel: <b>${eur(goal)}</b></span></div>
    <div class="bar"><div style="width:${pct}%"></div></div>
    <h3>Einnahmen</h3>
    <table><tr><td>Gehalt</td><td class="r">${eur(pr.salary)}</td></tr>
      <tr><td>Passives Einkommen</td><td class="r">${eur(pas)}</td></tr>
      <tr class="tot"><td>Gesamt</td><td class="r">${eur(income(p))}</td></tr></table>
    <h3>Ausgaben</h3>
    <table>${expRows}<tr class="tot"><td>Gesamt</td><td class="r">${eur(exp)}</td></tr></table>
    <h3>Vermögenswerte</h3>
    <table>${assetRows||'<tr><td class="hint">Noch keine – nutze Gelegenheiten!</td></tr>'}</table>
    <h3>Verbindlichkeiten</h3>
    <table>${debtRows||'<tr><td class="hint">Schuldenfrei 🎉</td></tr>'}</table>
    ${isCur?`<div class="row" style="margin-top:10px"><button class="sm" onclick="borrow()">Kredit +1.000 €</button><span class="hint">nur bei positivem Cashflow</span></div>`:""}`;
}

// ---------- Modal ----------
function modal({title, color="#0f3d2e", icon="", body="", buttons=[]}){
  const root = $("#modalRoot");
  root.innerHTML = `<div class="ov"><div class="modal"><div class="mh" style="background:${color}">${icon} ${title}</div><div class="mb">${body}</div><div class="mf" id="mf"></div></div></div>`;
  buttons.forEach(b=>{
    const el = document.createElement("button");
    el.textContent = b.t; if(b.cls) el.className = b.cls; if(b.dis) el.disabled = true;
    el.onclick = ()=>{ if(b.keep){ b.fn&&b.fn(); return; } closeModal(); b.fn&&b.fn(); };
    $("#mf").appendChild(el);
  });
}
function closeModal(){ $("#modalRoot").innerHTML=""; }
function done(){ S.phase="end"; checkAll(); render(); }

// ---------- Zugablauf ----------
function roll(n){
  const p = P();
  if(p.charity>0) p.charity--;
  S.dice = Array.from({length:n},()=>rnd(1,6));
  const total = S.dice.reduce((a,b)=>a+b,0);
  const old = p.pos; p.pos = (p.pos+total) % BOARD.length;
  log(`🎲 ${p.name} würfelt ${S.dice.join(" + ")} = ${total}.`);
  // Zahltage überquert (ohne das Zielfeld)
  for(let k=1;k<total;k++) if(BOARD[(old+k)%BOARD.length]==="zahltag") payday(p);
  S.phase="resolve"; render();
  const d = document.querySelectorAll(".die"); d.forEach(x=>x.classList.add("roll"));
  setTimeout(()=>resolveField(p), 380);
}
function payday(p){
  const cf = cashflow(p);
  if(cf>=0){ p.cash += cf; log(`💶 Zahltag für ${p.name}: +${eur(cf)}.`); return; }
  // negativer Cashflow
  if(p.cash >= -cf){ p.cash += cf; log(`⚠️ Zahltag für ${p.name}: ${eur(cf)} (negativer Cashflow).`); return; }
  liquidate(p, -cf);
}
function liquidate(p, need){
  log(`🚨 ${p.name} kann den negativen Cashflow nicht decken – Notverkauf zum halben Wert.`);
  for(const a of [...p.assets]){
    if(p.cash>=need) break;
    p.cash += Math.max(0, Math.round(a.price*0.5) - a.mortgage);
    p.assets = p.assets.filter(x=>x!==a);
  }
  for(const t of Object.keys(p.stocks)){
    if(p.cash>=need) break;
    p.cash += Math.round(p.stocks[t].cost*0.5); delete p.stocks[t];
  }
  if(p.cash>=need && cashflow(p)>=0){ p.cash -= need; return; }
  if(p.cash>=need){ p.cash -= need; return; }
  p.bankrupt = true; log(`✖ ${p.name} ist insolvent und scheidet aus.`);
}
function resolveField(p){
  const t = BOARD[p.pos], f = FT[t];
  if(t==="zahltag"){ payday(p); modal({title:"Zahltag", icon:f.i, color:f.c, body:`<p>Dein monatlicher Cashflow von <b>${eur(cashflow(p))}</b> wird verbucht.</p>`, buttons:[{t:"Weiter", fn:done}]}); return; }
  if(t==="chance"){
    modal({title:"Gelegenheit", icon:f.i, color:f.c,
      body:`<p>Welche Art von Geschäft suchst du?</p><div class="facts"><span>Kleines Geschäft</span><span>bis ca. 7.000 €</span><span>Großes Geschäft</span><span>ab ca. 7.000 € Eigenkapital</span></div><p class="hint">Bargeld: ${eur(p.cash)}</p>`,
      buttons:[{t:"Kleines Geschäft", fn:()=>showDeal(smallDeal())},{t:"Großes Geschäft", cls:"gold", fn:()=>showDeal(bigDeal())}]});
    return;
  }
  if(t==="markt"){ showMarket(marketCard()); return; }
  if(t==="konsum"){
    const k = pick(KONSUM);
    if(k[0]==="NEUWAGEN"){
      p.debts.auto.pay += 250; p.debts.auto.debt += 15000;
      log(`🚗 ${p.name} least einen Neuwagen: +250 €/Monat, +15.000 € Schulden.`);
      modal({title:"Konsum: Neuwagen!", icon:f.i, color:f.c, body:`<p>Du konntest nicht widerstehen und hast einen Neuwagen finanziert.</p><div class="facts"><span>Neue Rate</span><span>+250 €/Monat</span><span>Neue Schulden</span><span>15.000 €</span></div>`, buttons:[{t:"Autsch", fn:done}]});
    } else {
      pay(p, k[1], k[0]); log(`🛍️ ${p.name}: ${k[0]} kostet ${eur(k[1])}.`);
      modal({title:"Konsum", icon:f.i, color:f.c, body:`<p><b>${k[0]}</b></p><div class="facts"><span>Kosten</span><span>${eur(k[1])}</span></div>`, buttons:[{t:"Bezahlen", fn:done}]});
    }
    return;
  }
  if(t==="kind"){
    if(p.children<3){ p.children++; log(`👶 ${p.name} bekommt Nachwuchs (${p.children}).`);
      modal({title:"Nachwuchs!", icon:f.i, color:f.c, body:`<p>Herzlichen Glückwunsch! Deine monatlichen Ausgaben steigen um <b>${eur(PROFS[p.prof].kind)}</b>.</p>`, buttons:[{t:"Wie schön", fn:done}]});
    } else modal({title:"Nachwuchs?", icon:f.i, color:f.c, body:`<p>Drei Kinder sind genug – nichts passiert.</p>`, buttons:[{t:"Weiter", fn:done}]});
    return;
  }
  if(t==="spende"){
    const amt = Math.round(income(p)*0.1);
    modal({title:"Spende", icon:f.i, color:f.c, body:`<p>Spende 10 % deines Einkommens (<b>${eur(amt)}</b>) für einen guten Zweck. Dafür darfst du die nächsten <b>3 Züge</b> wahlweise mit 2 Würfeln würfeln.</p>`,
      buttons:[{t:"Nein danke", cls:"sec", fn:done},{t:`Spenden (${eur(amt)})`, cls:"gold", dis:p.cash<amt, fn:()=>{ p.cash-=amt; p.charity=3; log(`🤝 ${p.name} spendet ${eur(amt)}.`); done(); }}]});
    return;
  }
  if(t==="kuendigung"){
    const e = expenses(p); pay(p, e, "Kündigung"); p.skip = 2;
    log(`📦 ${p.name} verliert den Job: zahlt ${eur(e)} und setzt 2 Runden aus.`);
    modal({title:"Kündigung", icon:f.i, color:f.c, body:`<p>Dein Arbeitgeber baut Stellen ab. Du zahlst eine Monatsausgabe von <b>${eur(e)}</b> und setzt <b>2 Runden</b> aus.</p>`, buttons:[{t:"Mist", fn:done}]});
  }
}

// ---------- Geschäfte ----------
function showDeal(c){
  const p = P();
  if(c.kind==="aktie"){
    const holders = S.players.filter(q=>!q.bankrupt && q.stocks[c.ticker]);
    const sellHtml = holders.map(q=>`<div class="sellrow"><span>${q.name}: ${q.stocks[c.ticker].qty.toLocaleString("de-DE")} Stück (Ø ${eur(q.stocks[c.ticker].cost/q.stocks[c.ticker].qty)})</span><button class="sm red" onclick="sellStock(${S.players.indexOf(q)},'${c.ticker}',${c.price})">Alle verkaufen: ${eur(q.stocks[c.ticker].qty*c.price)}</button></div>`).join("");
    const maxQ = Math.floor(p.cash/c.price);
    modal({title:c.title, icon:"📊", color:"#1565c0",
      body:`<p>${c.text}</p><div class="facts"><span>Aktueller Kurs</span><span>${eur(c.price)}</span><span>Dein Bargeld</span><span>${eur(p.cash)}</span><span>Maximal kaufbar</span><span>${maxQ.toLocaleString("de-DE")} Stück</span></div>
      <div class="row"><input type="number" id="qty" min="1" step="100" value="${Math.min(maxQ, 100)}" style="width:130px"> Stück <button class="sm" onclick="buyStock('${c.ticker}',${c.price})">Kaufen</button></div>
      ${sellHtml?`<h3>Zum aktuellen Kurs verkaufen</h3>${sellHtml}`:""}<p class="hint" id="stockMsg" style="margin-top:8px"></p>`,
      buttons:[{t:"Fertig", fn:done}]});
    return;
  }
  const mortgage = c.price - c.down, can = p.cash >= c.down;
  const needLoan = can ? 0 : Math.ceil((c.down-p.cash)/1000)*1000;
  const loanOk = can || (cashflow(p) + c.cf - needLoan/100 >= 0 && p.loan + needLoan <= loanCap(p));
  modal({title:c.title, icon:c.cat==="haus"||c.cat==="wohnung"?"🏠":c.cat==="anleihe"?"📜":c.cat==="garage"?"🚗":"🏪", color:"#1565c0",
    body:`<p>${c.text}</p><div class="facts"><span>Kaufpreis</span><span>${eur(c.price)}</span><span>Eigenkapital</span><span>${eur(c.down)}</span>${mortgage?`<span>Darlehen</span><span>${eur(mortgage)}</span>`:""}<span>Cashflow (nach Zins & Tilgung)</span><span class="${c.cf>=0?"pos":"neg"}">${eur(c.cf)}/Monat</span><span>Rendite aufs Eigenkapital</span><span>${(c.cf*12/c.down*100).toFixed(1).replace(".",",")} % p.a.</span></div>
    <p class="hint">Dein Bargeld: ${eur(p.cash)}${!can ? (loanOk ? ` – fehlende ${eur(needLoan)} per Bankkredit (${eur(needLoan/100)}/Monat) finanzierbar.` : ` – die Bank finanziert die fehlenden ${eur(needLoan)} nicht (Cashflow würde negativ oder Kreditrahmen ${eur(loanCap(p))} überschritten).`) : ""}</p>`,
    buttons:[{t:"Ablehnen", cls:"sec", fn:done},
      {t: can?"Kaufen":"Mit Kredit kaufen", cls:"gold", dis:!loanOk, fn:()=>{
        pay(p, c.down, c.name);
        p.assets.push({id:uid(), cat:c.cat, name:c.name, price:c.price, mortgage, cf:c.cf, units:c.units||0});
        log(`✅ ${p.name} kauft ${c.name} für ${eur(c.price)} (EK ${eur(c.down)}, Cashflow ${eur(c.cf)}).`);
        done();
      }}]});
}
function buyStock(t, price){
  const p = P(), q = Math.floor(+$("#qty").value||0);
  if(q<=0) return;
  if(q*price > p.cash){ $("#stockMsg").textContent = "Nicht genug Bargeld."; return; }
  p.cash -= q*price;
  const s = p.stocks[t] || (p.stocks[t]={qty:0,cost:0}); s.qty+=q; s.cost+=q*price;
  log(`📊 ${p.name} kauft ${q.toLocaleString("de-DE")} × ${t} zu ${eur(price)}.`);
  closeModal(); done();
}
function sellStock(pi, t, price){
  const q = S.players[pi], s = q.stocks[t]; if(!s) return;
  const g = s.qty*price - s.cost;
  q.cash += s.qty*price; delete q.stocks[t];
  log(`📊 ${q.name} verkauft ${s.qty.toLocaleString("de-DE")} × ${t} zu ${eur(price)} (${g>=0?"Gewinn":"Verlust"} ${eur(Math.abs(g))}).`);
  closeModal(); done();
}

// ---------- Markt ----------
function showMarket(c){
  const p = P(), f = FT.markt;
  if(c.kind==="event"){
    if(c.ev==="miete"){ S.players.forEach(q=>q.assets.forEach(a=>{ if(a.cat==="wohnung") a.cf+=50; })); log("📈 Mietspiegel steigt: Eigentumswohnungen +50 €/Monat."); }
    if(c.ev==="heizung"){ if(p.assets.some(a=>a.cat==="haus")){ pay(p,2500,"Heizungsschaden"); log(`🔧 ${p.name} zahlt 2.500 € für die Heizung.`); } else c.text += " – Du besitzt keins, Glück gehabt!"; }
    if(c.ev==="split"){ const t = c.text.match(/Aktie (\w+)/)[1]; S.players.forEach(q=>{ if(q.stocks[t]) q.stocks[t].qty*=2; }); log(`📈 Aktiensplit ${t} 2:1.`); }
    modal({title:c.title, icon:f.i, color:f.c, body:`<p>${c.text}</p>`, buttons:[{t:"Weiter", fn:done}]});
    return;
  }
  S._offer = c;
  const rows = [];
  S.players.forEach((q,qi)=>{ if(q.bankrupt) return; q.assets.forEach(a=>{ if(a.cat===c.cat){
    const o = c.offer(a), net = o - a.mortgage;
    rows.push(`<div class="sellrow"><span><b>${q.name}</b>: ${a.name}<br><span class="hint">Kauf ${eur(a.price)} · Darlehen ${eur(a.mortgage)} · CF ${eur(a.cf)}</span></span><button class="sm red" onclick="sellAsset(${qi},'${a.id}')">Verkaufen<br>netto ${eur(net)}</button></div>`);
  }}); });
  modal({title:c.title, icon:f.i, color:f.c, body:`<p>${c.text}</p>${rows.length?rows.join(""):'<p class="hint">Niemand besitzt einen passenden Vermögenswert.</p>'}`, buttons:[{t:"Fertig", fn:()=>{ delete S._offer; done(); }}]});
}
function sellAsset(qi, id){
  const q = S.players[qi], a = q.assets.find(x=>x.id===id), c = S._offer; if(!a||!c) return;
  const o = c.offer(a), net = o - a.mortgage;
  q.cash += net; q.assets = q.assets.filter(x=>x!==a);
  log(`💰 ${q.name} verkauft ${a.name} für ${eur(o)} (netto ${eur(net)}).`);
  showMarket(c); checkAll(); renderSheet(); save();
}

// ---------- Finanzen ----------
function borrow(){
  const p = P();
  if(cashflow(p) - 10 < 0 || p.loan + 1000 > loanCap(p)){ modal({title:"Kein Kredit", body:`<p>Die Bank verleiht nur, wenn dein Cashflow danach positiv bleibt und dein Kreditrahmen (10 × Monatsgehalt = ${eur(loanCap(p))}) nicht überschritten wird.</p>`, buttons:[{t:"OK"}]}); return; }
  p.loan += 1000; p.cash += 1000; log(`🏦 ${p.name} nimmt 1.000 € Kredit auf.`); render();
}
function repay(){ const p = P(); if(p.cash<1000||p.loan<1000) return; p.loan-=1000; p.cash-=1000; log(`🏦 ${p.name} tilgt 1.000 € Kredit.`); checkAll(); render(); }
function payDebt(k){
  const p = P(), d = p.debts[k]; if(p.cash<d.debt) return;
  p.cash -= d.debt; log(`✂️ ${p.name} tilgt ${k==="wohnen"?"die Hypothek":k==="auto"?"den Autokredit":k==="karte"?"die Kreditkarte":"den Studienkredit"} (${eur(d.debt)}) – ${eur(d.pay)} weniger Ausgaben.`);
  d.debt=0; d.pay = k==="wohnen" ? 0 : 0; checkAll(); render();
}

// ---------- Sieg / Ende ----------
function checkAll(){
  S.players.forEach(p=>{
    if(p.free||p.bankrupt) return;
    const pas = passive(p);
    if(pas>0 && pas >= expenses(p)*S.goal){
      p.free = true; S.winners = (S.winners||[]); S.winners.push(p.name);
      log(`🏆 ${p.name} ist aus dem Hamsterrad ausgebrochen! (Platz ${S.winners.length})`);
      setTimeout(()=>modal({title:"Finanzielle Freiheit!", icon:"🏆", color:"#d9a62e",
        body:`<p><b>${p.name}</b> hat es geschafft: Das passive Einkommen von <b>${eur(pas)}</b> deckt ${S.goal>1?"das Doppelte der":"die"} monatlichen Ausgaben (${eur(expenses(p))}).</p><p>Platz <b>${S.winners.length}</b> in Runde ${S.round}.</p>`,
        buttons:[{t:"Weiter", cls:"gold"}]}), 50);
    }
  });
  const active = S.players.filter(p=>!p.free&&!p.bankrupt);
  if(!active.length) S.over = true;
}
function endTurn(){
  S.dice = S.dice.map(()=>0);
  const n = S.players.length;
  if(S.players.every(p=>p.free||p.bankrupt)){ S.over=true; render(); return; }
  let i = S.cur;
  for(let guard=0; guard<n*4; guard++){
    i = (i+1)%n; if(i===0) S.round++;
    const q = S.players[i];
    if(q.free||q.bankrupt) continue;
    if(q.skip>0){ q.skip--; log(`⏸️ ${q.name} setzt aus (noch ${q.skip}).`); continue; }
    break;
  }
  S.cur = i; S.phase="roll"; view = i; S.dice=[0]; setView("board"); render();
}

// ---------- Regeln ----------
function rules(){
  modal({title:"Spielregeln", icon:"📖", body:`
  <p><b>Ziel:</b> Baue so viel passives Einkommen (aus Immobilien, Unternehmen, Anleihen) auf, dass es deine monatlichen Ausgaben deckt – dann bist du raus aus dem Hamsterrad.</p>
  <p><b>Zug:</b> Würfeln, Feld abhandeln, Zug beenden. Über ein 💶 <b>Zahltag</b>-Feld zu ziehen oder darauf zu landen bringt deinen monatlichen Cashflow.</p>
  <p>💡 <b>Gelegenheit:</b> Wähle ein kleines oder großes Geschäft. Immobilien werden mit Eigenkapital + Darlehen gekauft; der angezeigte Cashflow ist bereits nach Darlehensrate. Aktien bringen keinen Cashflow – Gewinn nur durch Verkauf, wenn eine Karte einen besseren Kurs zeigt (alle Spieler dürfen dann verkaufen).</p>
  <p>📈 <b>Markt:</b> Käufer machen Angebote. Jede Person mit passendem Objekt darf verkaufen – das Darlehen wird vom Erlös abgezogen.</p>
  <p>🛍️ <b>Konsum</b> kostet Geld, 👶 <b>Nachwuchs</b> erhöht die Ausgaben, 🤝 <b>Spende</b> erlaubt 3 Züge lang 2 Würfel, 📦 <b>Kündigung</b> kostet eine Monatsausgabe und 2 Runden Aussetzen.</p>
  <p>🏦 <b>Kredit:</b> In 1.000-€-Schritten, Zinsen 1 % pro Monat (10 € je 1.000 €). Freiwillig nur bei positivem Cashflow und bis max. 10 × Monatsgehalt; reicht das Geld für Pflichtzahlungen nicht, wird automatisch Kredit aufgenommen. Konsumschulden kannst du jederzeit komplett tilgen, um Ausgaben zu senken.</p>
  <p>✖ <b>Insolvenz:</b> Kannst du einen negativen Zahltag nicht bezahlen, wird dein Vermögen zum halben Wert verkauft. Reicht das nicht, scheidest du aus.</p>
  <p class="hint">Der Spielstand wird automatisch im Browser gespeichert.</p>`, buttons:[{t:"Los geht's", cls:"gold"}]});
}

$("#btnRules").onclick = rules;
function resetGame(){ store.del(SAVE_KEY); S=null; renderSetup(); }
$("#btnNew").onclick = ()=>{
  if(!S || S.over) return resetGame();
  modal({title:"Neues Spiel?", body:"<p>Das aktuelle Spiel wird verworfen.</p>", buttons:[{t:"Abbrechen", cls:"sec"},{t:"Neu beginnen", cls:"red", fn:resetGame}]});
};
renderSetup();
</script>
