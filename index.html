// ---------- Dialoge ----------
function modal({title, color="#0f3d2e", icon="", body="", buttons=[]}){
  const root = $("#modalRoot");
  root.innerHTML = `<div class="ov"><div class="modal"><div class="mh" style="background:${color}">${icon} ${title}</div><div class="mb">${body}</div><div class="mf" id="mf"></div></div></div>`;
  buttons.forEach(b=>{
    const el = document.createElement("button");
    el.textContent = b.t; if(b.cls) el.className = b.cls; if(b.dis) el.disabled = true;
    el.onclick = ()=>{ const v = b.read ? b.read() : undefined; if(b.check && !b.check(v)) return; closeModal(); b.fn&&b.fn(v); flushQ(); };
    $("#mf").appendChild(el);
  });
}
function queueModal(o){ if($("#modalRoot").innerHTML) mq.push(o); else modal(o); }
function flushQ(){ if(!$("#modalRoot").innerHTML && mq.length) modal(mq.shift()); }
function closeModal(){ $("#modalRoot").innerHTML=""; }
function done(){ S.phase="end"; checkAll(); render(); }

// ---------- Computer-Spieler ----------
function scheduleAI(){
  clearTimeout(aiTimer);
  if(!S || S.over) return;
  const p = P(); if(!p.ai) return;
  aiTimer = setTimeout(()=>{
    if(!S || S.over || P()!==p) return;
    if($("#modalRoot").innerHTML || S.phase==="resolve"){ scheduleAI(); return; }
    if(S.phase==="roll"){ aiManage(p); roll(p.charity>0?2:1); }
    else if(S.phase==="end") endTurn();
  }, 1000);
}
function aiManage(p){
  if(p.fast) return;
  for(const k of ["karte","auto","studium","wohnen"]){
    const d = p.debts[k]; if(d.debt>0 && p.cash >= d.debt + 2000) doPayDebt(p,k);
  }
  while(p.loan>=1000 && p.cash >= (XP()?4000:9000)){ p.loan-=1000; p.cash-=1000; }
  if(XP() && !p.insured && p.assets.filter(isProp).length>=2){ p.insured = true; log(`🛡️ ${nm(p)} schließt eine Versicherung ab.`); }
  // ETF: kleiner Sparplan, sobald keine Konsumschulden mehr; Entnahmeplan, wenn er den Ausbruch bringt
  const e = etfOf(p);
  if(!e.rate && !e.withdraw && cashflow(p) > 1000 && !["karte","auto"].some(k=>p.debts[k].debt>0)){ e.rate = 100; log(`📈 ${nm(p)} startet einen ETF-Sparplan (100 € pro Zahltag).`); }
  if(!e.withdraw && etfValue(p)>0 && passive(p) + Math.round(etfValue(p)*ETF.wdRate/12) >= expenses(p)*S.goal){ e.withdraw = true; e.rate = 0; log(`📈 ${nm(p)} startet den 4-%-Entnahmeplan.`); checkAll(); }
}
function aiWantsAsset(p,c){
  if(c.cf<=0 || c.cf*12/c.down < 0.12) return false;
  if(p.cash>=c.down) return true;
  const need = Math.ceil((c.down-p.cash)/1000)*1000;   // Rest per Kredit – wie bei Menschen
  return c.cf - need/100 >= 50 && cashflow(p) + c.cf - need/100 >= 0 && p.loan + need <= loanCap(p);
}
// Experte: Netto-Rechnung nach Steuern und Rücklage, Eigenkapital inkl. Nebenkosten
function aiExpertChoice(p,c){
  const long = S.rate < 0.045;   // bei niedrigen Zinsen lang binden
  const cf = exCf(c,long), net = exNet(c, cf, taxRate(p)), eq = c.down + c.nk;
  if(cf<=0 || net<=0 || net*12/eq < 0.04) return null;
  if(p.cash >= eq + 1000) return long;
  const need = Math.ceil((eq-p.cash)/1000)*1000;
  return (need <= 10000 && net - need/100 >= 60 && cashflow(p) + cf - need/100 >= 0 && p.loan + need <= loanCap(p)) ? long : null;
}

// ---------- Zugablauf ----------
function roll(n){
  const p = P(); if(S.phase!=="roll") return;
  if(p.charity>0) p.charity--;
  S.dice = Array.from({length:n},()=>rnd(1,6));
  const total = S.dice.reduce((a,b)=>a+b,0);
  log(`🎲 ${nm(p)} würfelt ${S.dice.join(" + ")} = ${total}.`);
  if(p.fast){
    const old = p.fast.pos; p.fast.pos = (old+total) % FAST.length;
    for(let k=1;k<total;k++) if(FAST[(old+k)%FAST.length]==="fzahltag") fastPayday(p);
  } else {
    const old = p.pos; p.pos = (old+total) % BOARD.length;
    for(let k=1;k<total;k++) if(BOARD[(old+k)%BOARD.length]==="zahltag") payday(p);
  }
  S.phase="resolve"; render();
  document.querySelectorAll(".die").forEach(x=>x.classList.add("roll"));
  setTimeout(()=> p.fast ? resolveFast(p) : withReport(p, ()=>resolveField(p)), 380);
}
function payday(p){
  const cf = cashflow(p);
  st(p).interest += loanPay(p);
  if(cf>=0){ p.cash += cf; log(`💶 Zahltag für ${nm(p)}: +${eur(cf)}.`); }
  else if(p.cash >= -cf){ p.cash += cf; log(`⚠️ Zahltag für ${nm(p)}: ${eur(cf)} (negativer Cashflow).`); }
  else { liquidate(p, -cf); if(p.bankrupt) return; }
  etfPayday(p);
  if(XP() && !p.fast) exPayday(p);
}
function fastPayday(p){ p.cash += p.fast.fc; log(`💰 Geldfluss-Tag für ${nm(p)}: +${eur(p.fast.fc)}.`); }
function liquidate(p, need){
  log(`🚨 ${nm(p)} kann den negativen Cashflow nicht decken – Notverkauf zum halben Wert.`);
  if(etfValue(p)>0 && p.cash<need){ const v = etfValue(p); etfSell(p, v); etfOf(p).withdraw = false; log(`📈 ${nm(p)} muss das ETF-Depot (${eur(v)}) verkaufen.`); }
  for(const a of [...p.assets]){
    if(p.cash>=need) break;
    p.cash += Math.max(0, Math.round(a.price*0.5) - a.mortgage);
    p.assets = p.assets.filter(x=>x!==a);
  }
  for(const t of Object.keys(p.stocks)){
    if(p.cash>=need) break;
    p.cash += Math.round(p.stocks[t].cost*0.5); delete p.stocks[t];
  }
  if(p.cash>=need){ p.cash -= need; return; }
  p.bankrupt = true; log(`✖ ${nm(p)} ist insolvent und scheidet aus.`);
}
// Zeigt Menschen einen Info-Dialog; Computer machen sofort weiter
function info(p, f, title, body, btn="Weiter"){
  if(p.ai) return done();
  modal({title, icon:f.i, color:f.c, body, buttons:[{t:btn, fn:done}]});
}
function resolveField(p){
  const t = BOARD[p.pos], f = FT[t];
  if(t==="zahltag"){ const cf = cashflow(p); payday(p); return info(p, f, "Zahltag", `<p>Dein monatlicher Cashflow von <b>${eur(cf)}</b> wird verbucht.</p>${XP()?takeReport():""}`); }
  if(t==="chance"){
    if(p.ai) return showDeal(p.cash>=(XP()?80000:40000) ? bigDeal() : smallDeal());
    return modal({title:"Gelegenheit", icon:f.i, color:f.c,
      body:`<p>Welche Art von Geschäft suchst du?</p><div class="facts"><span>Kleines Geschäft</span><span>bis ca. 7.000 €</span><span>Großes Geschäft</span><span>ab ca. 7.000 € Eigenkapital</span></div><p class="hint">Bargeld: ${eur(p.cash)}</p>`,
      buttons:[{t:"Kleines Geschäft", fn:()=>showDeal(smallDeal())},{t:"Großes Geschäft", cls:"gold", fn:()=>showDeal(bigDeal())}]});
  }
  if(t==="markt") return showMarket(marketCard());
  if(t==="konsum"){
    const k = pick(KONSUM);
    if(k[0]==="NEUWAGEN"){
      p.debts.auto.pay += 250; p.debts.auto.debt += 15000;
      log(`🚗 ${nm(p)} finanziert einen Neuwagen: +250 €/Monat, +15.000 € Schulden.`);
      return info(p, f, "Konsum: Neuwagen!", `<p>Du konntest nicht widerstehen und hast einen Neuwagen finanziert.</p><div class="facts"><span>Neue Rate</span><span>+250 €/Monat</span><span>Neue Schulden</span><span>15.000 €</span></div>`, "Autsch");
    }
    pay(p, k[1], k[0]); st(p).konsum += k[1]; log(`🛍️ ${nm(p)}: ${k[0]} kostet ${eur(k[1])}.`);
    return info(p, f, "Konsum", `<p><b>${k[0]}</b></p><div class="facts"><span>Kosten</span><span>${eur(k[1])}</span></div>${coachBox(`Kleine Ausgaben summieren sich: Du hast bisher <b>${eur(st(p).konsum)}</b> für Konsum ausgegeben${st(p).konsum>=5000?" – das wäre Eigenkapital für ein Geschäft gewesen":""}.`)}`, "Bezahlen");
  }
  if(t==="kind"){
    if(p.children<3){ p.children++; log(`👶 ${nm(p)} bekommt Nachwuchs (${p.children}).`);
      return info(p, f, "Nachwuchs!", `<p>Herzlichen Glückwunsch! Deine monatlichen Ausgaben steigen um <b>${eur(PROFS[p.prof].kind)}</b>.</p>`, "Wie schön"); }
    return info(p, f, "Nachwuchs?", `<p>Drei Kinder sind genug – nichts passiert.</p>`);
  }
  if(t==="spende"){
    const amt = Math.round(income(p)*0.1);
    const give = ()=>{ p.cash-=amt; p.charity=3; st(p).charity += amt; log(`🤝 ${nm(p)} spendet ${eur(amt)}.`); };
    if(p.ai){ if(p.cash>=amt+3000) give(); return done(); }
    return modal({title:"Spende", icon:f.i, color:f.c, body:`<p>Spende 10 % deines Einkommens (<b>${eur(amt)}</b>) für einen guten Zweck. Dafür darfst du die nächsten <b>3 Züge</b> wahlweise mit 2 Würfeln würfeln.</p>${coachBox(p.cash>=amt+3000?"Lohnt sich: Mit 2 Würfeln kommst du schneller an Zahltagen und Gelegenheiten vorbei – und du hast genug Polster.":"Lieber nicht: Danach wäre dein Polster sehr klein, und Konsum-Felder würden dich in teure Kredite zwingen.")}`,
      buttons:[{t:"Nein danke", cls:"sec", fn:done},{t:`Spenden (${eur(amt)})`, cls:"gold", dis:p.cash<amt, fn:()=>{ give(); done(); }}]});
  }
  if(t==="kuendigung"){
    const e = expenses(p); pay(p, e, "Kündigung"); p.skip = 2;
    log(`📦 ${nm(p)} verliert den Job: zahlt ${eur(e)} und setzt 2 Runden aus.`);
    return info(p, f, "Kündigung", `<p>Dein Arbeitgeber baut Stellen ab. Du zahlst eine Monatsausgabe von <b>${eur(e)}</b> und setzt <b>2 Runden</b> aus.</p>`, "Mist");
  }
}

// ---------- Freiheitsbahn ----------
function resolveFast(p){
  const t = FAST[p.fast.pos], f = FTF[t];
  if(t==="fzahltag"){ fastPayday(p); return info(p, f, "Geldfluss-Tag", `<p>Dein Freiheits-Cashflow von <b>${eur(p.fast.fc)}</b> wird verbucht.</p>`); }
  if(t==="invest"){
    const c = fastInvest();
    const buy = ()=>{ p.cash -= c.cost; p.fast.invests.push(c); p.fast.fc += c.fc; log(`🏗️ ${nm(p)} investiert ${eur(c.cost)} in ${c.name}: +${eur(c.fc)} Freiheits-Cashflow.`); };
    if(p.ai){ if(p.cash>=c.cost) buy(); else log(`${nm(p)} kann sich ${c.name} (${eur(c.cost)}) nicht leisten.`); return done(); }
    return modal({title:"Großinvestition: "+c.name, icon:c.icon, color:f.c,
      body:`<div class="facts"><span>Kaufpreis (nur bar)</span><span>${eur(c.cost)}</span><span>Zusätzlicher Freiheits-Cashflow</span><span class="pos">+${eur(c.fc)}</span><span>Rendite</span><span>${(c.fc/c.cost*100).toFixed(0)} % pro Geldfluss-Tag</span></div><p class="hint">Dein Bargeld: ${eur(p.cash)}</p>`,
      buttons:[{t:"Ablehnen", cls:"sec", fn:done},{t:"Investieren", cls:"gold", dis:p.cash<c.cost, fn:()=>{ buy(); done(); }}]});
  }
  if(t==="traum"){
    const di = S.dreamFields[p.fast.pos], d = DREAMS[di], own = di===p.dream;
    if(!own){
      const who = S.players.filter(q=>q.dream===di).map(q=>q.name).join(", ");
      return info(p, f, `${d.i} ${d.n}`, `<p>Ein schöner Traum – aber nicht deiner${who?` (sondern von ${who})`:""}. Nichts passiert.</p>`);
    }
    const buy = ()=>{ p.cash -= d.cost; p.fast.dreamBought = true; log(`🌟 ${nm(p)} erfüllt sich den Traum: ${d.i} ${d.n}!`); };
    if(p.ai){ if(p.cash>=d.cost) buy(); else log(`${nm(p)} steht vor dem Traum, hat aber erst ${eur(p.cash)}.`); return done(); }
    return modal({title:`Dein Traum: ${d.n}`, icon:d.i, color:f.c,
      body:`<p>Du stehst vor deinem Lebenstraum! Wenn du ihn jetzt bezahlst, hast du das Spiel gewonnen.</p><div class="facts"><span>Preis</span><span>${eur(d.cost)}</span><span>Dein Bargeld</span><span>${eur(p.cash)}</span></div>`,
      buttons:[{t:p.cash<d.cost?"Noch zu teuer":"Später", cls:"sec", fn:done},{t:"Traum kaufen 🌟", cls:"gold", dis:p.cash<d.cost, fn:()=>{ buy(); done(); }}]});
  }
  if(t==="risiko"){
    const r = pick(RISKS), before = p.cash, extra = r.fn(p) || "";
    log(`⚡ ${nm(p)}: ${r.t}${before!==p.cash?` (−${eur(before-p.cash)})`:""}.${extra}`);
    return info(p, f, r.t, `<p>${r.text}${extra}</p>${before!==p.cash?`<div class="facts"><span>Verlust</span><span class="neg">${eur(before-p.cash)}</span></div>`:""}`, "Mist");
  }
  if(t==="wagnis"){
    const go = ()=>{
      p.cash -= WAGNIS_COST; const w = rnd(1,6);
      if(w>=5){ p.cash += WAGNIS_WIN; log(`🎯 ${nm(p)} wagt ein Start-up-Investment – Würfel ${w}: Volltreffer, +${eur(WAGNIS_WIN)}!`); return `<p>🎲 Du würfelst eine <b>${w}</b> – <b>Volltreffer!</b> Das Start-up wird übernommen: +${eur(WAGNIS_WIN)}.</p>`; }
      log(`🎯 ${nm(p)} wagt ein Start-up-Investment – Würfel ${w}: leider verloren.`); return `<p>🎲 Du würfelst eine <b>${w}</b> – das Start-up ist gescheitert. ${eur(WAGNIS_COST)} sind weg.</p>`;
    };
    if(p.ai){ if(p.cash >= WAGNIS_COST*4) go(); return done(); }
    return modal({title:"Wagnis: Start-up-Beteiligung", icon:f.i, color:f.c,
      body:`<p>Investiere <b>${eur(WAGNIS_COST)}</b> in ein junges Start-up. Würfelst du eine <b>5 oder 6</b>, bekommst du <b>${eur(WAGNIS_WIN)}</b>. Sonst ist das Geld weg.</p><p class="hint">Dein Bargeld: ${eur(p.cash)}</p>`,
      buttons:[{t:"Lieber nicht", cls:"sec", fn:done},{t:"Wagen 🎲", cls:"gold", dis:p.cash<WAGNIS_COST, fn:()=>{ const res = go(); modal({title:"Ergebnis", icon:f.i, color:f.c, body:res, buttons:[{t:"Weiter", fn:done}]}); }}]});
  }
  if(t==="stiftung"){
    const amt = p.fast.fc;
    const give = ()=>{ p.cash -= amt; p.charity = 3; log(`🤝 ${nm(p)} gibt ${eur(amt)} an die eigene Stiftung.`); };
    if(p.ai){ if(p.cash >= amt*3) give(); return done(); }
    return modal({title:"Stiftung", icon:f.i, color:f.c, body:`<p>Spende einen Freiheits-Cashflow (<b>${eur(amt)}</b>) an deine Stiftung. Dafür darfst du 3 Züge lang wahlweise mit 2 Würfeln würfeln.</p>`,
      buttons:[{t:"Nein danke", cls:"sec", fn:done},{t:`Spenden (${eur(amt)})`, cls:"gold", dis:p.cash<amt, fn:()=>{ give(); done(); }}]});
  }
}
function enterFast(p){
  const fc = Math.max(1000, netPassive(p))*FAST_MULT;
  if(etfValue(p)>0){ const v = etfValue(p), tax = etfSell(p, v); etfOf(p).withdraw = false; etfOf(p).rate = 0; log(`📈 ${nm(p)} löst das ETF-Depot auf: ${eur(v - tax)} fließen ins Startkapital.`); }
  p.fast = {fc, fcStart:fc, pos:0, invests:[], dreamBought:false};
  p.cash += fc; p.charity = 0; p.skip = 0;
  log(`🚀 ${nm(p)} ist aus dem Hamsterrad ausgebrochen und wechselt auf die Freiheitsbahn (Freiheits-Cashflow ${eur(fc)}).`);
  const d = dreamOf(p);
  if(!p.ai || S.players.every(q=>q.ai)) queueModal({title:"Raus aus dem Hamsterrad!", icon:"🚀", color:"#a87800",
    body:`<p><b>${p.name}</b> ist finanziell frei und wechselt auf die <b>Freiheitsbahn</b>.</p>
      <div class="facts"><span>Freiheits-Cashflow (passiv × ${FAST_MULT})</span><span class="pos">${eur(fc)}</span><span>Startbonus (bar)</span><span>${eur(fc)}</span></div>
      <p><b>Gewinnen</b> kannst du jetzt auf zwei Wegen:<br>🅰 Deinen Traum <b>${d.i} ${d.n}</b> für ${eur(d.cost)} kaufen (auf seinem Feld landen) – oder<br>🅱 deinen Freiheits-Cashflow um <b>${eur(FAST_GOAL)}</b> steigern.</p>`,
    buttons:[{t:"Los geht's", cls:"gold"}]});
  else queueModal({title:"Ausbruch!", icon:"🚀", color:"#a87800", body:`<p>🤖 <b>${p.name}</b> ist aus dem Hamsterrad ausgebrochen und spielt jetzt auf der Freiheitsbahn.</p>`, buttons:[{t:"Weiter"}]});
}

// ---------- Geschäfte ----------
function buyAsset(p,c,long){
  const mortgage = c.price - c.down;
  if(c.expert){
    const cf = exCf(c,long), rate = S.rate + (long?EX.longExtra:0);
    pay(p, c.down + c.nk, c.name);
    st(p).buys.push({r:S.round, name:c.name, eq:c.down+c.nk, cf:exNet(c, cf, taxRate(p))});
    p.assets.push({id:uid(), cat:c.cat, name:c.name, price:c.price, down:c.down, nk:c.nk, mortgage, cf, units:c.units||0,
      rent:c.rent, rate, fixedUntil:S.round + (long?EX.longBind:EX.shortBind)});
    log(`✅ ${nm(p)} kauft ${c.name} für ${eur(c.price)} + ${eur(c.nk)} Nebenkosten (Zins ${pct(rate)}, ${long?"lange":"kurze"} Bindung, Cashflow ${eur(cf)}).`);
    return;
  }
  pay(p, c.down, c.name);
  st(p).buys.push({r:S.round, name:c.name, eq:c.down, cf:c.cf});
  p.assets.push({id:uid(), cat:c.cat, name:c.name, price:c.price, down:c.down, mortgage, cf:c.cf, units:c.units||0});
  log(`✅ ${nm(p)} kauft ${c.name} für ${eur(c.price)} (EK ${eur(c.down)}, Cashflow ${eur(c.cf)}).`);
}
// Experten-Kaufdialog mit Mietrechnung und Wahl der Zinsbindung
function expertDeal(c){
  const p = P(), mort = c.price - c.down, eq = c.down + c.nk, tr = taxRate(p), res = Math.round(c.price*EX.reserve);
  const cfS = exCf(c,false), cfL = exCf(c,true);
  const afa = Math.round(c.price*0.8*0.02/12);
  const net = cf => exNet(c, cf, tr);
  const can = p.cash >= eq, needLoan = can ? 0 : Math.ceil((eq-p.cash)/1000)*1000;
  const ok = cf => can || (cashflow(p) + cf - needLoan/100 >= 0 && p.loan + needLoan <= loanCap(p));
  const row = (l,v,cls="") => `<span>${l}</span><span class="${cls}">${v}</span>`;
  modal({title:c.title, icon:c.cat==="gewerbe"?"🏪":c.cat==="garage"?"🚗":"🏠", color:"#1565c0",
    body:`<p>${c.text}</p>
    <div class="facts">${row("Kaufpreis",eur(c.price))}${row("+ Kaufnebenkosten (10 %)",eur(c.nk))}${row("Anzahlung",eur(c.down))}${row("<b>Eigenkapital gesamt</b>",`<b>${eur(eq)}</b>`)}${row("Darlehen",eur(mort))}</div>
    <div class="facts">${row("Kaltmiete",`+${eur(c.rent)}`,"pos")}${row("Bewirtschaftung (nicht umlagefähig)",`−${eur(c.costs)}`,"neg")}
      ${row(`Zinsen kurz (${pct(S.rate)}, ${EX.shortBind} Runden)`,`−${eur(Math.round(mort*S.rate/12))}`,"neg")}
      ${row(`Zinsen lang (${pct(S.rate+EX.longExtra)}, ${EX.longBind} Runden)`,`−${eur(Math.round(mort*(S.rate+EX.longExtra)/12))}`,"neg")}
      ${row("<b>Cashflow vor Steuern</b>",`<b>${eur(cfS)} / ${eur(cfL)}</b>`)}
      ${row(`– Rücklage (${eur(res)}) und Steuer (${Math.round(tr*100)} % nach ${eur(afa)} Abschreibung)`,"")}${row("<b>Netto pro Monat</b> (kurz / lang)",`<b>${eur(net(cfS))} / ${eur(net(cfL))}</b>`, net(cfL)>=0?"pos":"neg")}
      ${row("Netto-Rendite aufs Eigenkapital",`${(net(cfS)*12/eq*100).toFixed(1).replace(".",",")} % p.a.`)}</div>
    <div class="rc">💡 <b>Realitäts-Check:</b> Die Kaufnebenkosten zahlst du komplett aus eigener Tasche und bekommst sie beim Verkauf nicht zurück. Kurze Zinsbindung ist billiger, aber nach Ablauf gilt der dann aktuelle Marktzins – lange Bindung kostet mehr, schützt aber vor Zinsanstiegen.${c.risk?" Gewerbe kann scheitern: dann droht Totalverlust.":""}</div>
    ${coachDeal(p,c)}
    <p class="hint">Dein Bargeld: ${eur(p.cash)}${!can?` – fehlende ${eur(needLoan)} müsstest du per Bankkredit (1 %/Monat) finanzieren.`:""}</p>`,
    buttons:[{t:"Ablehnen", cls:"sec", fn:done},
      ...(auctionBidders(p).length ? [{t:"Versteigern 🔨", cls:"sec", fn:()=>startAuction(c,p)}] : []),
      {t:`Kaufen · kurz ${pct(S.rate)}`, dis:!ok(cfS), fn:()=>{ buyAsset(p,c,false); done(); }},
      {t:`Kaufen · lang ${pct(S.rate+EX.longExtra)}`, cls:"gold", dis:!ok(cfL), fn:()=>{ buyAsset(p,c,true); done(); }}]});
}
function toggleInsure(){
  const p = P(); p.insured = !p.insured;
  log(p.insured ? `🛡️ ${nm(p)} schließt eine Versicherung gegen Mietausfall und Großschäden ab.` : `🛡️ ${nm(p)} kündigt die Versicherung.`);
  checkAll(); render();
}
function doBuyStock(p,t,price,q){
  p.cash -= q*price;
  const s = p.stocks[t] || (p.stocks[t]={qty:0,cost:0}); s.qty+=q; s.cost+=q*price;
  log(`📊 ${nm(p)} kauft ${q.toLocaleString("de-DE")} × ${t} zu ${eur(price)}.`);
}
function doSellStock(q,t,price){
  const s = q.stocks[t]; if(!s) return;
  const g = s.qty*price - s.cost;
  st(q).stockGain += g;
  q.cash += s.qty*price; delete q.stocks[t];
  log(`📊 ${nm(q)} verkauft ${s.qty.toLocaleString("de-DE")} × ${t} zu ${eur(price)} (${g>=0?"Gewinn":"Verlust"} ${eur(Math.abs(g))}).`);
  if(XP() && g>0){ const tax = Math.round(g*EX.stockTax); q.cash -= tax; log(`🧾 ${nm(q)} zahlt ${eur(tax)} Abgeltungsteuer (25 %) auf den Kursgewinn.`); }
}
function showDeal(c){
  const p = P(); curCard = c;
  if(c.kind==="aktie") return stockCard(c, true);
  if(p.ai){
    if(c.expert){ const long = aiExpertChoice(p,c); if(long!==null){ buyAsset(p,c,long); return done(); } log(`${nm(p)} lehnt ab: ${c.name} (${eur(c.price)}) – rechnet sich nach Steuern und Nebenkosten nicht.`); }
    else if(aiWantsAsset(p,c)){ buyAsset(p,c); return done(); } else log(`${nm(p)} lehnt ab: ${c.name} (${eur(c.price)}, Cashflow ${eur(c.cf)}).`);
    if(c.cat!=="anleihe" && auctionBidders(p).length) return startAuction(c, p);   // abgelehnte Geschäfte werden versteigert
    return done();
  }
  if(c.expert) return expertDeal(c);
  const mortgage = c.price - c.down, can = p.cash >= c.down;
  const needLoan = can ? 0 : Math.ceil((c.down-p.cash)/1000)*1000;
  const loanOk = can || (cashflow(p) + c.cf - needLoan/100 >= 0 && p.loan + needLoan <= loanCap(p));
  modal({title:c.title, icon:c.cat==="haus"||c.cat==="wohnung"?"🏠":c.cat==="anleihe"?"📜":c.cat==="garage"?"🚗":"🏪", color:"#1565c0",
    body:`<p>${c.text}</p><div class="facts"><span>Kaufpreis</span><span>${eur(c.price)}</span><span>Eigenkapital</span><span>${eur(c.down)}</span>${mortgage?`<span>Darlehen</span><span>${eur(mortgage)}</span>`:""}<span>Cashflow (nach Zins & Tilgung)</span><span class="${c.cf>=0?"pos":"neg"}">${eur(c.cf)}/Monat</span><span>Rendite aufs Eigenkapital</span><span>${(c.cf*12/c.down*100).toFixed(1).replace(".",",")} % p.a.</span></div>
    ${XP()&&c.risk?`<div class="rc">💡 <b>Realitäts-Check:</b> Kleinunternehmen kosten Zeit und können scheitern – dann ist das eingesetzte Geld komplett weg. Erträge werden zudem versteuert.</div>`:""}
    ${coachDeal(p,c)}
    <p class="hint">Dein Bargeld: ${eur(p.cash)}${!can ? (loanOk ? ` – fehlende ${eur(needLoan)} per Bankkredit (${eur(needLoan/100)}/Monat) finanzierbar.` : ` – die Bank finanziert die fehlenden ${eur(needLoan)} nicht (Cashflow würde negativ oder Kreditrahmen ${eur(loanCap(p))} überschritten).`) : ""}</p>`,
    buttons:[{t:"Ablehnen", cls:"sec", fn:done},
      ...(c.cat!=="anleihe" && auctionBidders(p).length ? [{t:"Versteigern 🔨", fn:()=>startAuction(c,p)}] : []),
      {t: can?"Kaufen":"Mit Kredit kaufen", cls:"gold", dis:!loanOk, fn:()=>{ buyAsset(p,c); done(); }}]});
}
// Aktienkarte: Computer entscheiden sofort, Menschen bekommen einen Dialog
function stockCard(c, first){
  const p = P();
  if(first){
    S.players.forEach(q=>{ const s=q.stocks[c.ticker];
      if(q.ai && !q.bankrupt && s && (c.price>=30 || (c.price>=15 && c.price >= 2*s.cost/s.qty))) doSellStock(q,c.ticker,c.price); });
    if(p.ai && c.price<=10 && p.cash>=2000){ const q = Math.floor(p.cash*0.4/c.price/100)*100; if(q>0) doBuyStock(p,c.ticker,c.price,q); }
  }
  const holders = S.players.filter(q=>!q.ai && !q.bankrupt && q.stocks[c.ticker]);
  if(p.ai && !holders.length) return done();
  const sellHtml = holders.map(q=>{ const s=q.stocks[c.ticker]; return `<div class="sellrow"><span>${q.name}: ${s.qty.toLocaleString("de-DE")} Stück (Ø ${eur(s.cost/s.qty)})</span><button class="sm red" onclick="sellStock(${S.players.indexOf(q)})">Alle verkaufen: ${eur(s.qty*c.price)}</button></div>`; }).join("");
  const maxQ = Math.floor(p.cash/c.price);
  modal({title:c.title, icon:"📊", color:"#1565c0",
    body:`<p>${c.text}</p><div class="facts"><span>Aktueller Kurs</span><span>${eur(c.price)}</span>${p.ai?"":`<span>Dein Bargeld</span><span>${eur(p.cash)}</span><span>Maximal kaufbar</span><span>${maxQ.toLocaleString("de-DE")} Stück</span>`}</div>
    ${p.ai?`<p class="hint">🤖 ${p.name} hat diese Karte gezogen – du darfst zu diesem Kurs verkaufen.</p>`:`<div class="row"><input type="number" id="qty" min="1" step="100" value="${Math.min(maxQ, 100)}" style="width:130px"> Stück <button class="sm" onclick="buyStock()">Kaufen</button></div>`}
    ${sellHtml?`<h3>Zum aktuellen Kurs verkaufen</h3>${sellHtml}`:""}<p class="hint" id="stockMsg" style="margin-top:8px"></p>
    ${p.ai?"":coachStock(p,c)}`,
    buttons:[{t:"Fertig", fn:done}]});
}
function buyStock(){
  const p = P(), c = curCard, q = Math.floor(+$("#qty").value||0);
  if(q<=0) return;
  if(q*c.price > p.cash){ $("#stockMsg").textContent = "Nicht genug Bargeld."; return; }
  doBuyStock(p,c.ticker,c.price,q); closeModal(); done();
}
function sellStock(pi){
  doSellStock(S.players[pi], curCard.ticker, curCard.price);
  renderSheet(); save(); stockCard(curCard, false);
}

// ---------- Markt ----------
function applyEvent(c,p){
  if(c.ev==="miete"){ S.players.forEach(q=>q.assets.forEach(a=>{ if(a.cat==="wohnung") a.cf+=50; })); log("📈 Mietspiegel steigt: Eigentumswohnungen +50 €/Monat."); }
  if(c.ev==="heizung"){ if(p.assets.some(a=>a.cat==="haus")){ pay(p,2500,"Heizungsschaden"); log(`🔧 ${nm(p)} zahlt 2.500 € für die Heizung.`); } else c.text += " – Du besitzt keins, Glück gehabt!"; }
  if(c.ev==="split"){ S.players.forEach(q=>{ if(q.stocks[c.ticker]){ q.stocks[c.ticker].qty*=2; } }); log(`📈 Aktiensplit ${c.ticker} 2:1.`); }
  if(c.ev==="etf"){ const e = etfS(); e.price = Math.max(5, e.price*(1+c.d)); e.hist.push(+e.price.toFixed(2));
    log(`📈 ${c.title}: ETF-Kurs jetzt ${e.price.toFixed(2).replace(".",",")} (${c.d>0?"+":""}${Math.round(c.d*100)} %).`);
    const mine = !p.ai && etfValue(p)>0 ? ` Dein Depot ist jetzt ${eur(etfValue(p))} wert.` : "";
    c.text += mine; }
  if(c.ev==="zins"){
    const old = S.rate; S.rate = Math.min(EX.rateMax, Math.max(EX.rateMin, Math.round((S.rate+c.d)*10000)/10000));
    c.text += ` Marktzins jetzt: <b>${pct(S.rate)}</b> (vorher ${pct(old)}).`;
    log(`🏦 Marktzins ${c.d>0?"steigt":"sinkt"} auf ${pct(S.rate)}.`);
  }
  if(c.ev==="miete3"){ S.players.forEach(q=>q.assets.forEach(a=>{ if(a.rent){ const d = Math.round(a.rent*0.03); a.rent += d; a.cf += d; } })); log("📈 Mietspiegel steigt: alle Mieten +3 %."); }
  if(c.ev==="insolvenz"){
    const hit = S.players.filter(q=>q.stocks[c.ticker]);
    hit.forEach(q=>{ log(`💥 ${nm(q)} verliert ${q.stocks[c.ticker].qty.toLocaleString("de-DE")} Aktien ${c.ticker} (${eur(q.stocks[c.ticker].cost)} Einsatz).`); delete q.stocks[c.ticker]; });
    if(!hit.length) c.text += " Zum Glück hält niemand diese Aktie.";
  }
}
function doSellAsset(q,a,o){
  const net = o - a.mortgage;
  st(q).sells.push({r:S.round, name:a.name, gain: net - ((a.down||(a.price-a.mortgage)) + (a.nk||0))});
  q.cash += net; q.assets = q.assets.filter(x=>x!==a);
  log(`💰 ${nm(q)} verkauft ${a.name} für ${eur(o)} (netto ${eur(net)}).`);
}
function showMarket(c, again){
  const p = P(), f = FT.markt; curCard = c;
  if(c.kind==="event"){
    applyEvent(c,p);
    return info(p, f, c.title, `<p>${c.text}</p>`);
  }
  if(!again){ // Computer entscheiden selbst
    S.players.forEach(q=>{ if(!q.ai || q.bankrupt) return;
      q.assets.filter(a=>a.cat===c.cat).forEach(a=>{ const o=c.offer(a), base=Math.max(1000, (a.down||(a.price-a.mortgage)) + (a.nk||0)); if(o-a.mortgage >= base*(XP()?1.6:2.5)) doSellAsset(q,a,o); }); });
  }
  const rows = [];
  S.players.forEach((q,qi)=>{ if(q.ai || q.bankrupt) return; q.assets.forEach(a=>{ if(a.cat===c.cat){
    const o = c.offer(a), net = o - a.mortgage;
    rows.push(`<div class="sellrow"><span><b>${q.name}</b>: ${a.name}<br><span class="hint">Kauf ${eur(a.price)} · Darlehen ${eur(a.mortgage)} · CF ${eur(a.cf)}</span></span><button class="sm red" onclick="sellAsset(${qi},'${a.id}')">Verkaufen<br>netto ${eur(net)}</button></div>`);
  }}); });
  if(p.ai && !rows.length) return done();
  modal({title:c.title, icon:f.i, color:f.c, body:`<p>${c.text}</p>${p.ai?`<p class="hint">🤖 ${p.name} hat diese Karte gezogen.</p>`:""}${rows.length?rows.join(""):'<p class="hint">Niemand besitzt einen passenden Vermögenswert.</p>'}${coachMarket(p,c)}`, buttons:[{t:"Fertig", fn:done}]});
}
function sellAsset(qi, id){
  const q = S.players[qi], a = q.assets.find(x=>x.id===id), c = curCard; if(!a||!c) return;
  doSellAsset(q,a,c.offer(a));
  renderSheet(); save(); showMarket(c, true);
}

// ---------- Auktion: abgelehnte Geschäfte versteigern ----------
const eligible = (q, seller) => q!==seller && !q.bankrupt && !q.fast && !q.free;
const dealEq = c => c.expert ? c.down + c.nk : c.down;
function auctionBidders(seller){ return S.players.filter(q=>eligible(q,seller)); }
function aiBid(q, c){
  const eq = dealEq(c); if(q.cash < eq + 100) return 0;
  const want = c.expert ? aiExpertChoice(q,c)!==null : aiWantsAsset(q,c);
  if(!want) return 0;
  const v = c.expert ? exNet(c, exCf(c, S.rate<0.045), taxRate(q)) : c.cf;
  return Math.max(0, Math.floor(Math.min(q.cash - eq, v*6)/100)*100);
}
function startAuction(c, seller){
  const eq = dealEq(c), bidders = auctionBidders(seller);
  const bids = bidders.filter(q=>q.ai).map(q=>({q, bid:aiBid(q,c)})).filter(b=>b.bid>0);
  const worth = c.expert ? exCf(c,false)>0 : c.cf>0;   // nur lohnende Geschäfte Menschen anbieten
  const humans = (worth || !seller.ai) ? bidders.filter(q=>!q.ai && q.cash >= eq + 100) : [];
  if(!humans.length) return resolveAuction(c, seller, bids);
  modal({title:"Auktion: "+c.title, icon:"🔨", color:"#6a1b9a",
    body:`<p><b>${nm(seller)}</b> versteigert dieses Geschäft. Wer am meisten bietet, übernimmt es zu den Kartenbedingungen und zahlt sein Gebot als Aufgeld an ${seller.name}.</p>
      <div class="facts"><span>Kaufpreis</span><span>${eur(c.price)}</span><span>Eigenkapital nötig</span><span>${eur(eq)}</span><span>Cashflow</span><span>${c.expert?`${eur(exCf(c,S.rate<0.045))} vor Steuern`:eur(c.cf)}/Monat</span></div>
      ${bids.length?`<p class="hint">🤖 Computer haben bereits verdeckt geboten.</p>`:""}
      ${humans.map(q=>`<div class="bidrow"><span>${q.name}<br><span class="hint">max. ${eur(q.cash-eq)}</span></span><input type="number" min="0" step="100" value="0" data-pi="${S.players.indexOf(q)}" class="bid"></div>`).join("")}
      <p class="hint">0 = kein Gebot. Tipp: Das Gebot sollte sich durch den Cashflow in wenigen Monaten zurückzahlen.${c.expert?" Zinsbindung wird automatisch nach Marktzins gewählt.":""}</p>`,
    buttons:[{t:"Auktion auswerten 🔨", cls:"gold",
      read:()=>[...document.querySelectorAll("input.bid")].map(i=>({q:S.players[+i.dataset.pi], bid:Math.max(0,Math.floor((+i.value||0)/100)*100)})),
      fn:hb=>resolveAuction(c, seller, bids.concat(hb.filter(b=>b.bid>0)))}]});
}
function resolveAuction(c, seller, bids){
  const eq = dealEq(c);
  const valid = bids.filter(b=>b.q.cash >= eq + b.bid).sort((a,b)=>b.bid-a.bid);
  const humanSeen = !seller.ai || bids.some(b=>!b.q.ai) || auctionBidders(seller).some(q=>!q.ai);
  if(!valid.length){
    log(`🔨 Für ${c.name} bietet niemand.`);
    if(!seller.ai) return modal({title:"Keine Gebote", icon:"🔨", color:"#6a1b9a", body:`<p>Niemand wollte ${c.name} haben.</p>`, buttons:[{t:"Weiter", fn:done}]});
    return done();
  }
  const w = valid[0];
  w.q.cash -= w.bid; seller.cash += w.bid;
  buyAsset(w.q, c, S.rate<0.045);
  log(`🔨 ${nm(w.q)} ersteigert ${c.name} und zahlt ${eur(w.bid)} Aufgeld an ${seller.name}.`);
  if(humanSeen) return modal({title:"Zuschlag!", icon:"🔨", color:"#6a1b9a",
    body:`<p><b>${nm(w.q)}</b> bekommt den Zuschlag für <b>${c.name}</b> mit einem Gebot von <b>${eur(w.bid)}</b>.</p>${valid.length>1?`<p class="hint">Zweithöchstes Gebot: ${eur(valid[1].bid)} (${valid[1].q.name})</p>`:""}`,
    buttons:[{t:"Weiter", fn:done}]});
  done();
}

// ---------- Handel zwischen Spielern ----------
function tradePartners(p){ return S.players.filter(q=>eligible(q,p) && (p.assets.length || q.assets.length)); }
const tradeEq = a => (a.down||(a.price-a.mortgage)) + (a.nk||0);
const aiValue = a => a.cf>0 ? a.cf*12/(XP()?0.06:0.15) : 0;
function openTrade(){
  const p = P(), partners = tradePartners(p); if(!partners.length) return;
  modal({title:"Handel mit Mitspielern", icon:"🤝", color:"#00838f",
    body:`<div class="trade">
      <label>Handelspartner</label>
      <select id="trP">${partners.map(q=>`<option value="${S.players.indexOf(q)}">${nm(q)}</option>`).join("")}</select>
      <label>Was soll den Besitzer wechseln?</label>
      <select id="trA"></select>
      <label>Barpreis (der Käufer übernimmt zusätzlich das Darlehen)</label>
      <input type="number" id="trPr" min="0" step="500" value="0">
      <p class="hint" id="trInfo" style="margin-top:8px"></p></div>
      ${coachBox("Ein fairer Preis orientiert sich am Cashflow: Der Käufer will sein Geld in wenigen Jahren zurück, der Verkäufer mehr als seinen Einsatz.")}`,
    buttons:[{t:"Abbrechen", cls:"sec"},
      {t:"Angebot machen", cls:"gold", read:()=>({pi:+$("#trP").value, a:$("#trA").value, price:Math.max(0,Math.round(+$("#trPr").value||0))}),
       check:v=>!!v.a, fn:v=>proposeTrade(p, S.players[v.pi], v.a, v.price)}]});
  const fill = ()=>{
    const q = S.players[+$("#trP").value];
    const opt = (pre, a) => `<option value="${pre}:${a.id}">${pre==="S"?"Verkaufen":"Kaufen"}: ${a.name} · CF ${eur(a.cf)}${a.mortgage?` · Darlehen ${eur(a.mortgage)}`:""}</option>`;
    $("#trA").innerHTML = (p.assets.length?`<optgroup label="Von dir an ${q.name}">${p.assets.map(a=>opt("S",a)).join("")}</optgroup>`:"")
      + (q.assets.length?`<optgroup label="Von ${q.name} an dich">${q.assets.map(a=>opt("B",a)).join("")}</optgroup>`:"");
    hint();
  };
  const hint = ()=>{
    const q = S.players[+$("#trP").value], [k,id] = ($("#trA").value||":").split(":");
    const a = (k==="S"?p:q).assets.find(x=>x.id===id); if(!a){ $("#trInfo").textContent = "Keine Vermögenswerte zum Handeln."; return; }
    $("#trInfo").innerHTML = `Ursprünglicher Einsatz: <b>${eur(tradeEq(a))}</b> · Cashflow ${eur(a.cf)}/Monat${a.cf>0?` · Richtwert nach Rendite: ca. <b>${eur(Math.round(aiValue(a)/500)*500)}</b>`:""}`;
  };
  $("#trP").onchange = fill; $("#trA").onchange = hint; fill();
}
function proposeTrade(p, q, key, price){
  const [k,id] = key.split(":"), seller = k==="S"?p:q, buyer = k==="S"?q:p, a = seller.assets.find(x=>x.id===id);
  if(!a) return;
  if(buyer.cash < price) return modal({title:"Nicht genug Geld", icon:"🤝", body:`<p>${buyer.name} hat nur ${eur(buyer.cash)} bar – Handel ist nur mit Bargeld möglich.</p>`, buttons:[{t:"OK"}]});
  const desc = `<b>${a.name}</b> (Cashflow ${eur(a.cf)}/Monat${a.mortgage?`, Darlehen ${eur(a.mortgage)} wird übernommen`:""}) geht von <b>${seller.name}</b> an <b>${buyer.name}</b> für <b>${eur(price)}</b>.`;
  if(q.ai){
    const v = aiValue(a);
    const ok = q===buyer ? (a.cf>0 && price <= v*0.9 && q.cash >= price + 1000)
                         : (price >= Math.max(v*1.1, tradeEq(a)*1.3, 1000));
    if(ok){ doTrade(seller, buyer, a, price); return modal({title:"Angebot angenommen", icon:"🤝", color:"#00838f", body:`<p>🤖 ${q.name} nimmt an: ${desc}</p>`, buttons:[{t:"Prima"}]}); }
    const target = q===buyer ? `bis etwa ${eur(Math.floor(Math.min(v*0.9, q.cash-1000)/500)*500)}` : `ab etwa ${eur(Math.ceil(Math.max(v*1.1, tradeEq(a)*1.3, 1000)/500)*500)}`;
    log(`🤝 ${nm(q)} lehnt ein Angebot für ${a.name} ab.`);
    return modal({title:"Angebot abgelehnt", icon:"🤝", color:"#00838f", body:`<p>🤖 ${q.name} lehnt ab.</p><p class="hint">Der Computer würde ${q===buyer?"kaufen":"verkaufen"} ${target}.</p>`, buttons:[{t:"OK"}]});
  }
  modal({title:`${q.name}, nimmst du an?`, icon:"🤝", color:"#00838f",
    body:`<p>Angebot von <b>${p.name}</b>:</p><p>${desc}</p><p class="hint">Bitte das Gerät an ${q.name} weitergeben.</p>`,
    buttons:[{t:"Ablehnen", cls:"sec", fn:()=>log(`🤝 ${nm(q)} lehnt ein Angebot für ${a.name} ab.`)},
      {t:"Annehmen", cls:"gold", fn:()=>{ if(buyer.cash<price) return; doTrade(seller, buyer, a, price); }}]});
}
function doTrade(seller, buyer, a, price){
  buyer.cash -= price; seller.cash += price;
  seller.assets = seller.assets.filter(x=>x!==a); buyer.assets.push(a);
  st(seller).sells.push({r:S.round, name:a.name, gain:price - tradeEq(a)});
  st(buyer).buys.push({r:S.round, name:a.name, eq:price, cf:a.cf});
  a.down = price; a.nk = 0;   // neuer Einsatz des Käufers
  log(`🤝 ${nm(seller)} verkauft ${a.name} für ${eur(price)} an ${nm(buyer)}${a.mortgage?` (Darlehen ${eur(a.mortgage)} übernommen)`:""}.`);
  checkAll(); render();
}

// ---------- Finanzen ----------
function borrow(){
  const p = P();
  if(cashflow(p) - 10 < 0 || p.loan + 1000 > loanCap(p)){ modal({title:"Kein Kredit", body:`<p>Die Bank verleiht nur, wenn dein Cashflow danach positiv bleibt und dein Kreditrahmen (10 × Monatsgehalt = ${eur(loanCap(p))}) nicht überschritten wird.</p>`, buttons:[{t:"OK"}]}); return; }
  p.loan += 1000; p.cash += 1000; log(`🏦 ${nm(p)} nimmt 1.000 € Kredit auf.`); render();
}
function repay(){ const p = P(); if(p.cash<1000||p.loan<1000) return; p.loan-=1000; p.cash-=1000; log(`🏦 ${nm(p)} tilgt 1.000 € Kredit.`); checkAll(); render(); }
function doPayDebt(p,k){
  const d = p.debts[k]; if(p.cash<d.debt) return;
  p.cash -= d.debt; log(`✂️ ${nm(p)} tilgt ${k==="wohnen"?"die Hypothek":k==="auto"?"den Autokredit":k==="karte"?"die Kreditkarte":"den Studienkredit"} (${eur(d.debt)}) – ${eur(d.pay)} weniger Ausgaben.`);
  d.debt=0; d.pay=0;
}
function payDebt(k){ doPayDebt(P(),k); checkAll(); render(); }

// ---------- Sieg / Ende ----------
function finish(p, how){
  p.free = true; p.how = how; p.wonRound = S.round; S.winners = S.winners||[]; S.winners.push(p.name);
  log(`🏆 ${nm(p)} gewinnt (${how}) – Platz ${S.winners.length} in Runde ${S.round}!`);
  queueModal({title:S.winners.length===1?"Sieg!":"Ziel erreicht!", icon:"🏆", color:"#d9a62e",
    body:`<p><b>${nm(p)}</b> hat es geschafft: <b>${how}</b>.</p><p>Platz <b>${S.winners.length}</b> in Runde ${S.round}.</p>`,
    buttons:[{t:"Weiter", cls:"gold"}]});
}
function checkAll(){
  S.players.forEach(p=>{
    if(p.free||p.bankrupt) return;
    if(!p.fast){
      const pas = passive(p);
      if(pas>0 && pas >= expenses(p)*S.goal){
        if(S.mode===2) enterFast(p);
        else finish(p, "raus aus dem Hamsterrad");
      }
    } else if(p.fast.dreamBought) finish(p, `Traum erfüllt: ${dreamOf(p).i} ${dreamOf(p).n}`);
    else if(p.fast.fc - p.fast.fcStart >= FAST_GOAL) finish(p, `Freiheits-Cashflow +${eur(FAST_GOAL)}`);
  });
  const active = S.players.filter(p=>!p.free&&!p.bankrupt);
  const humans = S.players.filter(p=>!p.ai);
  if(!S.over && (!active.length || (humans.length && !active.some(p=>!p.ai)))){
    S.over = true; clearTimeout(aiTimer);
    log("🏁 Spiel beendet.");
    queueModal(resultsModal());
  }
}
function score(p){
  if(p.bankrupt) return -1;
  if(p.fast) return 1000 + (p.fast.fc - p.fast.fcStart)/FAST_GOAL + p.cash/dreamOf(p).cost;
  return passive(p)/Math.max(1,expenses(p)*S.goal);
}
function resultsModal(){
  const done_ = (S.winners||[]).map(n=>S.players.find(p=>p.name===n));
  const rest = S.players.filter(p=>!done_.includes(p)).sort((a,b)=>score(b)-score(a));
  const rows = done_.concat(rest).map((p,i)=>{
    let res;
    if(p.free) res = `🏆 ${p.how} (Runde ${p.wonRound})`;
    else if(p.bankrupt) res = "✖ insolvent";
    else if(p.fast) res = `🌟 Freiheitsbahn: ${eur(p.cash)} bar, Cashflow ${eur(p.fast.fc)}`;
    else res = `Hamsterrad: ${Math.round(score(p)*100)} % des Ausbruch-Ziels`;
    return `<tr><td><b>${i+1}.</b></td><td><span class="tok" style="display:inline-block;background:${p.color};vertical-align:-2px"></span> ${nm(p)}</td><td>${res}</td></tr>`;
  }).join("");
  const reviews = S.players.filter(p=>!p.ai).map(reviewHTML).join("");
  return {title:"Endergebnis", icon:"🏁", color:"#0f3d2e",
    body:`<table class="results">${rows}</table><p class="hint" style="margin-top:10px">Gespielt: ${S.round} Runden.</p>${reviews?`<h3>📊 Rückblick</h3>${reviews}`:""}`,
    buttons:[{t:"Schließen", cls:"sec"},{t:"Neues Spiel", cls:"gold", fn:resetGame}]};
}
// Persönlicher Rückblick: beste/schlechteste Entscheidungen und Lektionen
function reviewHTML(p){
  const s = st(p), roe = b => b.eq>0 ? b.cf*12/b.eq : 0;
  const buys = s.buys.filter(b=>b.eq>0), best = buys.reduce((a,b)=>!a||roe(b)>roe(a)?b:a, null), worst = buys.reduce((a,b)=>!a||roe(b)<roe(a)?b:a, null);
  const bestSell = s.sells.reduce((a,b)=>!a||b.gain>a.gain?b:a, null);
  const facts = [];
  facts.push(["Käufe / Verkäufe", `${s.buys.length} / ${s.sells.length}`]);
  if(best) facts.push(["Beste Investition", `${best.name} (Runde ${best.r}): ${pctN(roe(best))} p.a.`]);
  if(worst && worst!==best) facts.push(["Schwächste Investition", `${worst.name} (Runde ${worst.r}): ${pctN(roe(worst))} p.a.`]);
  if(bestSell) facts.push(["Bester Verkauf", `${bestSell.name}: ${bestSell.gain>=0?"+":""}${eur(bestSell.gain)} Gewinn`]);
  if(s.stockGain) facts.push(["Aktien Gewinn/Verlust", `${s.stockGain>=0?"+":""}${eur(s.stockGain)}`]);
  const ev = etfValue(p), ei = Math.round(etfOf(p).invested);
  if(ei>0 || s.etfGain) facts.push(["ETF-Depot", `${eur(ev)} Wert bei ${eur(ei)} eingezahlt${s.etfGain?` · realisiert ${s.etfGain>=0?"+":""}${eur(Math.round(s.etfGain))}`:""}`]);
  facts.push(["Konsum-Ausgaben", eur(s.konsum)]);
  facts.push(["Bankzinsen gezahlt", eur(s.interest)]);
  if(s.charity) facts.push(["Gespendet", eur(s.charity)]);
  const lessons = [];
  if(s.konsum > 5000) lessons.push(`Konsum hat dich <b>${eur(s.konsum)}</b> gekostet – Geld, das als Eigenkapital hätte arbeiten können.`);
  if(s.interest > 3000) lessons.push(`Du hast <b>${eur(s.interest)}</b> Bankzinsen gezahlt. Teure Kredite schnell tilgen lohnt sich.`);
  if(worst && roe(worst) < 0.05 && worst!==best) lessons.push(`„${worst.name}“ hat sich kaum gelohnt – vor dem Kauf immer die Rendite aufs Eigenkapital prüfen.`);
  if(s.sells.some(x=>x.gain>0)) lessons.push(`Gute Verkäufe zur richtigen Zeit setzen Kapital für größere Geschäfte frei.`);
  if(ei>0 && ev>ei) lessons.push(`Dein ETF-Sparplan hat aus ${eur(ei)} ${eur(ev)} gemacht – Zeit im Markt und regelmäßiges Sparen wirken auch ohne Glück.`);
  if(ei>0 && ev<ei) lessons.push(`Dein ETF lag am Ende im Minus – kurzfristig schwanken Börsen stark. ETFs brauchen viele Jahre Geduld.`);
  if(p.bankrupt) lessons.push(`Die Insolvenz kam durch negativen Cashflow – immer zuerst prüfen: Bringt es jeden Monat Geld oder kostet es Geld?`);
  if(!lessons.length) lessons.push(`Solide gespielt – Cashflow vor Konsum, und die Zahlen im Blick behalten.`);
  return `<details class="review" open><summary><span class="tok" style="display:inline-block;background:${p.color};vertical-align:-2px"></span> ${p.name} – ${PROFS[p.prof].n}</summary>
    ${chartSVG(p.hist)}
    <div class="facts">${facts.map(f=>`<span>${f[0]}</span><span>${f[1]}</span>`).join("")}</div>
    <ul class="rep">${lessons.map(l=>`<li>${l}</li>`).join("")}</ul></details>`;
}
function showResults(){ modal(resultsModal()); }
function endTurn(){
  if(S.over){ render(); return; }
  const n = S.players.length;
  let i = S.cur;
  for(let guard=0; guard<n*4; guard++){
    i = (i+1)%n; if(i===0){ S.round++; etfTick(); recordHist(); if(XP() && S.round % EX.inflEvery === 0) inflation(); }
    const q = S.players[i];
    if(q.free||q.bankrupt) continue;
    if(q.skip>0){ q.skip--; log(`⏸️ ${nm(q)} setzt aus (noch ${q.skip}).`); continue; }
    break;
  }
  S.cur = i; S.phase="roll"; view = i; S.dice=[0];
  if(!S.players[i].ai) setView("board");
  render();
}

// ---------- Regeln ----------
function rules(){
  modal({title:"Spielregeln", icon:"📖", body:`
  <p><b>Ziel:</b> Baue passives Einkommen auf (Immobilien, Unternehmen, Anleihen), bis es deine monatlichen Ausgaben deckt – dann bist du raus aus dem Hamsterrad. Im Modus <b>Komplett</b> geht es danach auf der <b>Freiheitsbahn</b> weiter.</p>
  <h3>Phase 1 – Hamsterrad</h3>
  <p><b>Zug:</b> Würfeln, Feld abhandeln, Zug beenden. Über ein 💶 <b>Zahltag</b>-Feld zu ziehen oder darauf zu landen bringt deinen monatlichen Cashflow.</p>
  <p>💡 <b>Gelegenheit:</b> Kleines oder großes Geschäft. Immobilien werden mit Eigenkapital + Darlehen gekauft; der angezeigte Cashflow ist bereits nach Darlehensrate. Aktien bringen keinen Cashflow – Gewinn nur durch Verkauf, wenn eine Karte einen besseren Kurs zeigt (alle dürfen dann verkaufen).</p>
  <p>📈 <b>Markt:</b> Käufer machen Angebote, jede Person mit passendem Objekt darf verkaufen – das Darlehen wird vom Erlös abgezogen. Außerdem Ereignisse wie Mietsteigerungen oder Aktiensplits.</p>
  <p>🛍️ <b>Konsum</b> kostet Geld, 👶 <b>Nachwuchs</b> erhöht die Ausgaben, 🤝 <b>Spende</b> erlaubt 3 Züge lang 2 Würfel, 📦 <b>Kündigung</b> kostet eine Monatsausgabe und 2 Runden Aussetzen.</p>
  <p>🏦 <b>Kredit:</b> 1.000-€-Schritte, 1 % Zinsen pro Monat. Freiwillig nur bei positivem Cashflow und bis max. 10 × Monatsgehalt. Konsumschulden lassen sich jederzeit komplett tilgen.</p>
  <p>✖ <b>Insolvenz:</b> Kannst du einen negativen Zahltag nicht bezahlen, wird dein Vermögen zum halben Wert verkauft. Reicht das nicht, scheidest du aus.</p>
  <h3>Phase 2 – Freiheitsbahn</h3>
  <p>Du startest mit einem <b>Freiheits-Cashflow</b> von passivem Einkommen × ${FAST_MULT} und bekommst ihn einmal sofort als Startbonus. Kein Gehalt, keine Ausgaben mehr.</p>
  <p>🏗️ <b>Investition:</b> Großprojekte gegen Bargeld, die deinen Freiheits-Cashflow erhöhen. 💰 <b>Geldfluss-Tag:</b> Freiheits-Cashflow kassieren. ⚡ <b>Risiko:</b> Klagen, Steuernachzahlungen oder Crashs kosten Geld oder Investitionen. 🎯 <b>Wagnis:</b> ${eur(WAGNIS_COST)} einsetzen, bei 5–6 gibt es ${eur(WAGNIS_WIN)}. 🤝 <b>Stiftung:</b> spenden für 3 Züge mit 2 Würfeln.</p>
  <p>🏆 <b>Sieg:</b> Lande auf deinem 🌟 <b>Traumfeld</b> und kaufe deinen Traum – oder steigere deinen Freiheits-Cashflow um ${eur(FAST_GOAL)}.</p>
  <h3>🎓 Experten-Modus</h3>
  <p>Für Fortgeschrittene – näher an der Realität:</p>
  <p>🏠 <b>Kaufnebenkosten:</b> +10 % auf den Kaufpreis (Grunderwerbsteuer, Notar, Makler), komplett aus Eigenkapital. <b>Mietmodell:</b> Kaltmiete − Bewirtschaftung − Zinsen = Cashflow; realistische Renditen.</p>
  <p>🧾 <b>Steuern:</b> auf Erträge aus Vermietung und Unternehmen (25–42 % je nach Beruf), 25 % Abgeltungsteuer auf Aktiengewinne.</p>
  <p>🔧 <b>Instandhaltung:</b> Pflicht-Rücklage pro Objekt; Reparaturen werden zuerst aus der Rücklage bezahlt. 🏚️ <b>Leerstand</b> kostet Miete.</p>
  <p>🛡️ <b>Versicherung</b> (im Finanzbogen): Prämie nach Immobilienwert, übernimmt Mietausfall und Großschäden.</p>
  <p>🏦 <b>Zinsbindung:</b> Beim Kauf kurz (${EX.shortBind} Runden, Marktzins) oder lang (${EX.longBind} Runden, +0,5 %). Danach gilt der aktuelle Marktzins – und der ändert sich durch Zinswenden auf dem Markt.</p>
  <p>📉 <b>Inflation:</b> Alle ${EX.inflEvery} Runden steigen Lebenshaltungskosten (+2,5 %) stärker als Gehälter (+2 %); Mieten +2 %.</p>
  <p>💥 <b>Totalverluste:</b> Unternehmen können scheitern, Aktien durch Insolvenz wertlos werden.</p>
  <p>Ausbruch: Das passive Einkommen muss die Ausgaben <b>inklusive</b> Steuern, Rücklage und Versicherung decken.</p>
  <h3>📈 ETF-Sparplan</h3>
  <p>Im Finanzbogen kannst du in einen breit gestreuten <b>Welt-ETF</b> investieren: per <b>Sparrate</b> an jedem Zahltag oder als Einmalkauf. Der Kurs steigt im Schnitt um rund 7 % pro Spieljahr (≈ 20 Runden), schwankt aber deutlich; Börsencrashs und Rallys kommen über das Markt-Feld. ETFs bringen keinen laufenden Cashflow – mit dem <b>4-%-Entnahmeplan</b> entnimmst du jedes Jahr 4 % des Depotwerts, und das zählt als passives Einkommen. Im Experten-Modus fällt beim Verkauf Abgeltungsteuer an (vereinfacht 17,5 % auf den Gewinn). Beim Wechsel auf die Freiheitsbahn wird das Depot zu Startkapital.</p>
  <h3>🔨 Auktionen &amp; 🤝 Handel</h3>
  <p><b>Auktion:</b> Wer ein Geschäft nicht will, kann es versteigern (Computer tun das automatisch). Der Höchstbietende übernimmt es zu den Kartenbedingungen und zahlt sein Gebot an den Verkäufer.</p>
  <p><b>Handel:</b> Im Finanzbogen kannst du während deines Zugs Vermögenswerte mit Mitspielern tauschen – gegen Bargeld, der Käufer übernimmt das Darlehen. Computer nennen dir bei Ablehnung ihre Preisvorstellung.</p>
  <h3>🧭 Coach &amp; 📈 Rückblick</h3>
  <p>Der Coach bewertet Angebote und schlägt im Finanzbogen den nächsten sinnvollen Schritt vor (abschaltbar beim Spielstart). Die Verlaufsgrafik zeigt, wann dein passives Einkommen die Ausgaben überholt; am Spielende gibt es einen persönlichen Rückblick.</p>
  <h3>📲 Als App installieren</h3>
  <p>Über den Knopf „Installieren“ oder das Browser-Menü („Zum Home-Bildschirm“) – danach im Vollbild und offline spielbar.</p>
  <h3>Computer-Gegner</h3>
  <p>🤖 Computer spielen automatisch: Sie kaufen Geschäfte mit guter Rendite, verkaufen bei guten Angeboten und tilgen teure Schulden. Ist kein Mensch mehr im Rennen, endet das Spiel.</p>
  <p class="hint">Der Spielstand wird automatisch im Browser gespeichert.</p>`, buttons:[{t:"Los geht's", cls:"gold"}]});
}

$("#btnRules").onclick = rules;
function resetGame(){ clearTimeout(aiTimer); mq.length=0; closeModal(); store.del(SAVE_KEY); S=null; renderSetup(); }
$("#btnNew").onclick = ()=>{
  if(!S || S.over) return resetGame();
  modal({title:"Neues Spiel?", body:"<p>Das aktuelle Spiel wird verworfen.</p>", buttons:[{t:"Abbrechen", cls:"sec"},{t:"Neu beginnen", cls:"red", fn:resetGame}]});
};

// ---------- Installierbare App (PWA) ----------
let installEvt = null;
const isStandalone = () => window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
try {
  if("serviceWorker" in navigator && location.protocol==="https:" && !/claude\.ai|claudeusercontent/.test(location.host))
    navigator.serviceWorker.register("sw.js").catch(()=>{});
} catch(e) {}
window.addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); installEvt = e; if(!isStandalone()) $("#btnInstall").classList.remove("hidden"); });
window.addEventListener("appinstalled", ()=>{ installEvt = null; $("#btnInstall").classList.add("hidden"); });
function installHelp(){
  if(installEvt){ installEvt.prompt(); installEvt.userChoice.finally(()=>{ installEvt=null; $("#btnInstall").classList.add("hidden"); }); return; }
  modal({title:"Als App installieren", icon:"📲", body:`
    <p>So landet Geldfluss als App auf deinem Startbildschirm – im Vollbild und auch <b>ohne Internet</b> spielbar:</p>
    <div class="facts"><span>📱 iPhone / iPad (Safari)</span><span>Teilen ⬆️ → „Zum Home-Bildschirm“</span>
    <span>🤖 Android (Chrome)</span><span>Menü ⋮ → „App installieren“</span>
    <span>💻 PC (Chrome / Edge)</span><span>Install-Symbol in der Adressleiste</span></div>
    <p class="hint">Offline funktioniert es über die Adresse mr1357369.github.io/geldfluss – nach dem ersten Öffnen mit Internet.</p>`,
    buttons:[{t:"OK", cls:"gold"}]});
}
$("#btnInstall").onclick = installHelp;
if(isIOS && !isStandalone() && location.protocol==="https:") $("#btnInstall").classList.remove("hidden");
renderSetup();
</script>
