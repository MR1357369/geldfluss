<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3d2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Geldfluss – Raus aus dem Hamsterrad</title>
<style>
:root{
  --bg:#f4f1ea; --panel:#fffdf8; --ink:#1d2a24; --muted:#6b756f; --line:#e3ddd0;
  --green:#0f3d2e; --accent:#d9a62e; --good:#2e7d32; --bad:#c62828;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
header{background:var(--green);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:20px;margin:0;letter-spacing:.5px}
header h1 span{color:var(--accent)}
header .sp{flex:1}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:8px 14px;background:var(--green);color:#fff;font-weight:600}
button:hover{filter:brightness(1.15)}
button:disabled{opacity:.4;cursor:not-allowed;filter:none}
button.sec{background:#e9e4d8;color:var(--ink)}
button.gold{background:var(--accent);color:#1d2a24}
button.red{background:var(--bad)}
button.sm{padding:4px 9px;font-size:13px;border-radius:6px}
input,select{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:#fff}
main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;padding:16px;max-width:1300px;margin:0 auto}
@media(max-width:980px){main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
/* Board */
.board{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(7,1fr);gap:5px;aspect-ratio:1;max-width:720px;margin:0 auto}
.cell{border-radius:9px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:600;text-align:center;position:relative;padding:2px;min-height:0;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.cell .ic{font-size:22px;line-height:1.1}
@media(max-width:600px){.cell .ic{font-size:16px}.cell .lb{display:none}}
.cell.hl{outline:3px solid var(--accent);outline-offset:1px}
.tokens{position:absolute;bottom:2px;left:2px;right:2px;display:flex;gap:2px;justify-content:center;flex-wrap:wrap}
.tok{width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.center{grid-row:2/7;grid-column:2/7;background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px;text-align:center}
.center h2{margin:0;font-size:20px}
.dice{display:flex;gap:10px}
.die{width:54px;height:54px;border-radius:10px;background:#fff;border:2px solid var(--ink);font-size:30px;font-weight:800;display:flex;align-items:center;justify-content:center}
.die.roll{animation:sh .4s}
@keyframes sh{0%{transform:rotate(0)}25%{transform:rotate(-20deg)}50%{transform:rotate(15deg)}100%{transform:rotate(0)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
/* Sheet */
.ptabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.ptab{padding:5px 10px;border-radius:20px;background:#eee8da;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.ptab.act{background:var(--green);color:#fff}
.ptab .tok{width:11px;height:11px;border-width:1px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:14px 0 6px}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:3px 2px;border-bottom:1px dashed var(--line);vertical-align:middle}
td.r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:700;border-bottom:2px solid var(--ink)}
.big{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:#f0ebdf;border-radius:10px;padding:8px 10px}
.kpi b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted);font-size:12px}
.pos{color:var(--good)} .neg{color:var(--bad)}
.bar{height:12px;background:#e6e0d2;border-radius:6px;overflow:hidden;margin-top:6px}
.bar div{height:100%;background:linear-gradient(90deg,var(--accent),var(--good));transition:width .4s}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.log{max-height:220px;overflow:auto;font-size:13px;color:#39443e}
.log div{padding:3px 0;border-bottom:1px solid #f0ebe0}
/* Modal */
.ov{position:fixed;inset:0;background:rgba(15,25,20,.55);display:flex;align-items:center;justify-content:center;padding:14px;z-index:10}
.modal{background:var(--panel);border-radius:14px;max-width:520px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.mh{padding:14px 18px;color:#fff;border-radius:14px 14px 0 0;font-weight:700;font-size:18px;display:flex;gap:10px;align-items:center}
.mb{padding:16px 18px}
.mb p{margin:0 0 10px}
.mf{padding:0 18px 16px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.facts{display:grid;grid-template-columns:1fr auto;gap:4px 14px;background:#f3eee2;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14px}
.facts span:nth-child(even){text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.sellrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
/* Setup */
.setup{max-width:640px;margin:30px auto;padding:0 16px}
.setup .panel{padding:22px}
.prow{display:grid;grid-template-columns:22px 1fr 1fr;gap:8px;align-items:center;margin-bottom:8px}
.hint{color:var(--muted);font-size:13px}
.hidden{display:none!important}
.pcard input[type=text],.pcard input:not([type]){min-width:0;width:100%}
.setup,.setup .panel{min-width:0;overflow:hidden}
.pcard{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:6px 8px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff}
.pcard .psel{grid-column:2/4;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px;min-width:0}
.pcard select{min-width:0;width:100%}
.aichk{font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:4px;cursor:pointer}
.aichk input{width:18px;height:18px;min-height:0}
.owners{position:absolute;top:2px;right:2px;display:flex;gap:1px}
.tok.own{width:9px;height:9px;border-width:1px}
.board.fastboard{background:linear-gradient(135deg,#f6e7b8,#e9c96b);padding:6px;border-radius:14px}
.board.fastboard .center{background:#fffaf0}
table.results td{padding:7px 4px;vertical-align:top}
.rc{background:#fdf3d8;border-left:4px solid var(--accent);border-radius:8px;padding:8px 10px;font-size:13.5px;margin:8px 0}
ul.rep{margin:4px 0 8px;padding-left:18px;font-size:14px} ul.rep li{margin:4px 0}
.facts + .facts{margin-top:6px}
.wdchk{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin-top:10px;cursor:pointer}
.wdchk input{width:18px;height:18px;min-height:0;margin-top:2px;flex:none}
.coach{background:#e8f1fb;border-left:4px solid #1565c0;border-radius:8px;padding:8px 10px;font-size:13.5px;margin:8px 0}
.coach.good{background:#e8f5e9;border-color:#2e7d32} .coach.bad{background:#fdecea;border-color:#c62828}
.chart{width:100%;height:auto;display:block;margin-top:6px} .chart text{font-size:9px;fill:#6b756f}
.clegend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:2px}
.clegend i{display:inline-block;width:10px;height:3px;margin-right:4px;vertical-align:3px}
details.hist,details.review{margin-top:8px} details summary{cursor:pointer;font-weight:600;font-size:14px}
details.review{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
.bidrow{display:grid;grid-template-columns:1fr 130px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.bidrow input{width:100%}
.trade label{display:block;font-size:13px;color:var(--muted);margin:8px 0 3px} .trade select,.trade input{width:100%}
.cmini{width:80%;max-width:220px}
.cmini .bar{height:8px;margin-top:3px}
/* Touch & Mobil */
html{-webkit-text-size-adjust:100%}
body{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
header{padding-top:calc(10px + env(safe-area-inset-top));padding-left:calc(16px + env(safe-area-inset-left));padding-right:calc(16px + env(safe-area-inset-right))}
@media (pointer:coarse){
  button{min-height:44px}
  button.sm{min-height:38px;padding:6px 12px}
  input,select{font-size:16px;min-height:44px}
}
#mnav{display:none}
@media(max-width:760px){
  header .hint{display:none}
  header{padding-bottom:8px}
  header h1{font-size:18px}
  main{padding:10px 8px calc(78px + env(safe-area-inset-bottom));gap:10px}
  .board{gap:3px}
  .cell{border-radius:6px}
  .center{gap:6px;padding:6px;border-radius:10px}
  .center h2{font-size:16px}
  .center .hint{font-size:12px}
  .die{width:42px;height:42px;font-size:24px}
  .legend{font-size:11px;gap:4px 10px}
  .sellrow{flex-wrap:wrap}
  .setup{margin:14px auto}
  .setup .panel{padding:16px}
  .pcard .psel{grid-template-columns:minmax(0,1fr)}
  .aichk .lbl{display:none}
  .cell .lb{display:none}
}
@media(max-width:980px){
  main{padding-bottom:calc(78px + env(safe-area-inset-bottom))}
  #game[data-mv="board"] #colSide{display:none}
  #game[data-mv="sheet"] #colBoard, #game[data-mv="sheet"] #logPanel{display:none}
  #game[data-mv="log"] #colBoard, #game[data-mv="log"] #sheet{display:none}
  #game[data-mv="log"] #logPanel{margin-top:0!important}
  #game[data-mv="log"] .log{max-height:none}
  #mnav:not(.hidden){display:flex;position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--green);padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:6px;box-shadow:0 -4px 14px rgba(0,0,0,.2)}
  #mnav button{flex:1;background:transparent;color:#cfe0d6;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 4px}
  #mnav button span{font-size:20px}
  #mnav button.act{background:rgba(255,255,255,.14);color:#fff}
  /* Dialoge als Bottom-Sheet */
  .ov{align-items:flex-end;padding:0}
  .modal{border-radius:18px 18px 0 0;max-height:88vh;padding-bottom:env(safe-area-inset-bottom)}
  .mh{border-radius:18px 18px 0 0}
  .mf button{flex:1}
  #colSide{max-width:720px;margin:0 auto;width:100%}
}
</style>
</head>
<body>
<header>
  <h1>Geld<span>fluss</span></h1>
  <div class="hint" style="color:#cfe0d6">Raus aus dem Hamsterrad – baue passives Einkommen auf</div>
  <div class="sp"></div>
  <button class="gold sm hidden" id="btnInstall">📲 Installieren</button>
  <button class="sec sm" id="btnRules">Regeln</button>
  <button class="sec sm" id="btnNew">Neues Spiel</button>
</header>

<div id="setup" class="setup"></div>
<main id="game" class="hidden" data-mv="board">
  <div id="colBoard">
    <div class="board" id="board"></div>
    <div class="legend" id="legend"></div>
  </div>
  <div id="colSide">
    <div class="panel" id="sheet"></div>
    <div class="panel" id="logPanel" style="margin-top:16px">
      <h3 style="margin-top:0">Verlauf</h3>
      <div class="log" id="log"></div>
    </div>
  </div>
</main>
<nav id="mnav" class="hidden">
  <button data-v="board" class="act"><span>🎲</span>Spiel</button>
  <button data-v="sheet"><span>📊</span>Finanzen</button>
  <button data-v="log"><span>📜</span>Verlauf</button>
</nav>
<div id="modalRoot"></div>

<script>
"use strict";
// ---------- Hilfen ----------
const $ = s => document.querySelector(s);
const eur = n => (n<0?"−":"") + Math.abs(Math.round(n)).toLocaleString("de-DE") + " €";
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const step = (a,b,s) => a + s*rnd(0, Math.floor((b-a)/s));
const uid = () => Math.random().toString(36).slice(2,9);
const COLORS = ["#e53935","#1e88e5","#fdd835","#8e24aa","#43a047","#fb8c00"];
const SAVE_KEY = "geldfluss-v1";

// ---------- Berufe (eigene Werte, monatlich) ----------
const PROFS = [
  {n:"Verkäufer:in",      salary:2800, tax:480,  wohnen:[750,0],      auto:[180,6000],  karte:[80,2500],  studium:[0,0],     sonst:700,  kind:120, savings:600},
  {n:"Pflegefachkraft",   salary:3400, tax:650,  wohnen:[850,0],      auto:[220,8000],  karte:[90,3000],  studium:[0,0],     sonst:900,  kind:140, savings:800},
  {n:"Elektriker:in",     salary:3600, tax:720,  wohnen:[880,0],      auto:[300,12000], karte:[110,3500], studium:[0,0],     sonst:900,  kind:140, savings:900},
  {n:"Polizist:in",       salary:3900, tax:800,  wohnen:[900,0],      auto:[260,10000], karte:[90,3000],  studium:[0,0],     sonst:1000, kind:160, savings:1000},
  {n:"Lehrkraft",         salary:4100, tax:900,  wohnen:[950,0],      auto:[250,9000],  karte:[100,3000], studium:[150,9000], sonst:950,  kind:170, savings:1200},
  {n:"Bauleiter:in",      salary:5200, tax:1300, wohnen:[1100,190000],auto:[350,14000], karte:[120,4000], studium:[0,0],     sonst:1200, kind:220, savings:1500},
  {n:"Ingenieur:in",      salary:6200, tax:1700, wohnen:[1300,230000],auto:[450,18000], karte:[150,5000], studium:[150,12000],sonst:1400, kind:220, savings:2000},
  {n:"Ärzt:in",           salary:11000,tax:3600, wohnen:[2200,420000],auto:[700,30000], karte:[300,10000],studium:[600,60000],sonst:2200, kind:300, savings:3500},
];

// ---------- Träume ----------
const DREAMS = [
  {n:"Weltreise mit der Familie", i:"🌍", cost:150000},
  {n:"Segelyacht",                i:"⛵", cost:220000},
  {n:"Haus am See",               i:"🏡", cost:300000},
  {n:"Eigene Stiftung",           i:"🎗️", cost:250000},
  {n:"Bildungsfonds für Kinder",  i:"🎓", cost:120000},
  {n:"Eigenes Restaurant",        i:"🍽️", cost:200000},
  {n:"Oldtimer-Sammlung",         i:"🚘", cost:180000},
  {n:"Weingut in der Toskana",    i:"🍇", cost:350000},
  {n:"Sabbatjahr auf Hawaii",     i:"🌺", cost:100000},
  {n:"Tierheim gründen",          i:"🐾", cost:160000},
];

// ---------- Spielfeld Hamsterrad ----------
const FT = {
  zahltag:   {l:"Zahltag",     i:"💶", c:"#2e7d32"},
  chance:    {l:"Gelegenheit", i:"💡", c:"#1565c0"},
  markt:     {l:"Markt",       i:"📈", c:"#6a1b9a"},
  konsum:    {l:"Konsum",      i:"🛍️", c:"#c62828"},
  kind:      {l:"Nachwuchs",   i:"👶", c:"#ef6c00"},
  spende:    {l:"Spende",      i:"🤝", c:"#00838f"},
  kuendigung:{l:"Kündigung",   i:"📦", c:"#455a64"},
};
const BOARD = ["zahltag","chance","konsum","chance","markt","chance",
               "zahltag","chance","kind","chance","konsum","chance",
               "zahltag","chance","markt","chance","spende","chance",
               "zahltag","chance","konsum","chance","markt","kuendigung"];

// ---------- Spielfeld Freiheitsbahn ----------
const FTF = {
  fzahltag:{l:"Geldfluss-Tag", i:"💰", c:"#2e7d32"},
  invest:  {l:"Investition",   i:"🏗️", c:"#1565c0"},
  traum:   {l:"Traum",         i:"🌟", c:"#a87800"},
  risiko:  {l:"Risiko",        i:"⚡", c:"#c62828"},
  wagnis:  {l:"Wagnis",        i:"🎯", c:"#6a1b9a"},
  stiftung:{l:"Stiftung",      i:"🤝", c:"#00838f"},
};
const FAST = ["fzahltag","invest","traum","invest","risiko","traum",              "fzahltag","invest","wagnis","traum","invest","invest",              "fzahltag","invest","traum","invest","stiftung","risiko",              "fzahltag","invest","traum","invest","wagnis","traum"];
const FAST_GOAL = 50000;   // Ziel B: Freiheits-Cashflow um diesen Betrag steigern
const FAST_MULT = 10;      // Startwert Freiheits-Cashflow = passives Einkommen × 10
const WAGNIS_COST = 25000, WAGNIS_WIN = 250000;

// ---------- Experten-Modus (realistischere Regeln) ----------
const EX = {
  nk:0.10,          // Kaufnebenkosten: Grunderwerbsteuer, Notar, Makler
  reserve:0.0005,   // Instandhaltungsrücklage pro Monat (≈ 0,6 % des Kaufpreises pro Jahr)
  insure:0.00015,   // Versicherungsprämie pro Monat in % der Immobilienwerte
  rentCost:0.15,    // nicht umlagefähige Bewirtschaftungskosten in % der Miete
  shortBind:15, longBind:40, longExtra:0.005,   // Zinsbindung in Runden, Aufschlag für lange Bindung
  inflEvery:20,     // alle 20 Runden (≈ 1 Spieljahr) Inflation
  vacancy:1/25, repair:1/30, failKlein:1/120, failGewerbe:1/200, stockTax:0.25,
  rateMin:0.015, rateMax:0.07, rateStart:0.035,
};
const XP = () => !!(S && S.expert);
const isProp = a => ["wohnung","haus","garage","gewerbe"].includes(a.cat);
const pct = r => (r*100).toFixed(1).replace(".",",")+" %";
function taxRate(p){ const s = PROFS[p.prof].salary; return s<3500?0.25 : s<4500?0.30 : s<7000?0.37 : 0.42; }
// Vermögenswerte im Experten-Modus mit realistischem Mietmodell versehen
function expertize(c){
  if(c.kind!=="asset") return c;
  if(c.cat==="anleihe"){ c.cf = Math.max(5, Math.round(c.price*0.0025/5)*5); c.text = "Sichere Anleihe mit rund 3 % Zinsen pro Jahr. Kann nicht weiterverkauft werden."; return c; }
  if(c.cat==="klein"){ c.cf = Math.round(c.price*pick([0.012,0.016,0.02,0.025])/5)*5; c.risk = true; return c; }
  let y2 = 0;
  const y0 = c.cat==="gewerbe" ? pick([0.07,0.08,0.09,0.1]) : c.cat==="haus" ? pick([0.06,0.065,0.07,0.075,0.08,0.085]) : pick([0.055,0.06,0.065,0.07,0.075,0.08]);
  // Schnäppchen: Zwangsversteigerung / Sanierungsfall unter Marktwert
  if((c.cat==="wohnung"||c.cat==="haus") && Math.random()<0.35){
    y2 = pick([0.09,0.1,0.11]);
    c.title = "Zwangsversteigerung: " + c.title.replace(" zu verkaufen","");
    c.text = "Unter Marktwert ersteigert – solche Schnäppchen sind selten und oft mit Sanierungsstau verbunden. Hier entsteht die Rendite beim Einkauf.";
  }
  // Banken verlangen für größere Objekte rund 20 % Eigenkapital (plus Nebenkosten); Wohnungen oft bis 90 % finanziert
  if(c.cat==="haus"||c.cat==="gewerbe") c.down = Math.max(c.down, Math.round(c.price*0.2/1000)*1000);
  const y = y2 || y0;
  c.rent = Math.round(c.price*y/12/10)*10;
  c.costs = Math.round(c.rent*EX.rentCost/5)*5;
  c.nk = Math.round(c.price*EX.nk/500)*500;
  c.expert = true; if(c.cat==="gewerbe") c.risk = true;
  return c;
}
// Cashflow vor Steuern je nach Zinsbindung
function exCf(c, long){ const rate = S.rate + (long?EX.longExtra:0); return Math.round((c.rent - c.costs - (c.price-c.down)*rate/12)/5)*5; }
// Netto-Cashflow eines Objekts: nach Rücklage und Steuer (Steuer erst nach Abschreibung)
function exNet(c, cf, tr){
  const afa = c.price*0.8*0.02/12, res = c.price*EX.reserve;
  return Math.round(cf - res - Math.max(0, cf - afa)*tr);
}
// Monatliche Zusatzkosten im Experten-Modus
function exExtras(p){
  if(!XP() || p.fast) return {tax:0,res:0,ins:0,afa:0};
  const props = p.assets.filter(isProp);
  const afa = props.reduce((s,a)=>s+a.price*0.8*0.02/12,0);   // Abschreibung: 2 % p.a. auf den Gebäudeanteil (80 %)
  return {
    afa: Math.round(afa),
    tax: Math.round(Math.max(0, passive(p) - afa)*taxRate(p)),
    res: props.reduce((s,a)=>s+Math.round(a.price*EX.reserve),0),
    ins: p.insured ? Math.round(props.reduce((s,a)=>s+a.price,0)*EX.insure) : 0,
  };
}
const netPassive = p => { const x = exExtras(p); return passive(p) - x.tax - x.res - x.ins; };

function exPayday(p){
  const msgs = [];
  p.reserve = (p.reserve||0) + exExtras(p).res;
  for(const a of [...p.assets]){
    if(isProp(a)){
      if(a.mortgage>0 && a.fixedUntil && S.round>=a.fixedUntil){
        const old = a.rate ?? S.rate, d = Math.round(a.mortgage*(S.rate-old)/12);
        a.cf -= d; a.rate = S.rate; a.fixedUntil = S.round + EX.shortBind;
        msgs.push(`🏦 Zinsbindung für ${a.name} ausgelaufen: Anschlusszins ${pct(S.rate)} statt ${pct(old)} → Cashflow ${d>0?"−":"+"}${eur(Math.abs(d))}/Monat.`);
      }
      if(Math.random()<EX.vacancy){
        const u = a.units||1, lost = Math.round((a.rent||Math.max(100,a.cf))/u*Math.max(1,Math.ceil(u/4)));
        if(p.insured) msgs.push(`🏚️ Leerstand in ${a.name}: ${eur(lost)} Mietausfall – übernimmt die Versicherung.`);
        else { pay(p,lost,"Leerstand"); msgs.push(`🏚️ Leerstand in ${a.name}: ${eur(lost)} Mietausfall.`); }
      }
      if(Math.random()<EX.repair){
        const cost = Math.round(a.price*pick([0.01,0.015,0.02,0.03])/100)*100, what = pick(["Heizung","Dach","Fenster","Wasserschaden","Fassade","Elektrik"]);
        const fromRes = Math.min(p.reserve||0, cost); p.reserve -= fromRes; let rest = cost-fromRes;
        let t = `🔧 Reparatur an ${a.name} (${what}): ${eur(cost)}`;
        if(fromRes) t += `, davon ${eur(fromRes)} aus der Rücklage`;
        if(rest>0 && p.insured && cost>=a.price*0.02){ t += `, Rest ${eur(rest)} zahlt die Versicherung`; rest = 0; }
        if(rest>0){ pay(p,rest,"Reparatur"); t += `, ${eur(rest)} aus eigener Tasche`; }
        msgs.push(t+".");
      }
    }
    if(a.cat==="klein" && p.assets.includes(a) && Math.random()<EX.failKlein){
      p.assets = p.assets.filter(x=>x!==a);
      msgs.push(`💥 ${a.name} ist gescheitert – Totalverlust von ${eur(a.price)}.`);
    }
    if(a.cat==="gewerbe" && p.assets.includes(a) && Math.random()<EX.failGewerbe){
      p.assets = p.assets.filter(x=>x!==a);
      const rest = Math.round(a.price*0.6) - a.mortgage;   // Zwangsverkauf zu 60 %
      if(rest>=0) p.cash += rest; else p.loan += Math.ceil(-rest/1000)*1000;
      msgs.push(`💥 ${a.name} ist pleite und wird für ${eur(a.price*0.6)} zwangsverkauft – ${rest>=0?`dir bleiben ${eur(rest)}`:`das Darlehen ist nicht gedeckt, ${eur(-rest)} bleiben als Bankkredit`}.`);
    }
  }
  msgs.forEach(m=>log(`${nm(p)}: ${m}`));
  if(!p.ai) S.report = (S.report||[]).concat(msgs);
}

  const mine = p.ai ? [] : p.assets.filter(a=>a.cat===c.cat);
  if(!mine.length) return "";
  const a = mine[0], eq = (a.down||(a.price-a.mortgage)) + (a.nk||0), net = c.offer(a) - a.mortgage, x = net/Math.max(1,eq);
  const t = x>=2 ? `Ein Verkauf brächte das <b>${x.toFixed(1).replace(".",",")}-fache</b> deines Eigenkapitals. Lohnt sich, wenn du das Geld in etwas mit mehr Cashflow steckst – du verlierst ${eur(a.cf)}/Monat.` :
            x>=1 ? `Verkauf bringt nur das ${x.toFixed(1).replace(".",",")}-fache deines Einsatzes – dafür gibst du ${eur(a.cf)}/Monat Cashflow auf. Eher behalten.` :
                   `Verkauf mit Verlust – nur sinnvoll, wenn das Objekt dich monatlich Geld kostet.`;
  return coachBox(t, x>=2?"good":"bad");
}
// Nächster sinnvoller Schritt für den Finanzbogen
function coachNext(p){
  if(!S.coach || p.ai || p.fast || p.free || p.bankrupt) return "";
  const bd = bestDebt(p), buffer = 1000;
  let t;
  if(bd && bd.k!=="wohnen" && p.cash >= bd.debt + buffer) t = `Tilge die <b>${bd.n}</b> (${eur(bd.debt)}): spart ${eur(bd.pay)} pro Monat – das sind ${pctN(bd.y)} „Rendite“ pro Jahr, garantiert.`;
  else if(p.loan>=1000 && p.cash >= 1000 + buffer*2) t = `Zahle Bankkredit zurück: Jeder Tausender spart 10 € pro Monat (12 % p.a.).`;
  else if(XP() && !p.insured && p.assets.filter(isProp).length>=2) t = `Du hast mehrere Immobilien – eine <b>Versicherung</b> schützt vor Leerstand und Großschäden.`;
  else if(cashflow(p)<0) t = `⚠️ Dein Cashflow ist <b>negativ</b>. Verkaufe Verlustbringer oder tilge Schulden, sonst droht die Insolvenz.`;
  else if(p.cash < buffer) t = `Baue erst ein kleines <b>Polster</b> auf – sonst zwingen dich Konsum-Felder in teure Kredite.`;
  else if(bd && bd.k!=="wohnen") t = `Spare auf die Tilgung der <b>${bd.n}</b> (noch ${eur(bd.debt - p.cash)}) oder nutze ein Geschäft mit mehr als ${pctN(bd.y)} Rendite.`;
  else if(!etfOf(p).rate && !etfOf(p).withdraw && cashflow(p) > 500) t = `Ein kleiner <b>ETF-Sparplan</b> (z. B. 100–250 € pro Zahltag) baut nebenbei verlässlich Vermögen auf – langsam, aber breit gestreut. Für große Geschäfte solltest du trotzdem Bargeld behalten.`;
  else if(etfValue(p)>0 && !etfOf(p).withdraw && passive(p) + Math.round(etfValue(p)*ETF.wdRate/12) >= expenses(p)*S.goal) t = `Mit dem <b>4-%-Entnahmeplan</b> deines ETF-Depots würdest du jetzt ausbrechen!`;
  else t = `Halte Ausschau nach Geschäften mit ${XP()?"mindestens 5 % Netto":"über 12 %"}-Rendite aufs Eigenkapital.`;
  const gap = Math.max(0, expenses(p)*S.goal - passive(p));
  return coachBox(`${t}<br><span class="hint">Bis zum Ausbruch fehlen noch <b>${eur(gap)}</b> passives Einkommen pro Monat.</span>`);
}
// Kleine Liniengrafik: passives Einkommen vs. Ausbruch-Ziel
function chartSVG(h){
  if(!h || h.length<2) return `<p class="hint">Die Grafik erscheint nach ein paar Runden.</p>`;
  const W=320, H=130, L=34, B=18, T=8, R=6;
  const maxY = Math.max(...h.map(x=>Math.max(x.pas,x.exp)), 100), minY = Math.min(0, ...h.map(x=>x.pas));
  const r0 = h[0].r, r1 = h[h.length-1].r || r0+1;
  const X = r => L + (r-r0)/Math.max(1,r1-r0)*(W-L-R), Y = v => T + (maxY-v)/(maxY-minY)*(H-T-B);
  const line = k => h.map((x,i)=>`${i?"L":"M"}${X(x.r).toFixed(1)},${Y(x[k]).toFixed(1)}`).join("");
  const cross = h.find(x=>x.pas>=x.exp && x.pas>0);
  const k = v => v>=1000 ? Math.round(v/1000)+"k" : Math.round(v);
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Verlauf passives Einkommen und Ziel">
    <line x1="${L}" y1="${Y(0)}" x2="${W-R}" y2="${Y(0)}" stroke="#ccc"/>
    <text x="${L-4}" y="${Y(maxY)+4}" text-anchor="end">${k(maxY)}</text><text x="${L-4}" y="${Y(0)+4}" text-anchor="end">0</text>
    <text x="${L}" y="${H-3}">R ${r0}</text><text x="${W-R}" y="${H-3}" text-anchor="end">R ${r1}</text>
    <path d="${line("exp")}" fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="5 3"/>
    <path d="${line("pas")}" fill="none" stroke="#2e7d32" stroke-width="2.5"/>
    ${cross?`<circle cx="${X(cross.r)}" cy="${Y(cross.pas)}" r="4.5" fill="#d9a62e" stroke="#fff" stroke-width="1.5"/>`:""}
  </svg><div class="clegend"><span><i style="background:#2e7d32"></i>Passives Einkommen</span><span><i style="background:#c62828"></i>Ausbruch-Ziel (Ausgaben)</span>${cross?`<span><i style="background:#d9a62e"></i>Ausbruch</span>`:""}</div>`;
}
const P = () => S.players[S.cur];
const passive = p => p.assets.reduce((s,a)=>s+a.cf,0) + etfW(p);

// ---------- ETF-Sparplan (Weltindex) ----------
// ≈ 20 Runden = 1 Jahr: im Schnitt ~7 % Rendite p.a., ~11 % Grundschwankung p.a. plus Crash-/Rally-Ereignisse
const ETF = {drift:0.0035, vol:0.024, wdRate:0.04, tax:0.25*0.7};
function etfS(){ return S.etf || (S.etf = {price:100, hist:[100]}); }
function etfOf(p){ return p.etf || (p.etf = {units:0, invested:0, rate:0, withdraw:false}); }
const etfValue = p => p.etf ? Math.round(p.etf.units * etfS().price) : 0;
const etfW = p => (p.etf && p.etf.withdraw && !p.fast) ? Math.round(etfValue(p)*ETF.wdRate/12) : 0;
function gauss(){ let u=0,v=0; while(!u) u=Math.random(); while(!v) v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function etfTick(){
  const e = etfS(); e.price = Math.max(5, e.price*(1 + ETF.drift + ETF.vol*gauss()));
  e.hist.push(+e.price.toFixed(2)); if(e.hist.length>400) e.hist = e.hist.filter((x,i)=>i%2===0);
}
function etfBuy(p, amt){
  const e = etfOf(p); if(amt<=0 || p.cash<amt) return false;
  p.cash -= amt; e.units += amt/etfS().price; e.invested += amt; return true;
}
// Verkauf: Steuer im Experten-Modus auf den Gewinnanteil (25 % mit 30 % Teilfreistellung, vereinfacht)
function etfSell(p, amt){
  const e = etfOf(p), v = etfValue(p); if(v<=0) return 0;
  amt = Math.min(amt, v); const share = amt/v, cost = e.invested*share, gain = amt - cost;
  const tax = XP() && gain>0 ? Math.round(gain*ETF.tax) : 0;
  e.units *= (1-share); e.invested -= cost; if(e.units < 1e-6){ e.units = 0; e.invested = 0; }
  p.cash += amt - tax; st(p).etfGain = (st(p).etfGain||0) + gain;
  return tax;
}
// Am Zahltag: Sparrate investieren bzw. Entnahme aus dem Depot verbuchen
function etfPayday(p){
  const e = p.etf; if(!e || p.fast) return;
  if(e.withdraw){
    const w = Math.round(etfValue(p)*ETF.wdRate/12) || 0; if(w<=0) return;
    const v = etfValue(p), share = w/v; e.units *= (1-share); e.invested *= (1-share);   // Geld kam schon über den Cashflow
  } else if(e.rate>0){
    if(p.cash >= e.rate + 500){ etfBuy(p, e.rate); }
    else log(`📈 ${nm(p)}: ETF-Sparrate ausgesetzt – zu wenig Bargeld.`);
  }
}
function etfSection(p, isCur){
  const e = etfOf(p), es = etfS(), v = etfValue(p), gain = v - Math.round(e.invested), ch = es.price/100 - 1;
  const rates = [0,100,250,500,1000];
  if(!rates.includes(e.rate)) rates.push(e.rate);
  const wd = Math.round(v*ETF.wdRate/12);
  return `<h3>📈 ETF-Sparplan (Weltindex)</h3>
    <div class="row" style="justify-content:space-between;font-size:14px"><span>Kurs <b>${es.price.toFixed(2).replace(".",",")}</b> <span class="${ch>=0?"pos":"neg"}">(${ch>=0?"+":""}${pctN(ch)} seit Start)</span></span><span>Depot <b>${eur(v)}</b></span></div>
    ${spark(es.hist)}
    ${e.invested>0||v>0?`<div class="hint">Eingezahlt ${eur(Math.round(e.invested))} · <span class="${gain>=0?"pos":"neg"}">${gain>=0?"+":""}${eur(gain)}${e.invested>0?` (${gain>=0?"+":""}${pctN(gain/e.invested)})`:""}</span></div>`:""}
    ${isCur?`<div class="row" style="margin-top:6px">
        <label class="hint">Sparrate pro Zahltag
          <select onchange="setEtfRate(this.value)" ${e.withdraw?"disabled":""}>${rates.map(r=>`<option value="${r}" ${r===e.rate?"selected":""}>${r?eur(r):"keine"}</option>`).join("")}</select></label>
      </div>
      <div class="row" style="margin-top:6px">
        <button class="sm" ${p.cash<1000?"disabled":""} onclick="etfBuyOnce(1000)">+1.000 €</button>
        <button class="sm" ${p.cash<5000?"disabled":""} onclick="etfBuyOnce(5000)">+5.000 €</button>
        <button class="sm sec" ${v<=0?"disabled":""} onclick="etfSellAll()">Verkaufen</button>
      </div>
      <label class="wdchk"><input type="checkbox" ${e.withdraw?"checked":""} ${v<=0&&!e.withdraw?"disabled":""} onchange="toggleWithdraw()"><span><b>4-%-Entnahmeplan</b><br><span class="hint">zählt als passives Einkommen (${eur(wd)}/Monat), die Sparrate ruht</span></span></label>`:
      (e.rate?`<div class="hint">Sparrate: ${eur(e.rate)} pro Zahltag</div>`:"")+(e.withdraw?`<div class="hint">Entnahmeplan aktiv: ${eur(wd)}/Monat</div>`:"")}`;
}
function spark(h){
  if(!h || h.length<2) return "";
  const W=300, H=44, mx=Math.max(...h), mn=Math.min(...h);
  const pts = h.map((v,i)=>`${(i/(h.length-1)*W).toFixed(1)},${(H-3-(v-mn)/Math.max(1,mx-mn)*(H-6)).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" style="height:44px"><polyline points="${pts}" fill="none" stroke="${h[h.length-1]>=h[0]?"#2e7d32":"#c62828"}" stroke-width="2"/></svg>`;
}
// Bedienung im Finanzbogen
function setEtfRate(v){ const p = P(); etfOf(p).rate = +v; log(`📈 ${nm(p)} ${+v?`spart jetzt ${eur(+v)} pro Zahltag in den ETF`:"stoppt den ETF-Sparplan"}.`); render(); }
function etfBuyOnce(amt){ const p = P(); if(etfBuy(p, amt)){ log(`📈 ${nm(p)} kauft ETF-Anteile für ${eur(amt)} (Kurs ${etfS().price.toFixed(2).replace(".",",")}).`); render(); } }
function etfSellAll(){
  const p = P(), v = etfValue(p); if(v<=0) return;
  modal({title:"ETF-Depot verkaufen?", icon:"📈", color:"#1565c0",
    body:`<p>Depotwert: <b>${eur(v)}</b> (eingezahlt ${eur(Math.round(etfOf(p).invested))}).</p>${XP()?`<p class="hint">Auf den Gewinn fällt Abgeltungsteuer an (vereinfacht 17,5 % nach Teilfreistellung).</p>`:""}
      ${coachBox(etfS().price < Math.max(...etfS().hist)*0.85 ? "Die Kurse sind gerade deutlich gefallen. Wer jetzt verkauft, macht Buchverluste endgültig – langfristige Anleger halten durch." : "ETFs entfalten ihre Stärke über viele Jahre. Verkaufe nur, wenn du das Geld für ein deutlich besseres Geschäft brauchst.")}`,
    buttons:[{t:"Abbrechen", cls:"sec"},{t:"Alles verkaufen", cls:"red", fn:()=>{ const tax = etfSell(p, v); log(`📈 ${nm(p)} verkauft das ETF-Depot für ${eur(v)}${tax?` (${eur(tax)} Steuer)`:""}.`); checkAll(); render(); }}]});
}
function toggleWithdraw(){
  const p = P(), e = etfOf(p); e.withdraw = !e.withdraw; if(e.withdraw) e.rate = 0;
  log(e.withdraw ? `📈 ${nm(p)} startet den 4-%-Entnahmeplan: ${eur(etfW(p))} pro Monat.` : `📈 ${nm(p)} beendet den Entnahmeplan.`);
  checkAll(); render();
}
const loanPay = p => Math.round(p.loan/100); // 1 % pro Monat
const loanCap = p => PROFS[p.prof].salary*10;  // freiwilliger Kreditrahmen
// Grundwerte inkl. Inflation (nur im Experten-Modus ≠ 1)
function base(p){
  const pr = PROFS[p.prof], s = p.salF||1, f = p.infl||1;
  return {salary:Math.round(pr.salary*s), tax:Math.round(pr.tax*s), sonst:Math.round(pr.sonst*f), kind:Math.round(pr.kind*f),
          wohnen: p.debts.wohnen.debt>0 ? p.debts.wohnen.pay : Math.round(p.debts.wohnen.pay*f)};
}
function expenses(p){
  const b = base(p), x = exExtras(p);
  return b.tax + b.wohnen + p.debts.auto.pay + p.debts.karte.pay + p.debts.studium.pay + b.sonst + p.children*b.kind + loanPay(p) + x.tax + x.res + x.ins;
}
const income = p => base(p).salary + passive(p);
const cashflow = p => income(p) - expenses(p);
const dreamOf = p => DREAMS[p.dream] || DREAMS[0];
const nm = p => (p.ai?"🤖 ":"") + p.name;

function log(msg){ S.log.unshift(msg); if(S.log.length>250) S.log.length=250; }
const store = { get:k=>{try{return localStorage.getItem(k)}catch(e){return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}, del:k=>{try{localStorage.removeItem(k)}catch(e){}} };
function save(){ store.set(SAVE_KEY, JSON.stringify(S)); }

// Bezahlen – reicht das Geld nicht, wird automatisch ein Bankkredit aufgenommen
function pay(p, amount, why){
  if(amount<=0) return;
  if(p.cash < amount){
    const need = Math.ceil((amount-p.cash)/1000)*1000;
    p.loan += need; p.cash += need;
    log(`🏦 ${nm(p)} muss ${eur(need)} Kredit aufnehmen (${why}).`);
  }
  p.cash -= amount;
}

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function buildDreamFields(players){
  const fields = FAST.map((t,i)=>t==="traum"?i:-1).filter(i=>i>=0);
  const want = [...new Set(players.map(p=>p.dream))];
  const rest = shuffle(DREAMS.map((d,i)=>i).filter(i=>!want.includes(i)));
  const list = shuffle(want.concat(rest).slice(0, fields.length));
  const map = {}; fields.forEach((f,k)=>map[f]=list[k]); return map;
}
function startGame(){
  const players = [];
  for(let i=0;i<4;i++){
    const n = $("#pn"+i).value.trim(); if(!n) continue;
    let pi = +$("#pp"+i).value; if(pi<0) pi = rnd(0,PROFS.length-1);
    let di = +$("#pd"+i).value; if(di<0) di = rnd(0,DREAMS.length-1);
    players.push(newPlayer(n, pi, COLORS[i], di, $("#pa"+i).checked));
  }
  if(!players.length){ modal({title:"Keine Spieler", body:"<p>Bitte mindestens einen Namen eingeben.</p>", buttons:[{t:"OK"}]}); return; }
  S = {players, cur:0, goal:+$("#goal").value, mode:+$("#mode").value, phase:"roll", dice:[0], log:[], round:1, over:false,
       dreamFields: buildDreamFields(players), winners:[], expert: $("#diff").value==="x", rate: EX.rateStart, report:[]};
  players.forEach(p=>log(`${nm(p)} startet als ${PROFS[p.prof].n} mit ${eur(p.cash)} – Traum: ${dreamOf(p).i} ${dreamOf(p).n}.`));
  if(S.expert) log(`🎓 Experten-Modus: Marktzins ${pct(S.rate)}, Kaufnebenkosten 10 %, Steuern, Leerstand, Inflation & Co. sind aktiv.`);
  S.coach = $("#coach").checked; etfS(); recordHist();
  view = 0; showGame();
}

function bar(pct){ return `<div class="bar"><div style="width:${Math.max(0,Math.min(100,pct))}%"></div></div>`; }
function renderBoard(){
  const p = P(), fast = !!p.fast, B = fast?FAST:BOARD, M = fast?FTF:FT;
  const posOf = q => fast ? (q.fast?q.fast.pos:-1) : (q.fast?-1:q.pos);
  let h = "";
  B.forEach((t,i)=>{
    const [r,c] = ringPos(i); let f = M[t], extra = "";
    if(t==="traum"){
      const d = DREAMS[S.dreamFields[i]];
      const owners = S.players.filter(q=>q.dream===S.dreamFields[i]).map(q=>`<span class="tok own" style="background:${q.color}"></span>`).join("");
      f = {i:d.i, l:d.n, c:M.traum.c}; extra = `<div class="owners">${owners}</div>`;
    }
    const toks = S.players.filter(q=>posOf(q)===i && !q.bankrupt).map(q=>`<span class="tok" title="${q.name}" style="background:${q.color}"></span>`).join("");
    h += `<div class="cell ${posOf(p)===i?"hl":""}" style="grid-row:${r};grid-column:${c};background:${f.c}">${extra}<div class="ic">${f.i}</div><div class="lb">${f.l}</div><div class="tokens">${toks}</div></div>`;
  });
  let ctrl = "";
  if(S.over){
    ctrl = `<h2>Spiel beendet</h2><div class="row"><button onclick="showResults()">🏆 Ergebnis</button><button class="gold" onclick="resetGame()">Neues Spiel</button></div>`;
  } else if(p.ai){
    ctrl = `<div class="hint" style="font-size:15px">🤖 ${p.name} ist am Zug …</div>`;
  } else if(S.phase==="roll"){
